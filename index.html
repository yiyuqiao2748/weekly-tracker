const Actions = {
  previousWeek() {
    DataModel.state.currentWeek = WeekUtils.addWeeks(DataModel.state.currentWeek, -1);
    Storage.save(DataModel.state);
    Renderer.renderAll(DataModel.state.currentWeek);
  },

  nextWeek() {
    DataModel.state.currentWeek = WeekUtils.addWeeks(DataModel.state.currentWeek, 1);
    Storage.save(DataModel.state);
    Renderer.renderAll(DataModel.state.currentWeek);
  },

  goToToday() {
    const now = WeekUtils.getISOWeek(new Date());
    DataModel.state.currentWeek = WeekUtils.formatWeekStr(now.year, now.week);
    Storage.save(DataModel.state);
    Renderer.renderAll(DataModel.state.currentWeek);
  },

  addTask(person) {
    UndoStack.push('新增任务');
    const task = DataModel.addTask(DataModel.state.currentWeek, person);
    Renderer.renderAll(DataModel.state.currentWeek);
    // Start editing the new card's name field
    setTimeout(() => {
      const card = document.querySelector(`.task-card[data-task-id="${task.id}"]`);
      if (card) {
        const nameEl = card.querySelector('[data-field="name"]');
        if (nameEl) Editor.startEdit(nameEl, card);
      }
    }, 100);
  },

  deleteTask(taskId) {
    const idx = DataModel.state.tasks.findIndex(t => t.id === taskId);
    if (idx === -1) return;
    UndoStack.push('删除任务');
    const deleted = DataModel.state.tasks.splice(idx, 1)[0];
    DataModel.tombstone([deleted.id]);
    DataModel._save();
    Renderer.renderAll(DataModel.state.currentWeek);
    // Toast 上的撤销只把这一条放回去；走 UndoStack.undo 会连带吞掉删除之后的编辑
    Toast.showUndo(`已删除「${deleted.name || '未命名任务'}」`, () => this.undelete(deleted, idx), 8000);
  },

  undelete(task, idx) {
    if (DataModel.state.tasks.some(t => t.id === task.id)) return;
    DataModel.untombstone(task.id);   // 墓碑不清掉，下次合并它又被云端抹掉
    // 墓碑可能已经传上云了：把 updatedAt 顶到删除之后，merge 才会认这次恢复
    task.updatedAt = new Date().toISOString();
    DataModel.state.tasks.splice(Math.min(idx, DataModel.state.tasks.length), 0, task);
    DataModel._save();
    Renderer.renderAll(DataModel.state.currentWeek, true);
    Toast.show(`已恢复「${task.name || '未命名任务'}」`);
  },

  copyFromPrev() {
    UndoStack.push('复制上周未完成');
    const { copies, skipped } = DataModel.copyIncompleteFromPrev(DataModel.state.currentWeek);
    if (copies.length === 0) {
      UndoStack.discard();
      Toast.show(skipped > 0 ? `上周未完成任务本周已存在` : '上周没有未完成的任务');
      return;
    }
    Renderer.renderAll(DataModel.state.currentWeek);
    const ids = copies.map(c => c.id);
    Toast.showUndo(`已复制 ${copies.length} 个未完成任务`, () => this.uncopy(ids), 8000);
  },

  uncopy(ids) {
    const set = new Set(ids);
    DataModel.state.tasks = DataModel.state.tasks.filter(t => !set.has(t.id));
    DataModel.tombstone(ids);   // 复制出去的这几条可能已经上云了
    DataModel._save();
    Renderer.renderAll(DataModel.state.currentWeek, true);
    Toast.show('已撤销复制');
  },
};

// ======================================================================
// UndoStack — 多级撤销（任务数组快照制）
// ======================================================================
const UndoStack = {
  items: [],
  limit: 20,

  push(label) {
    if (!DataModel.state) return;
    this.items.push({
      label,
      tasks: JSON.parse(JSON.stringify(DataModel.state.tasks)),
      tombstones: JSON.parse(JSON.stringify(DataModel.state.tombstones || {})),
    });
    if (this.items.length > this.limit) this.items.shift();
  },

  undo() {
    const it = this.items.pop();
    if (!it) { Toast.show('没有可撤销的操作'); return false; }
    const before = new Set(DataModel.state.tasks.map(t => t.id));
    const after = new Set(it.tasks.map(t => t.id));
    // 撤销一次「新增」= 连云端也要拿掉，否则下次合并它又回来；
    // 撤销一次「删除」= 作废墓碑并把 updatedAt 顶到删除之后，光清本地墓碑不够，
    // 因为那份墓碑可能已经传上云了。
    const stamp = new Date().toISOString();
    it.tasks.forEach(t => { if (!before.has(t.id)) t.updatedAt = stamp; });
    const removed = [...before].filter(id => !after.has(id));
    DataModel.state.tasks = it.tasks;
    DataModel.state.tombstones = JSON.parse(JSON.stringify(it.tombstones || {}));
    if (removed.length) DataModel.tombstone(removed);
    DataModel._save();
    Renderer.renderAll(DataModel.state.currentWeek, true);
    Toast.show(`已撤销：${it.label}`);
    return true;
  },

  // 动作最后发现什么都没改时，丢掉预先入栈的快照
  discard() { this.items.pop(); },
};

// ======================================================================
// CardDrag — 拖拽排序与跨列改派（Pointer Events）
// ======================================================================
const CardDrag = {
  pending: null,
  session: null,
  _suppressClick: false,

  // 由 #board 的 pointerdown 调用；尺寸线与删除按钮不归它管
  arm(e, card) {
    if (this.session || this.pending || Editor.currentField) return;
    const s = {
      card,
      sx: e.clientX,
      sy: e.clientY,
      armed: e.pointerType !== 'touch',
      timer: 0,
    };
    // 触屏先长按 200ms 再认拖；在此之前移动都当作页面滚动
    if (!s.armed) s.timer = setTimeout(() => { s.armed = true; }, 200);
    s.onMove = ev => this._move(s, ev);
    s.onEnd = () => this._end(s);
    window.addEventListener('pointermove', s.onMove);
    window.addEventListener('pointerup', s.onEnd);
    window.addEventListener('pointercancel', s.onEnd);
    // pointermove 对触摸手势不可取消：长按生效后必须用 touchmove 掐掉页面滚动
    if (!s.armed) {
      s.onTouchMove = ev => { if (s.armed) ev.preventDefault(); };
      window.addEventListener('touchmove', s.onTouchMove, { passive: false });
    }
    this.pending = s;
  },

  _move(s, ev) {
    const d = Math.abs(ev.clientX - s.sx) + Math.abs(ev.clientY - s.sy);
    if (!s.armed) {
      if (d > 12) this._end(s);
      return;
    }
    if (!this.session) {
      if (d < 6) return;
      this._engage(s);
    }
    ev.preventDefault();
    this._place(ev.clientX, ev.clientY);
  },

  _engage(s) {
    clearTimeout(s.timer);
    this.session = s;
    UndoStack.push('拖拽排序');
    s.card.classList.add('dragging');
    document.getElementById('board').classList.add('drag-active');
  },

  _place(x, y) {
    const el = document.elementFromPoint(x, y);
    const col = el && el.closest ? el.closest('.column') : null;
    const body = col && col.querySelector('.column-body');
    if (!body) return;
    const dragged = this.session.card;
    body.classList.remove('empty');
    let ref = null;
    body.querySelectorAll('.task-card').forEach(c => {
      if (ref || c === dragged) return;
      const r = c.getBoundingClientRect();
      if (y < r.top + r.height / 2) ref = c;
    });
    if (ref) body.insertBefore(dragged, ref);
    else body.appendChild(dragged);
  },

  _end(s) {
    window.removeEventListener('pointermove', s.onMove);
    window.removeEventListener('pointerup', s.onEnd);
    window.removeEventListener('pointercancel', s.onEnd);
    if (s.onTouchMove) window.removeEventListener('touchmove', s.onTouchMove);
    clearTimeout(s.timer);
    if (this.session) this._commit();
    if (this.pending === s) this.pending = null;
    this.session = null;
  },

  _commit() {
    const board = document.getElementById('board');
    this.session.card.classList.remove('dragging');
    board.classList.remove('drag-active');
    this._suppressClick = true;

    const slots = [];
    board.querySelectorAll('.column').forEach(col => {
      const person = C.MEMBERS[Number(col.id.split('-')[1])];
      col.querySelectorAll('.column-body > .task-card').forEach(c =>
        slots.push({ id: c.dataset.taskId, person }));
    });

    let moved = 0, reassigned = 0;
    slots.forEach((slot, i) => {
      const t = DataModel.state.tasks.find(x => x.id === slot.id);
      if (!t) return;
      const wasPerson = t.person;
      let hit = false;
      if (t.order !== i) { t.order = i; hit = true; }
      if (t.person !== slot.person) { t.person = slot.person; hit = true; reassigned++; }
      if (hit) {
        t.updatedAt = new Date().toISOString();
        if (wasPerson !== t.person) DataModel._record(t, 'person', wasPerson, t.person);
        moved++;
      }
    });

    if (!moved) { UndoStack.discard(); return; }   // 没真的挪动，不留空快照
    DataModel._save();
    Renderer.renderAll(DataModel.state.currentWeek, true);
    Toast.show(reassigned ? `已改派 ${reassigned} 个任务` : '已调整顺序');
  },

  // 拖完会紧跟一个 click，吞掉它以免误开编辑
  consumeClick() {
    if (!this._suppressClick) return false;
    this._suppressClick = false;
    return true;
  },
};

// ======================================================================
// App — Entry point
// ======================================================================
const App = {
  async init() {
    this.initTheme();
    // Load local first for instant render
    const state = Storage.load();
    // 周次属于视图状态而非数据：每次打开页面都落在本周，不沿用上次浏览位置
    state.currentWeek = Storage.getDefault().currentWeek;
    DataModel.init(state);
    this.bindToolbar();
    this.bindBoardDelegation();
    this.bindSettings();
    this.bindGlobalKeys();
    this.bindSaveBtn();
    SheetSet.bind();
    GistSync.flushOnHide();
    this.bindTheme();
    Renderer.renderAll(DataModel.state.currentWeek);

    // Then attempt remote sync (always configured with defaults)
    SyncStatus.showConfigured();
    const merged = await Storage.loadAsync(state);
    if (merged !== state) {
      DataModel.init(merged);
      Renderer.renderAll(DataModel.state.currentWeek);
    }
    // 离线 harness：?sheet&count=4&mode=persons 直接把纸铺开，不用手点对话框
    const urlCfg = SheetSet.fromUrl();
    if (urlCfg) SheetSet.preview(urlCfg);
  },

  initTheme() {
    let saved = null;
    try { saved = localStorage.getItem(C.THEME_KEY); } catch (e) {}
    if (!saved) {
      saved = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
        ? 'blueprint' : 'paper';
    }
    this._applyTheme(saved);
  },

  _applyTheme(mode) {
    if (mode === 'blueprint') document.body.dataset.theme = 'blueprint';
    else delete document.body.dataset.theme;
  },

  bindTheme() {
    document.getElementById('btn-theme').addEventListener('click', () => {
      const next = document.body.dataset.theme === 'blueprint' ? 'paper' : 'blueprint';
      this._applyTheme(next);
      try { localStorage.setItem(C.THEME_KEY, next); } catch (e) {}
      Toast.show(next === 'blueprint' ? '蓝图夜览' : '图纸日览');
    });
  },

  bindToolbar() {
    document.getElementById('btn-prev-week').addEventListener('click', () => Actions.previousWeek());
    document.getElementById('btn-next-week').addEventListener('click', () => Actions.nextWeek());
    document.getElementById('btn-today').addEventListener('click', () => Actions.goToToday());
    document.getElementById('btn-copy-prev').addEventListener('click', () => Actions.copyFromPrev());
    document.getElementById('btn-print').addEventListener('click', () => SheetSet.openDialog());

    // Search
    const searchInput = document.getElementById('search-input');
    let searchTimer;
    searchInput.addEventListener('input', () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        FilterState.search = searchInput.value.trim();
        Renderer.renderAll(DataModel.state.currentWeek);
      }, 200);
    });

    // Status filters
    document.getElementById('status-filters').addEventListener('click', (e) => {
      const btn = e.target.closest('.filter-btn');
      if (!btn) return;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      FilterState.statusFilter = btn.dataset.filter;
      Renderer.renderAll(DataModel.state.currentWeek);
    });
  },

  bindBoardDelegation() {
    const board = document.getElementById('board');

    board.addEventListener('click', (e) => {
      if (CardDrag.consumeClick()) return;

      const rev = e.target.closest('.chip.rev');
      if (rev) {
        const card = rev.closest('.task-card');
        const id = card.dataset.taskId;
        const open = !Renderer.openRevs.delete(id);
        if (open) Renderer.openRevs.add(id);
        card.classList.toggle('rev-open', open);
        return;
      }

      const add = e.target.closest('.btn-add-person');
      if (add) { Actions.addTask(add.dataset.person); return; }

      const del = e.target.closest('.card-del');
      if (del) { Actions.deleteTask(del.dataset.taskId); return; }

      const el = e.target.closest('.editable');
      // 尺寸线由 pointerdown 接管，不参与 click 编辑
      if (!el || el.dataset.field === 'progress') return;
      if (el.classList.contains('editing')) return;
      Editor.startEdit(el, el.closest('.task-card'));
    });

    // 按住尺寸线即可拖动，无需先点击激活
    board.addEventListener('pointerdown', (e) => {
      if (e.button > 0) return;
      const dim = e.target.closest('.dim');
      if (dim) {
        e.preventDefault();
        Editor.beginDrag(dim, dim.closest('.task-card'), e);
        return;
      }
      if (e.target.closest('.card-del')) return;
      const card = e.target.closest('.task-card');
      if (card) CardDrag.arm(e, card);
    });
  },

  bindSettings() {
    const overlay = document.getElementById('settings-overlay');
    const gistInput = document.getElementById('cfg-gist-id');
    const tokenInput = document.getElementById('cfg-token');

    // Open settings
    document.getElementById('btn-settings').addEventListener('click', () => {
      const cfg = GistSync.loadConfig();
      gistInput.value = cfg.gistId || gistInput.value || '';
      tokenInput.value = cfg.token || '';
      const weeks = new Set(DataModel.state.tasks.map(t => t.week)).size;
      document.getElementById('backup-meta').textContent =
        `当前 ${DataModel.state.tasks.length} 条任务 / ${weeks} 周，导出 JSON 可在换机或同步失败时还原。`;
      overlay.classList.add('show');
    });

    // Close
    document.getElementById('btn-cancel-settings').addEventListener('click', () => {
      overlay.classList.remove('show');
    });
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) overlay.classList.remove('show');
    });

    // Save
    document.getElementById('btn-save-settings').addEventListener('click', async () => {
      const gistId = gistInput.value.trim();
      const token = tokenInput.value.trim();
      if (!gistId || !token) { Toast.show('请输入 Gist ID 和 Token'); return; }
      GistSync.saveConfig({ gistId, token });
      overlay.classList.remove('show');
      SyncStatus.showConfigured();
      SyncStatus.syncing();
      // 先拉后推。本地板子完全可能是空的或停在几周之前 —— 同步坏掉的那两个月里，
      // 每个人的 localStorage 就是一张各自的孤本。这时直接 push 等于用孤本覆盖云端，
      // 把同事的任务整片抹掉。所以必须先 merge，再上传合并后的那一份。
      const remote = await GistSync.pull();
      if (!GistSync.reachable) {
        // 读不到 ≠ token 失效，别把「去换 Token」写成提示；这里拦的是覆盖，不是权限
        SaveBtn.setError('net');
        SyncStatus.error('读不到云端 · 检查 Gist ID 是否填对');
        Toast.show('没能读到云端数据，已停止上传（避免覆盖同事的板子）', 6000);
        return;
      }
      GistSync.applyRemote(remote);
      const ok = await GistSync.push(DataModel.state);
      if (ok) {
        SaveBtn.setSaved();
        SyncStatus.configured();
        Toast.show(`同步成功 · 云端 ${DataModel.state.tasks.length} 条任务`, 5000);
      } else {
        // 读得到传不上去 = token 权限不够，不是 Gist ID 错了
        const why = GistSync.lastError === 'auth'
          ? 'Token 无写入权限 · 需 Gists: Read and write'
          : '上传失败 · 点击重试';
        SaveBtn.setError(GistSync.lastError === 'auth' ? 'auth' : 'net');
        SyncStatus.error(why);
        Toast.show(why, 6000);
      }
    });

    // Disconnect (clear custom overrides, fall back to defaults)
    document.getElementById('btn-disconnect').addEventListener('click', () => {
      if (confirm('确定清除自定义配置？将恢复使用默认同步设置。')) {
        GistSync.saveConfig({ gistId: '', token: '' });
        overlay.classList.remove('show');
        SyncStatus.showConfigured();
        SyncStatus.configured();
        Toast.show('已恢复默认同步设置');
        location.reload();
      }
    });

    // 本地备份
    document.getElementById('btn-export').addEventListener('click', () => {
      const n = Backup.exportFile();
      Toast.show(`已导出 ${n} 条任务`);
    });

    const fileInput = document.getElementById('import-file');
    document.getElementById('btn-import').addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', () => {
      const file = fileInput.files && fileInput.files[0];
      fileInput.value = '';
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        let data;
        try { data = JSON.parse(reader.result); }
        catch (err) { Toast.show('导入失败：不是有效的 JSON'); return; }
        const err = Backup.check(data);
        if (err) { Toast.show('导入失败：' + err, 6000); return; }
        UndoStack.push('导入备份');
        const { added, total } = Backup.merge(data);
        DataModel._save();
        overlay.classList.remove('show');
        Renderer.renderAll(DataModel.state.currentWeek, true);
        Toast.show(`已导入 ${total} 条任务，新增 ${added} 条`, 6000);
      };
      reader.readAsText(file);
    });
  },

  bindGlobalKeys() {
    document.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'n') {
        e.preventDefault();
        Actions.addTask(C.MEMBERS[0]);
      }
      if (e.key === 'Escape') {
        if (Editor.currentField) {
          Editor.cancelEdit();
        } else if (document.getElementById('sheet-overlay').classList.contains('show')) {
          document.getElementById('sheet-overlay').classList.remove('show');
        } else if (document.body.classList.contains('sheet-preview')) {
          SheetSet.close();
        } else {
          document.getElementById('settings-overlay').classList.remove('show');
        }
      }
      // Ctrl/Cmd+Z：多级撤销（输入框里留给浏览器原生的文本撤销）
      if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === 'z') {
        const a = document.activeElement;
        if (a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.isContentEditable)) return;
        e.preventDefault();
        UndoStack.undo();
      }
      // Ctrl+S: manual save
      if ((e.ctrlKey || e.metaKey) && e.key === 's') {
        e.preventDefault();
        GistSync.saveNow(DataModel.state);
      }
    });
  },

  bindSaveBtn() {
    document.getElementById('btn-save').addEventListener('click', () => {
      GistSync.saveNow(DataModel.state);
    });
  },
};

// Boot
document.addEventListener('DOMContentLoaded', () => App.init());
</script>
</body>
</html>
