/* ===== Reset ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }

/* ===== Design tokens ===== */
:root {
  --f-display: "Noto Serif SC", "Songti SC", "STSong", Georgia, serif;
  --f-body: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, sans-serif;
  --f-mono: "IBM Plex Mono", "SFMono-Regular", "JetBrains Mono", ui-monospace, Menlo, monospace;

  --paper: #F1EEE6;
  --paper-raised: #FBF9F5;
  --paper-sunk: #E6E1D6;
  --grid: rgba(31, 93, 124, .055);
  --grid-bold: rgba(31, 93, 124, .095);
  --ink: #1C1A16;
  --ink-2: #555046;
  --ink-3: #6E6659;
  --ink-4: #A69C8B;
  --hair: #DCD5C7;
  --hair-strong: #C3B9A6;

  --blueprint: #1F5D7C;
  --blueprint-2: #2C7BA0;
  --blueprint-soft: rgba(31, 93, 124, .10);
  --rust: #B0451D;
  --amber: #8A6310;
  --sage: #4C6B4E;

  --shadow-1: 0 1px 0 rgba(28,26,22,.03), 0 1px 3px rgba(28,26,22,.05);
  --shadow-2: 0 2px 4px rgba(28,26,22,.06), 0 12px 30px rgba(28,26,22,.11);

  --ease: cubic-bezier(.22, .61, .36, 1);
  --tint-ink: rgba(28, 26, 22, .04);
  --hatch: rgba(76, 107, 78, .09);
  /* 负荷条的历史格要比发丝线读得出来（≥3:1），又不抢当周那格的戏 */
  --spark-hist: #8F8878;
}

body[data-theme="blueprint"] {
  --paper: #0D1E29;
  --paper-raised: #132837;
  --paper-sunk: #0A1720;
  --grid: rgba(124, 191, 217, .07);
  --grid-bold: rgba(124, 191, 217, .115);
  --ink: #E4EEF4;
  --ink-2: #A9BECB;
  --ink-3: #7690A0;
  --ink-4: #4E6675;
  --hair: #25404F;
  --hair-strong: #33566A;
  --blueprint: #7CBFD9;
  --blueprint-2: #9DD3E8;
  --blueprint-soft: rgba(124, 191, 217, .13);
  --rust: #DE8862;
  --amber: #DDB35C;
  --sage: #8FBF8E;
  --shadow-1: 0 1px 0 rgba(0,0,0,.22);
  --shadow-2: 0 2px 6px rgba(0,0,0,.34), 0 14px 34px rgba(0,0,0,.42);
  --tint-ink: rgba(124, 191, 217, .05);
  --hatch: rgba(143, 191, 142, .14);
  --spark-hist: #6D8798;
}

/* ===== Base ===== */
body {
  font-family: var(--f-body);
  font-size: 13px;
  color: var(--ink);
  display: flex; flex-direction: column;
  background-color: var(--paper);
  /* 制图网格：细格 18px + 粗格 144px */
  background-image:
    linear-gradient(var(--grid-bold) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-bold) 1px, transparent 1px),
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 144px 144px, 144px 144px, 18px 18px, 18px 18px;
  transition: background-color .35s var(--ease), color .35s var(--ease);
  -webkit-font-smoothing: antialiased;
}
::selection { background: var(--blueprint); color: var(--paper-raised); }

/* mono annotation utility */
.anno {
  font-family: var(--f-mono);
  font-size: 10px;
  letter-spacing: .09em;
  text-transform: uppercase;
  color: var(--ink-3);
}

/* ===== Title block (toolbar) ===== */
#toolbar {
  flex-shrink: 0;
  display: flex; align-items: center; gap: 16px;
  padding: 11px 20px;
  background: var(--paper-raised);
  border-bottom: 1px solid var(--hair-strong);
  position: sticky; top: 0;
  z-index: 100;
  flex-wrap: wrap;
}
#toolbar .sep { flex: 1; }

#brand { display: flex; align-items: baseline; gap: 10px; padding-right: 18px; border-right: 1px solid var(--hair); }
#brand .mark {
  font-family: var(--f-mono); font-size: 10px; letter-spacing: .16em;
  color: var(--paper-raised); background: var(--ink);
  padding: 3px 6px; text-transform: uppercase; align-self: center;
}
#brand .name { font-family: var(--f-display); font-size: 15px; font-weight: 600; letter-spacing: .02em; white-space: nowrap; }

#toolbar button {
  font-family: var(--f-mono); font-size: 11px; letter-spacing: .05em;
  padding: 5px 12px;
  border: 1px solid var(--hair-strong);
  border-radius: 0;
  background: transparent; cursor: pointer;
  white-space: nowrap; color: var(--ink-2);
  transition: color .16s var(--ease), border-color .16s var(--ease), background .16s var(--ease);
}
#toolbar button:hover { color: var(--blueprint); border-color: var(--blueprint); background: var(--blueprint-soft); }
#toolbar button:active { transform: translateY(1px); }
#toolbar button.accent { background: var(--ink); color: var(--paper-raised); border-color: var(--ink); }
#toolbar button.accent:hover { background: var(--blueprint); border-color: var(--blueprint); }
#toolbar .week-nav { font-size: 10px; padding: 5px 9px; color: var(--ink-3); }
#toolbar .week-nav:hover { color: var(--blueprint); }

.week-group { display: flex; align-items: center; gap: 11px; }
#week-label {
  font-family: var(--f-display); font-size: 20px; font-weight: 600;
  line-height: 1.05; letter-spacing: .01em; min-width: 148px;
  display: flex; flex-direction: column; gap: 3px;
}
#week-label .wk-main { display: flex; align-items: center; }
#week-label .date-range {
  font-family: var(--f-mono); font-size: 10px; font-weight: 400;
  letter-spacing: .09em; color: var(--ink-3);
}
#week-label .wk-flag {
  font-family: var(--f-mono); font-style: normal; font-size: 8.5px;
  letter-spacing: .14em; text-transform: uppercase;
  color: var(--paper-raised); background: var(--blueprint);
  padding: 2px 5px; margin-left: 8px; vertical-align: 4px;
}

/* ===== Toast ===== */
#toast {
  position: fixed; top: 74px; left: 50%; transform: translate(-50%, -6px);
  padding: 8px 16px; font-size: 12px;
  font-family: var(--f-mono); letter-spacing: .04em;
  z-index: 9999; pointer-events: none;
  opacity: 0; transition: opacity .25s var(--ease), transform .25s var(--ease);
  background: var(--ink); color: var(--paper);
  border-left: 3px solid var(--blueprint);
  box-shadow: var(--shadow-2);
  display: flex; align-items: center;
}
#toast.show { opacity: 1; pointer-events: auto; transform: translate(-50%, 0); }

/* ===== Board ===== */
#board {
  flex: 1; overflow-y: auto; overflow-x: auto;
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 18px;
  padding: 20px 20px 96px;
  align-content: start;
}

/* ===== Column — 一张图纸 ===== */
.column {
  position: relative;
  background: var(--paper-raised);
  border: 1px solid var(--hair-strong);
  display: flex; flex-direction: column;
  min-width: 0;
  box-shadow: var(--shadow-1);
  transition: box-shadow .22s var(--ease), border-color .22s var(--ease);
}
.column:hover { box-shadow: var(--shadow-2); }
/* 裁切标记 */
.column::before, .column::after {
  content: ''; position: absolute; width: 10px; height: 10px;
  pointer-events: none; opacity: .5;
  border-color: var(--blueprint); border-style: solid; border-width: 0;
}
.column::before { top: -5px; left: -5px; border-top-width: 1px; border-left-width: 1px; }
.column::after { bottom: -5px; right: -5px; border-bottom-width: 1px; border-right-width: 1px; }

.column-header {
  padding: 11px 13px 10px;
  border-bottom: 1px solid var(--hair-strong);
  display: flex; align-items: flex-start; justify-content: space-between; gap: 8px;
  flex-shrink: 0;
  background: linear-gradient(180deg, var(--tint-ink), transparent);
}
.column-header .ph-left { min-width: 0; }
.column-header .sht {
  font-family: var(--f-mono); font-size: 9px; letter-spacing: .14em;
  text-transform: uppercase; color: var(--ink-3); display: block; margin-bottom: 3px;
}
.column-header .person-name {
  font-family: var(--f-display);
  font-size: 16px; font-weight: 600; letter-spacing: .01em;
  display: flex; align-items: center; gap: 7px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.column-header .person-name .dot {
  width: 7px; height: 7px; border-radius: 0; flex-shrink: 0;
  box-shadow: 0 0 0 1px rgba(0,0,0,.06);
}
.dot-c0 { background: var(--blueprint); }
.dot-c1 { background: var(--amber); }
.dot-c2 { background: var(--sage); }
.dot-c3 { background: var(--rust); }

.column-header .ph-right { text-align: right; flex-shrink: 0; }
.column-header .task-count {
  font-family: var(--f-mono); font-size: 15px; font-weight: 500; color: var(--ink);
  line-height: 1;
}
.column-header .task-count i {
  font-style: normal; font-size: 9px; letter-spacing: .1em; color: var(--ink-3);
  margin-left: 2px;
}
.column-header .ph-sub {
  display: block; font-family: var(--f-mono); font-size: 9px; letter-spacing: .08em;
  color: var(--ink-3); margin-top: 4px;
}
.column-header .ph-sub b { color: var(--sage); font-weight: 500; }

.column-body {
  flex: 0 1 auto; overflow-y: auto;
  padding: 12px 10px;
  display: flex; flex-direction: column; gap: 10px;
  min-height: 84px;
}
.column-body.empty {
  border: 1px dashed var(--hair-strong);
  margin: 12px 10px;
  min-height: 84px;
}
.column-body.empty::after {
  content: '待补充 / TO BE ADDED';
  text-align: center; color: var(--ink-3);
  font-family: var(--f-mono); font-size: 9.5px; letter-spacing: .12em;
  padding: 30px 0;
}
.column-footer { padding: 0 10px 11px; flex-shrink: 0; }
.column-footer button {
  width: 100%; padding: 7px;
  border: 1px dashed var(--hair-strong); border-radius: 0;
  background: transparent; color: var(--ink-3); cursor: pointer;
  font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .1em;
  transition: color .16s var(--ease), border-color .16s var(--ease), background .16s var(--ease);
}
.column-footer button:hover {
  border-color: var(--blueprint); color: var(--blueprint); background: var(--blueprint-soft);
  border-style: solid;
}

/* ===== Task Card ===== */
@keyframes card-in {
  from { opacity: 0; transform: translateY(7px); }
  to   { opacity: 1; transform: none; }
}
.task-card {
  position: relative;
  background: var(--paper-raised);
  border: 1px solid var(--hair);
  padding: 9px 10px 10px;
  cursor: grab;   /* 可编辑子元素各自覆盖成 text/pointer，留白处即起拖区 */
  -webkit-touch-callout: none;
  transition: border-color .18s var(--ease), box-shadow .18s var(--ease),
              background .18s var(--ease), opacity .18s var(--ease);
  animation: card-in .3s var(--ease) backwards;
  /* 不能用 both：动画填充会把 .dragging 的旋转和兄弟卡片的淡出一起锁死 */
}
/* 左侧引线：hover 时展开 */
.task-card::before {
  content: ''; position: absolute; left: -1px; top: -1px; bottom: -1px; width: 2px;
  background: var(--blueprint);
  transform: scaleY(0); transform-origin: top;
  transition: transform .22s var(--ease);
}
.task-card:hover { border-color: var(--hair-strong); box-shadow: var(--shadow-1); }
.task-card:hover::before { transform: scaleY(1); }
.task-card[data-status="已完成"] {
  background-image: repeating-linear-gradient(45deg, var(--hatch) 0 1px, transparent 1px 8px);
}
/* ===== 拖拽排序 —— CAD 选择集观感 ===== */
.task-card.dragging {
  border-color: var(--blueprint);
  border-style: dashed;
  box-shadow: var(--shadow-2);
  outline: 1px dashed var(--blueprint);
  outline-offset: 3px;
  transform: rotate(-.5deg);
  cursor: grabbing;
  z-index: 4;
  transition: none;
}
.task-card.dragging::before { transform: scaleY(1); }
#board.drag-active { user-select: none; cursor: grabbing; }
#board.drag-active .task-card:not(.dragging) { opacity: .5; }
/* 拖动中/落位后都关掉入场动画：DOM 重新插入会让它一遍遍重播 */
#board.drag-active .task-card, #board.no-anim .task-card { animation: none; }

/* ===== 周对比云线 + 修订表 ===== */
/* 上周没有这条任务 → 内侧虚线，读作修订云线的轻量版 */
.task-card.is-new:not(.dragging) { outline: 1px dashed var(--amber); outline-offset: -3px; }
.rev-slot { display: flex; align-items: center; gap: 4px; margin-left: auto; flex-shrink: 0; }
.chip {
  font-family: var(--f-mono); font-size: 8.5px; font-weight: 500;
  letter-spacing: .1em; line-height: 1.5; padding: 0 4px;
  border: 1px solid var(--hair-strong); border-radius: 0;
  background: transparent; color: var(--ink-3);
  font-variant-numeric: tabular-nums;
}
.chip.new { color: var(--amber); border-color: currentColor; }
button.chip.rev { color: var(--blueprint); border-color: currentColor; cursor: pointer; transition: background .16s var(--ease); }
button.chip.rev:hover { background: var(--blueprint-soft); }
.task-card.rev-open button.chip.rev { background: var(--blueprint); color: var(--paper-raised); }
.rev-table {
  display: none; width: 100%; border-collapse: collapse; table-layout: fixed;
  margin-top: 7px; padding-top: 5px;
  border-top: 1px dotted var(--hair-strong);
}
.task-card.rev-open .rev-table { display: table; }
.rev-table th {
  font-family: var(--f-mono); font-size: 8px; font-weight: 500;
  letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3);
  text-align: left; white-space: nowrap; padding: 0 6px 3px 0;
  border-bottom: 1px solid var(--hair);
}
.rev-table th:nth-child(1), .rev-table td:nth-child(1) { width: 24px; }
.rev-table th:nth-child(2), .rev-table td:nth-child(2) { width: 72px; }
.rev-table td {
  font-family: var(--f-mono); font-size: 9.5px; color: var(--ink-2);
  padding: 3px 6px 3px 0; border-bottom: 1px solid var(--hair);
  font-variant-numeric: tabular-nums; vertical-align: top; white-space: nowrap;
}
.rev-table tr:last-child td { border-bottom: none; }
.rev-table td.rv-no { color: var(--ink-3); }
.rev-table td.rv-what { white-space: normal; }
.rev-table .arrow { opacity: .45; padding: 0 3px; }

/* ===== 列头个人负荷（最近 8 周） ===== */
.spark { display: flex; align-items: flex-end; gap: 2px; height: 14px; margin-top: 5px; }
.spark i { display: block; width: 3px; min-height: 1px; background: var(--spark-hist); }
.spark i.zero { background: var(--hair-strong); opacity: .5; }
.spark i.now { background: var(--blueprint); }
.task-card .card-row { display: flex; align-items: center; gap: 7px; margin-bottom: 6px; }
.task-card .card-row:last-child { margin-bottom: 0; }
.task-card .card-row.wrap { flex-wrap: wrap; }
.task-card .spacer { flex: 1; }

.task-card .task-name {
  font-weight: 600; font-size: 13.5px; line-height: 1.4;
  flex: 1; min-width: 0; color: var(--ink); letter-spacing: .01em;
}
.task-card .task-name.editable { cursor: text; }
.task-card .task-name .placeholder { color: var(--ink-3); font-weight: 400; }

/* Priority — 引出线标签 */
.prio-badge {
  font-family: var(--f-mono); font-size: 9.5px; font-weight: 500;
  letter-spacing: .1em; text-transform: uppercase;
  padding: 1.5px 5px 1.5px 0; flex-shrink: 0;
  border-bottom: 1px solid currentColor;
  transition: background .16s var(--ease);
}
.prio-badge::before {
  content: attr(data-code);
  margin-right: 5px; opacity: .55; letter-spacing: .06em;
}
.prio-high { color: var(--rust); }
.prio-med  { color: var(--amber); }
.prio-low  { color: var(--sage); }
.prio-badge:hover { background: var(--tint-ink); }

/* Progress — 尺寸标注线 */
.dim {
  flex: 1; min-width: 0;
  display: flex; align-items: center; gap: 8px;
  padding: 3px 0;
  touch-action: none; user-select: none;
}
.dim-line {
  flex: 1; min-width: 34px; position: relative;
  display: flex; align-items: center; height: 15px;
}
.dim-track {
  flex: 1; position: relative; height: 2px;
  background: var(--paper-sunk);
  box-shadow: inset 0 0 0 1px var(--hair);
  cursor: ew-resize;
  transition: height .16s var(--ease);
}
.dim:hover .dim-track, .dim.editing .dim-track { height: 6px; }
.dim-fill {
  position: absolute; left: 0; top: 0; bottom: 0; display: block;
  background: var(--blueprint);
  transition: width .35s var(--ease), background .25s var(--ease);
}
.dim.dragging .dim-fill { transition: none; }
.dim-thumb {
  position: absolute; top: 50%; width: 9px; height: 9px; display: block;
  transform: translate(-50%, -50%) rotate(45deg);
  background: var(--paper-raised);
  border: 1.5px solid var(--blueprint);
  opacity: 0; transition: opacity .16s var(--ease), scale .16s var(--ease);
  scale: .7;
}
.dim:hover .dim-thumb, .dim.editing .dim-thumb { opacity: 1; scale: 1; }
.dim.editing .dim-thumb { background: var(--blueprint); }
/* 尺寸界线端头：建筑制图惯用的 45° 斜切标记 */
.dim-tick {
  width: 1px; height: 10px; flex-shrink: 0;
  background: var(--hair-strong);
  transform: rotate(45deg);
}
/* 刻度尺：每 10% 一根分度线，让进度条读起来像一把比例尺 */
.dim-line::after {
  content: ''; position: absolute; left: 1px; right: 1px;
  top: calc(50% + 4px); height: 3px; pointer-events: none;
  background: repeating-linear-gradient(90deg,
    var(--hair-strong) 0 1px, transparent 1px 11.1111%);
  opacity: .55;
  transition: opacity .16s var(--ease);
}
.dim:hover .dim-line::after { opacity: .9; }
.dim-val {
  font-family: var(--f-mono); font-size: 10.5px; font-weight: 500;
  color: var(--ink-2); min-width: 34px; text-align: right;
  font-variant-numeric: tabular-nums; flex-shrink: 0;
}
.dim-val i { font-style: normal; opacity: .5; font-size: 9px; margin-left: 1px; }
.dim[data-level="low"]  .dim-fill { background: var(--rust); }
.dim[data-level="mid"]  .dim-fill { background: var(--blueprint); }
.dim[data-level="high"] .dim-fill { background: var(--sage); }
.dim[data-level="none"] .dim-fill { background: transparent; }
.dim[data-level="low"]  .dim-thumb { border-color: var(--rust); }
.dim[data-level="mid"]  .dim-thumb { border-color: var(--blueprint); }
.dim[data-level="high"] .dim-thumb { border-color: var(--sage); }
.dim[data-level="none"] .dim-thumb { border-color: var(--ink-4); }
.dim[data-level="low"]  .dim-val { color: var(--rust); }
.dim[data-level="high"] .dim-val { color: var(--sage); }

/* Status — 制图校验标记 */
.status-badge {
  display: inline-flex; align-items: center; gap: 5px;
  font-family: var(--f-mono); font-size: 10px; letter-spacing: .06em;
  flex-shrink: 0; padding: 1px 0; cursor: pointer;
  color: var(--ink-3);
  border-bottom: 1px solid transparent;
  transition: border-color .16s var(--ease), color .16s var(--ease);
}
.status-badge:hover { border-bottom-color: currentColor; }
.status-badge::before {
  content: ''; width: 8px; height: 8px; flex-shrink: 0;
  border: 1px solid currentColor;
}
.status-badge[data-status="进行中"] { color: var(--blueprint); }
.status-badge[data-status="进行中"]::before {
  background: linear-gradient(to top, var(--blueprint) 50%, transparent 50%);
}
.status-badge[data-status="已完成"] { color: var(--sage); }
.status-badge[data-status="已完成"]::before {
  background: var(--sage);
  box-shadow: inset 0 0 0 1px var(--sage);
}

/* Dates — 时间标注 */
.task-card .task-dates {
  display: inline-flex; align-items: center; gap: 5px;
  font-family: var(--f-mono); font-size: 10px; letter-spacing: .04em;
  color: var(--ink-3); font-variant-numeric: tabular-nums;
}
.task-card .task-dates em { font-style: normal; color: var(--ink-4); }
.task-card .task-dates .editable { cursor: pointer; transition: color .16s var(--ease); }
.task-card .task-dates .editable:hover { color: var(--blueprint); }
.task-card .date-range .placeholder { color: var(--ink-3); letter-spacing: .08em; }

/* Notes */
.task-card .notes {
  font-size: 11.5px; line-height: 1.5; color: var(--ink-3);
  flex: 1; min-width: 0;
  border-top: 1px dotted var(--hair); padding-top: 5px;
}
.task-card .notes .placeholder { color: var(--ink-3); font-family: var(--f-mono); font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; }

/* Delete button */
.card-del {
  width: 16px; height: 16px; line-height: 14px; text-align: center;
  flex-shrink: 0;
  border: 1px solid transparent; background: transparent;
  color: var(--ink-3); font-size: 13px; cursor: pointer;
  opacity: 0; transition: opacity .16s var(--ease), color .16s var(--ease), border-color .16s var(--ease);
}
.task-card:hover .card-del { opacity: 1; }
.card-del:hover { color: var(--rust); border-color: var(--rust); }
@media (hover: none) { .card-del { opacity: .55; } }

/* ===== Inline Edit ===== */
.editable { cursor: pointer; }
.task-card input, .task-card select {
  font-family: var(--f-mono); font-size: 12px;
  border: 1px solid var(--blueprint); border-radius: 0;
  outline: none; padding: 1px 4px;
  background: var(--paper-raised); color: var(--ink);
}
.task-card input:focus, .task-card select:focus { box-shadow: 0 0 0 2px var(--blueprint-soft); }
.task-card .task-name input[type="text"] { font-family: var(--f-body); width: 100%; font-size: 13px; }
.task-card input[type="number"] { width: 56px; text-align: center; }
.task-card input[type="date"] { width: 112px; }
.task-card select { cursor: pointer; }

/* ===== Scrollbar ===== */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--hair-strong); }
::-webkit-scrollbar-thumb:hover { background: var(--blueprint); }

/* ===== Sync Indicator ===== */
#sync-status {
  display: none; align-items: center; gap: 6px;
  font-family: var(--f-mono); font-size: 10px; letter-spacing: .09em;
  text-transform: uppercase; color: var(--ink-3);
}
#sync-status.configured { display: flex; }
#sync-status .sync-dot {
  width: 6px; height: 6px; border-radius: 0; transform: rotate(45deg);
  background: var(--ink-4); flex-shrink: 0;
}
#sync-status.synced .sync-dot { background: var(--sage); }
#sync-status.syncing .sync-dot { background: var(--amber); animation: pulse .9s infinite; }
#sync-status.error .sync-dot { background: var(--rust); }
@keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.25; } }

#toolbar .tools { display: flex; align-items: center; gap: 6px; }
#btn-settings { font-size: 12px; padding: 4px 8px; border-color: transparent; }
#btn-settings:hover { border-color: var(--blueprint); }

/* ===== Settings Dialog ===== */
#settings-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(20, 24, 26, .48);
  backdrop-filter: blur(3px);
  z-index: 10000;
  align-items: center; justify-content: center;
}
#settings-overlay.show { display: flex; }
#settings-dialog {
  background: var(--paper-raised);
  border: 1px solid var(--hair-strong);
  box-shadow: 0 0 0 5px var(--paper-raised), var(--shadow-2);
  padding: 26px 26px 22px;
  width: 430px; max-width: 90vw;
  max-height: 88vh; overflow: auto;
}
#settings-dialog h3 {
  font-family: var(--f-display); font-size: 17px; font-weight: 600;
  margin-bottom: 4px; letter-spacing: .01em;
}
#settings-dialog .sub {
  font-family: var(--f-mono); font-size: 9.5px; letter-spacing: .14em;
  text-transform: uppercase; color: var(--ink-3); margin-bottom: 18px;
  padding-bottom: 12px; border-bottom: 1px solid var(--hair);
}
#settings-dialog label {
  display: block; font-family: var(--f-mono); font-size: 9.5px; font-weight: 500;
  letter-spacing: .13em; text-transform: uppercase;
  color: var(--ink-3); margin-bottom: 5px; margin-top: 15px;
}
#settings-dialog label:first-of-type { margin-top: 0; }
#settings-dialog input {
  width: 100%; padding: 8px 10px; border: 1px solid var(--hair-strong);
  border-radius: 0; font-family: var(--f-mono); font-size: 12.5px;
  background: var(--paper); color: var(--ink);
}
#settings-dialog input:focus { outline: none; border-color: var(--blueprint); box-shadow: 0 0 0 2px var(--blueprint-soft); }
#settings-dialog .hint {
  font-size: 11px; color: var(--ink-3); margin-top: 5px; line-height: 1.5;
}
#settings-dialog .hint a { color: var(--blueprint); }
#settings-dialog .btn-row {
  display: flex; gap: 8px; justify-content: flex-end;
  margin-top: 22px; padding-top: 15px; border-top: 1px solid var(--hair);
}
#settings-dialog button {
  font-family: var(--f-mono); font-size: 11px; letter-spacing: .05em;
  padding: 7px 15px; border-radius: 0; cursor: pointer;
  border: 1px solid var(--hair-strong); background: transparent; color: var(--ink-2);
  transition: all .16s var(--ease);
}
#settings-dialog button:hover { border-color: var(--blueprint); color: var(--blueprint); background: var(--blueprint-soft); }
#settings-dialog button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
#settings-dialog button.primary:hover { background: var(--blueprint); border-color: var(--blueprint); color: var(--paper-raised); }
#settings-dialog button.danger { color: var(--rust); border-color: transparent; background: transparent; margin-right: auto; }
#settings-dialog button.danger:hover { background: var(--rust); color: var(--paper-raised); border-color: var(--rust); }
#settings-dialog .dlg-rule {
  display: flex; align-items: center; gap: 9px; margin-top: 21px;
  font-family: var(--f-mono); font-size: 9px; font-weight: 500;
  letter-spacing: .16em; text-transform: uppercase; color: var(--ink-3);
}
#settings-dialog .dlg-rule::after { content: ""; flex: 1; border-top: 1px solid var(--hair); }
#settings-dialog .btn-row.backup {
  justify-content: flex-start; margin-top: 11px; padding-top: 0; border-top: none;
}
#import-file { display: none; }

/* ===== 键盘焦点 —— 图纸上的选择集 ===== */
/* 只给 :focus-visible，鼠标点按钮不会留框；输入框自己有下划线/光环，不重复描边 */
:focus-visible { outline: 2px solid var(--blueprint); outline-offset: 2px; }
button:focus-visible { outline-offset: 3px; }
/* REV 彽标只有 8.5px，标准偏移会撞到我排的邻卡 */
button.chip:focus-visible { outline-width: 1.5px; outline-offset: 1px; }
#settings-dialog input:focus-visible,
.task-card input:focus-visible,
.task-card select:focus-visible { outline: none; }

/* ===== Save stamp ===== */
#save-bar {
  position: fixed; bottom: 0; left: 0; right: 0;
  display: flex; justify-content: center;
  padding: 12px 0 14px; z-index: 200;
  pointer-events: none;
  background: linear-gradient(to top, var(--paper) 30%, transparent);
}
#btn-save {
  pointer-events: auto;
  font-family: var(--f-mono); font-size: 11px; font-weight: 500; letter-spacing: .11em;
  text-transform: uppercase;
  padding: 9px 20px;
  border-radius: 0; cursor: pointer;
  display: flex; align-items: center; gap: 9px;
  background: var(--paper-raised); color: var(--ink-2);
  border: 1px solid var(--hair-strong);
  box-shadow: var(--shadow-1);
  transition: all .2s var(--ease);
}
#btn-save:hover { border-color: var(--blueprint); color: var(--blueprint); }
#btn-save .save-icon { font-size: 12px; line-height: 1; }
#btn-save.saved { color: var(--sage); border-color: var(--sage); }
#btn-save.saving { color: var(--amber); border-color: var(--amber); }
#btn-save.unsaved {
  background: var(--ink); color: var(--paper); border-color: var(--ink);
  animation: stamp-glow 2s var(--ease) infinite;
}
#btn-save.unsaved:hover { background: var(--blueprint); border-color: var(--blueprint); color: var(--paper-raised); }
#btn-save.error { color: var(--rust); border-color: var(--rust); background: var(--paper-raised); }
@keyframes stamp-glow {
  0%, 100% { box-shadow: 0 0 0 0 rgba(28,26,22,.28); }
  55%      { box-shadow: 0 0 0 7px rgba(28,26,22,0); }
}

/* ===== Search & Filter ===== */
.search-input {
  font-family: var(--f-mono); font-size: 11.5px;
  padding: 5px 2px; width: 152px;
  border: none; border-bottom: 1px solid var(--hair-strong);
  background: transparent; outline: none; color: var(--ink);
  border-radius: 0;
  transition: border-color .16s var(--ease);
}
.search-input:focus { border-bottom-color: var(--blueprint); }
.search-input::placeholder { color: var(--ink-3); letter-spacing: .05em; }

.status-filters { display: flex; gap: 4px; }
/* 注意：#toolbar button 的 ID 特异性更高，这里必须同级作用域才能生效 */
#toolbar .filter-btn {
  font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .07em;
  padding: 4px 10px; color: var(--ink-3);
}
#toolbar .filter-btn:hover { color: var(--blueprint); border-color: var(--blueprint); background: var(--blueprint-soft); }
#toolbar .filter-btn.active {
  background: var(--ink); border-color: var(--ink);
  color: var(--paper-raised); font-weight: 500;
}
#toolbar .filter-btn.active:hover { background: var(--blueprint); border-color: var(--blueprint); color: var(--paper-raised); }

/* ===== Stats — 图签栏 ===== */
#stats-bar {
  display: flex; align-items: stretch; flex-wrap: wrap;
  background: var(--paper-raised);
  border-bottom: 1px solid var(--hair-strong);
  font-size: 12px; color: var(--ink-2);
}
.stat-cell {
  display: flex; flex-direction: column; gap: 4px;
  padding: 9px 18px;
  border-right: 1px solid var(--hair);
  min-width: 84px;
}
.stat-cell.wide { min-width: 150px; flex: 0 0 auto; }
.stat-cell .anno { font-size: 8.5px; letter-spacing: .15em; }
.stat-value {
  font-family: var(--f-mono); font-size: 18px; font-weight: 500; line-height: 1;
  font-variant-numeric: tabular-nums; color: var(--ink);
}
.stat-value em { font-style: normal; font-size: 10px; color: var(--ink-3); margin-left: 1px; }
.stat-value.is-good { color: var(--sage); }
.stat-value.is-warn { color: var(--amber); }
.stat-value.is-bad  { color: var(--rust); }
.rate-track { position: relative; height: 2px; width: 100%; background: var(--paper-sunk); box-shadow: inset 0 0 0 1px var(--hair); margin-top: 3px; }
.rate-track i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--blueprint); transition: width .45s var(--ease); }
.rate-track.is-good i { background: var(--sage); }
.rate-track.is-warn i { background: var(--amber); }
.rate-track.is-bad  i { background: var(--rust); }

.stat-person {
  display: flex; flex-direction: column; gap: 5px;
  padding: 9px 16px;
  border-right: 1px solid var(--hair);
  flex: 1 1 96px; max-width: 172px; min-width: 96px;
}
.sp-top { display: flex; align-items: center; gap: 6px; min-width: 0; }
.stat-person .stat-dot { width: 6px; height: 6px; flex-shrink: 0; transform: rotate(45deg); }
.stat-person .sp-name { font-size: 12px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat-person .sp-num {
  margin-left: auto; font-family: var(--f-mono); font-size: 10.5px;
  font-variant-numeric: tabular-nums; color: var(--ink-3); flex-shrink: 0;
}
.stat-person .sp-num b { color: var(--sage); font-weight: 500; }
.sp-bar { position: relative; height: 2px; background: var(--paper-sunk); box-shadow: inset 0 0 0 1px var(--hair); }
.sp-bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--blueprint); transition: width .45s var(--ease); }

.stat-legend {
  display: flex; align-items: center; gap: 14px;
  padding: 9px 18px; margin-left: auto;
  font-family: var(--f-mono); font-size: 9px; letter-spacing: .1em;
  text-transform: uppercase; color: var(--ink-3);
  border-left: 1px solid var(--hair);
}
.stat-legend span { display: inline-flex; align-items: center; gap: 5px; }
.stat-legend span::before { content: ''; width: 7px; height: 7px; border: 1px solid currentColor; }
.stat-legend .lg-not { color: var(--ink-3); }
.stat-legend .lg-prog { color: var(--blueprint); }
.stat-legend .lg-prog::before { background: linear-gradient(to top, currentColor 50%, transparent 50%); }
.stat-legend .lg-done { color: var(--sage); }
.stat-legend .lg-done::before { background: currentColor; }

/* ===== Responsive ===== */
@media (max-width: 1120px) { #board { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 700px) {
  #board { grid-template-columns: minmax(0, 1fr); padding: 14px 14px 92px; gap: 14px; }
  #toolbar { padding: 9px 12px; gap: 10px; }
  #brand { padding-right: 10px; }
  #brand .name { display: none; }
  #week-label { font-size: 17px; }
  .search-input { width: 100%; }
  #stats-bar { overflow-x: auto; }
  .stat-legend { display: none; }
  .stat-person { flex: 0 0 auto; }
}
@media (prefers-reduced-motion: reduce) {
  /* 卡片有最长 312ms 的错峰 animation-delay，只压时长会让它们在前置填充里保持透明 */
  *, *::before, *::after {
    animation-duration: .01ms !important; animation-delay: 0ms !important;
    transition-duration: .01ms !important; transition-delay: 0ms !important;
  }
}

/* ===== Print — 晒图（A3 横排图纸） ===== */
#title-block { display: none; }
@page { size: A3 landscape; margin: 10mm; }

@media print {
  /* 蓝图夜览不进打印机：强制回到纸面 */
  :root, body[data-theme="blueprint"] {
    --paper: #FFFFFF;
    --paper-raised: #FFFFFF;
    --paper-sunk: #EDEAE2;
    --grid: transparent;
    --grid-bold: transparent;
    --ink: #1C1A16;
    --ink-2: #4A463E;
    --ink-3: #6E6659;
    --hair: #D8D2C6;
    --hair-strong: #B4AA97;
    --shadow-1: none;
    --shadow-2: none;
    --hatch: rgba(76, 107, 78, .05);
    --spark-hist: #8F8878;
  }
  /* 浏览器默认不打印背景，但剖面线与尺寸线填充是这张图的信息 */
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  html, body { height: auto; overflow: visible; background: #fff; }
  body { display: block; background-image: none; }
  #toolbar, #save-bar, #settings-overlay, #toast, .card-del, .column-footer { display: none !important; }
  #stats-bar { border-bottom: 1px solid var(--hair-strong); }
  /* 四列挤一行在 A3 上太窄，改成 2×2 图框 */
  #board {
    display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 6mm 5mm; padding: 5mm 0 0; overflow: visible;
  }
  .column { box-shadow: none; break-inside: auto; }
  .column-body { overflow: visible; padding: 8px 8px 0; }
  .task-card { break-inside: avoid; box-shadow: none; animation: none; }
  #title-block {
    display: flex; flex-wrap: wrap;
    margin-top: 6mm; border: 1px solid var(--ink);
  }
  .tb-cell {
    display: flex; flex-direction: column; gap: 3px;
    padding: 5px 12px; border-right: 1px solid var(--hair-strong);
    min-width: 74px;
  }
  .tb-cell:last-child { border-right: none; }
  .tb-cell.grow { flex: 1; }
  .tb-cell .anno { font-size: 7.5px; letter-spacing: .16em; }
  .tb-val {
    font-family: var(--f-mono); font-size: 11px; font-weight: 500;
    color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .tb-val.zh { font-family: var(--f-display); font-weight: 600; font-size: 12.5px; }
}
</style>
</head>

    <input type="text" id="cfg-gist-id" value="1c847a7d6d0e61fb090eb581d5e988b7" placeholder="从 Gist URL 中复制，如 a1b2c3d4e5f6...">
    <p class="hint">创建一个 <a href="https://gist.github.com/" target="_blank" rel="noopener">GitHub Gist</a>，在 URL 末尾获取 ID</p>
