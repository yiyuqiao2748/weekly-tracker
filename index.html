<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>效果图部门 · 周任务进度表</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ===== Reset ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }

/* ===== Design tokens ===== */
:root {
  --f-display: "Noto Serif SC", "Songti SC", "STSong", Georgia, serif;
  --f-body: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, sans-serif;
  --f-mono: "IBM Plex Mono", "SFMono-Regular", "JetBrains Mono", ui-monospace, Menlo, monospace;

  --paper: #F1EEE6;
  --paper-raised: #FBF9F5;
  --paper-sunk: #E6E1D6;
  --grid: rgba(31, 93, 124, .055);
  --grid-bold: rgba(31, 93, 124, .095);
  --ink: #1C1A16;
  --ink-2: #555046;
  --ink-3: #6E6659;
  --ink-4: #A69C8B;
  --hair: #DCD5C7;
  --hair-strong: #C3B9A6;

  --blueprint: #1F5D7C;
  --blueprint-2: #2C7BA0;
  --blueprint-soft: rgba(31, 93, 124, .10);
  --rust: #B0451D;
  --amber: #8A6310;
  --sage: #4C6B4E;

  --shadow-1: 0 1px 0 rgba(28,26,22,.03), 0 1px 3px rgba(28,26,22,.05);
  --shadow-2: 0 2px 4px rgba(28,26,22,.06), 0 12px 30px rgba(28,26,22,.11);

  --ease: cubic-bezier(.22, .61, .36, 1);
  --tint-ink: rgba(28, 26, 22, .04);
  --hatch: rgba(76, 107, 78, .09);
}

body[data-theme="blueprint"] {
  --paper: #0D1E29;
  --paper-raised: #132837;
  --paper-sunk: #0A1720;
  --grid: rgba(124, 191, 217, .07);
  --grid-bold: rgba(124, 191, 217, .115);
  --ink: #E4EEF4;
  --ink-2: #A9BECB;
  --ink-3: #7690A0;
  --ink-4: #4E6675;
  --hair: #25404F;
  --hair-strong: #33566A;
  --blueprint: #7CBFD9;
  --blueprint-2: #9DD3E8;
  --blueprint-soft: rgba(124, 191, 217, .13);
  --rust: #DE8862;
  --amber: #DDB35C;
  --sage: #8FBF8E;
  --shadow-1: 0 1px 0 rgba(0,0,0,.22);
  --shadow-2: 0 2px 6px rgba(0,0,0,.34), 0 14px 34px rgba(0,0,0,.42);
  --tint-ink: rgba(124, 191, 217, .05);
  --hatch: rgba(143, 191, 142, .14);
}

/* ===== Base ===== */
body {
  font-family: var(--f-body);
  font-size: 13px;
  color: var(--ink);
  display: flex; flex-direction: column;
  background-color: var(--paper);
  /* 制图网格：细格 18px + 粗格 144px */
  background-image:
    linear-gradient(var(--grid-bold) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-bold) 1px, transparent 1px),
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 144px 144px, 144px 144px, 18px 18px, 18px 18px;
  transition: background-color .35s var(--ease), color .35s var(--ease);
  -webkit-font-smoothing: antialiased;
}
::selection { background: var(--blueprint); color: var(--paper-raised); }

/* mono annotation utility */
.anno {
  font-family: var(--f-mono);
  font-size: 10px;
  letter-spacing: .09em;
  text-transform: uppercase;
  color: var(--ink-3);
}

/* ===== Title block (toolbar) ===== */
#toolbar {
  flex-shrink: 0;
  display: flex; align-items: center; gap: 16px;
  padding: 11px 20px;
  background: var(--paper-raised);
  border-bottom: 1px solid var(--hair-strong);
  position: sticky; top: 0;
  z-index: 100;
  flex-wrap: wrap;
}
#toolbar .sep { flex: 1; }

#brand { display: flex; align-items: baseline; gap: 10px; padding-right: 18px; border-right: 1px solid var(--hair); }
#brand .mark {
  font-family: var(--f-mono); font-size: 10px; letter-spacing: .16em;
  color: var(--paper-raised); background: var(--ink);
  padding: 3px 6px; text-transform: uppercase; align-self: center;
}
#brand .name { font-family: var(--f-display); font-size: 15px; font-weight: 600; letter-spacing: .02em; white-space: nowrap; }

#toolbar button {
  font-family: var(--f-mono); font-size: 11px; letter-spacing: .05em;
  padding: 5px 12px;
  border: 1px solid var(--hair-strong);
  border-radius: 0;
  background: transparent; cursor: pointer;
  white-space: nowrap; color: var(--ink-2);
  transition: color .16s var(--ease), border-color .16s var(--ease), background .16s var(--ease);
}
#toolbar button:hover { color: var(--blueprint); border-color: var(--blueprint); background: var(--blueprint-soft); }
#toolbar button:active { transform: translateY(1px); }
#toolbar button.accent { background: var(--ink); color: var(--paper-raised); border-color: var(--ink); }
#toolbar button.accent:hover { background: var(--blueprint); border-color: var(--blueprint); }
#toolbar .week-nav { font-size: 10px; padding: 5px 9px; color: var(--ink-3); }
#toolbar .week-nav:hover { color: var(--blueprint); }

.week-group { display: flex; align-items: center; gap: 11px; }
#week-label {
  font-family: var(--f-display); font-size: 20px; font-weight: 600;
  line-height: 1.05; letter-spacing: .01em; min-width: 148px;
  display: flex; flex-direction: column; gap: 3px;
}
#week-label .wk-main { display: flex; align-items: center; }
#week-label .date-range {
  font-family: var(--f-mono); font-size: 10px; font-weight: 400;
  letter-spacing: .09em; color: var(--ink-3);
}
#week-label .wk-flag {
  font-family: var(--f-mono); font-style: normal; font-size: 8.5px;
  letter-spacing: .14em; text-transform: uppercase;
  color: var(--paper-raised); background: var(--blueprint);
  padding: 2px 5px; margin-left: 8px; vertical-align: 4px;
}

/* ===== Toast ===== */
#toast {
  position: fixed; top: 74px; left: 50%; transform: translate(-50%, -6px);
  padding: 8px 16px; font-size: 12px;
  font-family: var(--f-mono); letter-spacing: .04em;
  z-index: 9999; pointer-events: none;
  opacity: 0; transition: opacity .25s var(--ease), transform .25s var(--ease);
  background: var(--ink); color: var(--paper);
  border-left: 3px solid var(--blueprint);
  box-shadow: var(--shadow-2);
  display: flex; align-items: center;
}
#toast.show { opacity: 1; pointer-events: auto; transform: translate(-50%, 0); }

/* ===== Board ===== */
#board {
  flex: 1; overflow-y: auto; overflow-x: auto;
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 18px;
  padding: 20px 20px 96px;
  align-content: start;
}

/* ===== Column — 一张图纸 ===== */
.column {
  position: relative;
  background: var(--paper-raised);
  border: 1px solid var(--hair-strong);
  display: flex; flex-direction: column;
  min-width: 0;
  box-shadow: var(--shadow-1);
  transition: box-shadow .22s var(--ease), border-color .22s var(--ease);
}
.column:hover { box-shadow: var(--shadow-2); }
/* 裁切标记 */
.column::before, .column::after {
  content: ''; position: absolute; width: 10px; height: 10px;
  pointer-events: none; opacity: .5;
  border-color: var(--blueprint); border-style: solid; border-width: 0;
}
.column::before { top: -5px; left: -5px; border-top-width: 1px; border-left-width: 1px; }
.column::after { bottom: -5px; right: -5px; border-bottom-width: 1px; border-right-width: 1px; }

.column-header {
  padding: 11px 13px 10px;
  border-bottom: 1px solid var(--hair-strong);
  display: flex; align-items: flex-start; justify-content: space-between; gap: 8px;
  flex-shrink: 0;
  background: linear-gradient(180deg, var(--tint-ink), transparent);
}
.column-header .ph-left { min-width: 0; }
.column-header .sht {
  font-family: var(--f-mono); font-size: 9px; letter-spacing: .14em;
  text-transform: uppercase; color: var(--ink-3); display: block; margin-bottom: 3px;
}
.column-header .person-name {
  font-family: var(--f-display);
  font-size: 16px; font-weight: 600; letter-spacing: .01em;
  display: flex; align-items: center; gap: 7px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.column-header .person-name .dot {
  width: 7px; height: 7px; border-radius: 0; flex-shrink: 0;
  box-shadow: 0 0 0 1px rgba(0,0,0,.06);
}
.dot-c0 { background: var(--blueprint); }
.dot-c1 { background: var(--amber); }
.dot-c2 { background: var(--sage); }
.dot-c3 { background: var(--rust); }

.column-header .ph-right { text-align: right; flex-shrink: 0; }
.column-header .task-count {
  font-family: var(--f-mono); font-size: 15px; font-weight: 500; color: var(--ink);
  line-height: 1;
}
.column-header .task-count i {
  font-style: normal; font-size: 9px; letter-spacing: .1em; color: var(--ink-3);
  margin-left: 2px;
}
.column-header .ph-sub {
  display: block; font-family: var(--f-mono); font-size: 9px; letter-spacing: .08em;
  color: var(--ink-3); margin-top: 4px;
}
.column-header .ph-sub b { color: var(--sage); font-weight: 500; }

.column-body {
  flex: 0 1 auto; overflow-y: auto;
  padding: 12px 10px;
  display: flex; flex-direction: column; gap: 10px;
  min-height: 84px;
}
.column-body.empty {
  border: 1px dashed var(--hair-strong);
  margin: 12px 10px;
  min-height: 84px;
}
.column-body.empty::after {
  content: '待补充 / TO BE ADDED';
  text-align: center; color: var(--ink-3);
  font-family: var(--f-mono); font-size: 9.5px; letter-spacing: .12em;
  padding: 30px 0;
}
.column-footer { padding: 0 10px 11px; flex-shrink: 0; }
.column-footer button {
  width: 100%; padding: 7px;
  border: 1px dashed var(--hair-strong); border-radius: 0;
  background: transparent; color: var(--ink-3); cursor: pointer;
  font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .1em;
  transition: color .16s var(--ease), border-color .16s var(--ease), background .16s var(--ease);
}
.column-footer button:hover {
  border-color: var(--blueprint); color: var(--blueprint); background: var(--blueprint-soft);
  border-style: solid;
}

/* ===== Task Card ===== */
@keyframes card-in {
  from { opacity: 0; transform: translateY(7px); }
  to   { opacity: 1; transform: none; }
}
.task-card {
  position: relative;
  background: var(--paper-raised);
  border: 1px solid var(--hair);
  padding: 9px 10px 10px;
  cursor: grab;   /* 可编辑子元素各自覆盖成 text/pointer，留白处即起拖区 */
  -webkit-touch-callout: none;
  transition: border-color .18s var(--ease), box-shadow .18s var(--ease),
              background .18s var(--ease), opacity .18s var(--ease);
  animation: card-in .3s var(--ease) backwards;
  /* 不能用 both：动画填充会把 .dragging 的旋转和兄弟卡片的淡出一起锁死 */
}
/* 左侧引线：hover 时展开 */
.task-card::before {
  content: ''; position: absolute; left: -1px; top: -1px; bottom: -1px; width: 2px;
  background: var(--blueprint);
  transform: scaleY(0); transform-origin: top;
  transition: transform .22s var(--ease);
}
.task-card:hover { border-color: var(--hair-strong); box-shadow: var(--shadow-1); }
.task-card:hover::before { transform: scaleY(1); }
.task-card[data-status="已完成"] {
  background-image: repeating-linear-gradient(45deg, var(--hatch) 0 1px, transparent 1px 8px);
}
/* ===== 拖拽排序 —— CAD 选择集观感 ===== */
.task-card.dragging {
  border-color: var(--blueprint);
  border-style: dashed;
  box-shadow: var(--shadow-2);
  outline: 1px dashed var(--blueprint);
  outline-offset: 3px;
  transform: rotate(-.5deg);
  cursor: grabbing;
  z-index: 4;
  transition: none;
}
.task-card.dragging::before { transform: scaleY(1); }
#board.drag-active { user-select: none; cursor: grabbing; }
#board.drag-active .task-card:not(.dragging) { opacity: .5; }
/* 拖动中/落位后都关掉入场动画：DOM 重新插入会让它一遍遍重播 */
#board.drag-active .task-card, #board.no-anim .task-card { animation: none; }
.task-card .card-row { display: flex; align-items: center; gap: 7px; margin-bottom: 6px; }
.task-card .card-row:last-child { margin-bottom: 0; }
.task-card .card-row.wrap { flex-wrap: wrap; }
.task-card .spacer { flex: 1; }

.task-card .task-name {
  font-weight: 600; font-size: 13.5px; line-height: 1.4;
  flex: 1; min-width: 0; color: var(--ink); letter-spacing: .01em;
}
.task-card .task-name.editable { cursor: text; }
.task-card .task-name .placeholder { color: var(--ink-3); font-weight: 400; }

/* Priority — 引出线标签 */
.prio-badge {
  font-family: var(--f-mono); font-size: 9.5px; font-weight: 500;
  letter-spacing: .1em; text-transform: uppercase;
  padding: 1.5px 5px 1.5px 0; flex-shrink: 0;
  border-bottom: 1px solid currentColor;
  transition: background .16s var(--ease);
}
.prio-badge::before {
  content: attr(data-code);
  margin-right: 5px; opacity: .55; letter-spacing: .06em;
}
.prio-high { color: var(--rust); }
.prio-med  { color: var(--amber); }
.prio-low  { color: var(--sage); }
.prio-badge:hover { background: var(--tint-ink); }

/* Progress — 尺寸标注线 */
.dim {
  flex: 1; min-width: 0;
  display: flex; align-items: center; gap: 8px;
  padding: 3px 0;
  touch-action: none; user-select: none;
}
.dim-line {
  flex: 1; min-width: 34px; position: relative;
  display: flex; align-items: center; height: 15px;
}
.dim-track {
  flex: 1; position: relative; height: 2px;
  background: var(--paper-sunk);
  box-shadow: inset 0 0 0 1px var(--hair);
  cursor: ew-resize;
  transition: height .16s var(--ease);
}
.dim:hover .dim-track, .dim.editing .dim-track { height: 6px; }
.dim-fill {
  position: absolute; left: 0; top: 0; bottom: 0; display: block;
  background: var(--blueprint);
  transition: width .35s var(--ease), background .25s var(--ease);
}
.dim.dragging .dim-fill { transition: none; }
.dim-thumb {
  position: absolute; top: 50%; width: 9px; height: 9px; display: block;
  transform: translate(-50%, -50%) rotate(45deg);
  background: var(--paper-raised);
  border: 1.5px solid var(--blueprint);
  opacity: 0; transition: opacity .16s var(--ease), scale .16s var(--ease);
  scale: .7;
}
.dim:hover .dim-thumb, .dim.editing .dim-thumb { opacity: 1; scale: 1; }
.dim.editing .dim-thumb { background: var(--blueprint); }
/* 尺寸界线端头：建筑制图惯用的 45° 斜切标记 */
.dim-tick {
  width: 1px; height: 10px; flex-shrink: 0;
  background: var(--hair-strong);
  transform: rotate(45deg);
}
/* 刻度尺：每 10% 一根分度线，让进度条读起来像一把比例尺 */
.dim-line::after {
  content: ''; position: absolute; left: 1px; right: 1px;
  top: calc(50% + 4px); height: 3px; pointer-events: none;
  background: repeating-linear-gradient(90deg,
    var(--hair-strong) 0 1px, transparent 1px 11.1111%);
  opacity: .55;
  transition: opacity .16s var(--ease);
}
.dim:hover .dim-line::after { opacity: .9; }
.dim-val {
  font-family: var(--f-mono); font-size: 10.5px; font-weight: 500;
  color: var(--ink-2); min-width: 34px; text-align: right;
  font-variant-numeric: tabular-nums; flex-shrink: 0;
}
.dim-val i { font-style: normal; opacity: .5; font-size: 9px; margin-left: 1px; }
.dim[data-level="low"]  .dim-fill { background: var(--rust); }
.dim[data-level="mid"]  .dim-fill { background: var(--blueprint); }
.dim[data-level="high"] .dim-fill { background: var(--sage); }
.dim[data-level="none"] .dim-fill { background: transparent; }
.dim[data-level="low"]  .dim-thumb { border-color: var(--rust); }
.dim[data-level="mid"]  .dim-thumb { border-color: var(--blueprint); }
.dim[data-level="high"] .dim-thumb { border-color: var(--sage); }
.dim[data-level="none"] .dim-thumb { border-color: var(--ink-4); }
.dim[data-level="low"]  .dim-val { color: var(--rust); }
.dim[data-level="high"] .dim-val { color: var(--sage); }

/* Status — 制图校验标记 */
.status-badge {
  display: inline-flex; align-items: center; gap: 5px;
  font-family: var(--f-mono); font-size: 10px; letter-spacing: .06em;
  flex-shrink: 0; padding: 1px 0; cursor: pointer;
  color: var(--ink-3);
  border-bottom: 1px solid transparent;
  transition: border-color .16s var(--ease), color .16s var(--ease);
}
.status-badge:hover { border-bottom-color: currentColor; }
.status-badge::before {
  content: ''; width: 8px; height: 8px; flex-shrink: 0;
  border: 1px solid currentColor;
}
.status-badge[data-status="进行中"] { color: var(--blueprint); }
.status-badge[data-status="进行中"]::before {
  background: linear-gradient(to top, var(--blueprint) 50%, transparent 50%);
}
.status-badge[data-status="已完成"] { color: var(--sage); }
.status-badge[data-status="已完成"]::before {
  background: var(--sage);
  box-shadow: inset 0 0 0 1px var(--sage);
}

/* Dates — 时间标注 */
.task-card .task-dates {
  display: inline-flex; align-items: center; gap: 5px;
  font-family: var(--f-mono); font-size: 10px; letter-spacing: .04em;
  color: var(--ink-3); font-variant-numeric: tabular-nums;
}
.task-card .task-dates em { font-style: normal; color: var(--ink-4); }
.task-card .task-dates .editable { cursor: pointer; transition: color .16s var(--ease); }
.task-card .task-dates .editable:hover { color: var(--blueprint); }
.task-card .date-range .placeholder { color: var(--ink-3); letter-spacing: .08em; }

/* Notes */
.task-card .notes {
  font-size: 11.5px; line-height: 1.5; color: var(--ink-3);
  flex: 1; min-width: 0;
  border-top: 1px dotted var(--hair); padding-top: 5px;
}
.task-card .notes .placeholder { color: var(--ink-3); font-family: var(--f-mono); font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; }

/* Delete button */
.card-del {
  width: 16px; height: 16px; line-height: 14px; text-align: center;
  flex-shrink: 0;
  border: 1px solid transparent; background: transparent;
  color: var(--ink-3); font-size: 13px; cursor: pointer;
  opacity: 0; transition: opacity .16s var(--ease), color .16s var(--ease), border-color .16s var(--ease);
}
.task-card:hover .card-del { opacity: 1; }
.card-del:hover { color: var(--rust); border-color: var(--rust); }
@media (hover: none) { .card-del { opacity: .55; } }

/* ===== Inline Edit ===== */
.editable { cursor: pointer; }
.task-card input, .task-card select {
  font-family: var(--f-mono); font-size: 12px;
  border: 1px solid var(--blueprint); border-radius: 0;
  outline: none; padding: 1px 4px;
  background: var(--paper-raised); color: var(--ink);
}
.task-card input:focus, .task-card select:focus { box-shadow: 0 0 0 2px var(--blueprint-soft); }
.task-card .task-name input[type="text"] { font-family: var(--f-body); width: 100%; font-size: 13px; }
.task-card input[type="number"] { width: 56px; text-align: center; }
.task-card input[type="date"] { width: 112px; }
.task-card select { cursor: pointer; }

/* ===== Scrollbar ===== */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--hair-strong); }
::-webkit-scrollbar-thumb:hover { background: var(--blueprint); }

/* ===== Sync Indicator ===== */
#sync-status {
  display: none; align-items: center; gap: 6px;
  font-family: var(--f-mono); font-size: 10px; letter-spacing: .09em;
  text-transform: uppercase; color: var(--ink-3);
}
#sync-status.configured { display: flex; }
#sync-status .sync-dot {
  width: 6px; height: 6px; border-radius: 0; transform: rotate(45deg);
  background: var(--ink-4); flex-shrink: 0;
}
#sync-status.synced .sync-dot { background: var(--sage); }
#sync-status.syncing .sync-dot { background: var(--amber); animation: pulse .9s infinite; }
#sync-status.error .sync-dot { background: var(--rust); }
@keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.25; } }

#toolbar .tools { display: flex; align-items: center; gap: 6px; }
#btn-settings { font-size: 12px; padding: 4px 8px; border-color: transparent; }
#btn-settings:hover { border-color: var(--blueprint); }

/* ===== Settings Dialog ===== */
#settings-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(20, 24, 26, .48);
  backdrop-filter: blur(3px);
  z-index: 10000;
  align-items: center; justify-content: center;
}
#settings-overlay.show { display: flex; }
#settings-dialog {
  background: var(--paper-raised);
  border: 1px solid var(--hair-strong);
  box-shadow: 0 0 0 5px var(--paper-raised), var(--shadow-2);
  padding: 26px 26px 22px;
  width: 430px; max-width: 90vw;
}
#settings-dialog h3 {
  font-family: var(--f-display); font-size: 17px; font-weight: 600;
  margin-bottom: 4px; letter-spacing: .01em;
}
#settings-dialog .sub {

}
#settings-dialog label {
  display: block; font-family: var(--f-mono); font-size: 9.5px; font-weight: 500;
  letter-spacing: .13em; text-transform: uppercase;
  color: var(--ink-3); margin-bottom: 5px; margin-top: 15px;
}
#settings-dialog label:first-of-type { margin-top: 0; }
#settings-dialog input {
  width: 100%; padding: 8px 10px; border: 1px solid var(--hair-strong);
  border-radius: 0; font-family: var(--f-mono); font-size: 12.5px;

}
#settings-dialog input:focus { outline: none; border-color: var(--blueprint); box-shadow: 0 0 0 2px var(--blueprint-soft); }
#settings-dialog .hint {
  font-size: 11px; color: var(--ink-3); margin-top: 5px; line-height: 1.5;
}
#settings-dialog .hint a { color: var(--blueprint); }
#settings-dialog .btn-row {
  display: flex; gap: 8px; justify-content: flex-end;
  margin-top: 22px; padding-top: 15px; border-top: 1px solid var(--hair);
}
#settings-dialog button {
  font-family: var(--f-mono); font-size: 11px; letter-spacing: .05em;
  padding: 7px 15px; border-radius: 0; cursor: pointer;
  border: 1px solid var(--hair-strong); background: transparent; color: var(--ink-2);
  transition: all .16s var(--ease);
}
#settings-dialog button:hover { border-color: var(--blueprint); color: var(--blueprint); background: var(--blueprint-soft); }
#settings-dialog button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
#settings-dialog button.primary:hover { background: var(--blueprint); border-color: var(--blueprint); color: var(--paper-raised); }
#settings-dialog button.danger { color: var(--rust); border-color: transparent; background: transparent; margin-right: auto; }
#settings-dialog button.danger:hover { background: var(--rust); color: var(--paper-raised); border-color: var(--rust); }

/* ===== Save stamp ===== */
#save-bar {
  position: fixed; bottom: 0; left: 0; right: 0;
  display: flex; justify-content: center;
  padding: 12px 0 14px; z-index: 200;
  pointer-events: none;
  background: linear-gradient(to top, var(--paper) 30%, transparent);
}
#btn-save {
  pointer-events: auto;
  font-family: var(--f-mono); font-size: 11px; font-weight: 500; letter-spacing: .11em;
  text-transform: uppercase;
  padding: 9px 20px;
  border-radius: 0; cursor: pointer;
  display: flex; align-items: center; gap: 9px;
  background: var(--paper-raised); color: var(--ink-2);
  border: 1px solid var(--hair-strong);
  box-shadow: var(--shadow-1);
  transition: all .2s var(--ease);
}
#btn-save:hover { border-color: var(--blueprint); color: var(--blueprint); }
#btn-save .save-icon { font-size: 12px; line-height: 1; }
#btn-save.saved { color: var(--sage); border-color: var(--sage); }
#btn-save.saving { color: var(--amber); border-color: var(--amber); }
#btn-save.unsaved {
  background: var(--ink); color: var(--paper); border-color: var(--ink);
  animation: stamp-glow 2s var(--ease) infinite;
}
#btn-save.unsaved:hover { background: var(--blueprint); border-color: var(--blueprint); color: var(--paper-raised); }
#btn-save.error { color: var(--rust); border-color: var(--rust); background: var(--paper-raised); }
@keyframes stamp-glow {
  0%, 100% { box-shadow: 0 0 0 0 rgba(28,26,22,.28); }
  55%      { box-shadow: 0 0 0 7px rgba(28,26,22,0); }
}

/* ===== Search & Filter ===== */
.search-input {
  font-family: var(--f-mono); font-size: 11.5px;
  padding: 5px 2px; width: 152px;
  border: none; border-bottom: 1px solid var(--hair-strong);
  background: transparent; outline: none; color: var(--ink);
  border-radius: 0;
  transition: border-color .16s var(--ease);
}
.search-input:focus { border-bottom-color: var(--blueprint); }
.search-input::placeholder { color: var(--ink-3); letter-spacing: .05em; }

.status-filters { display: flex; gap: 4px; }
/* 注意：#toolbar button 的 ID 特异性更高，这里必须同级作用域才能生效 */
#toolbar .filter-btn {
  font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .07em;
  padding: 4px 10px; color: var(--ink-3);
}
#toolbar .filter-btn:hover { color: var(--blueprint); border-color: var(--blueprint); background: var(--blueprint-soft); }
#toolbar .filter-btn.active {
  background: var(--ink); border-color: var(--ink);
  color: var(--paper-raised); font-weight: 500;
}
#toolbar .filter-btn.active:hover { background: var(--blueprint); border-color: var(--blueprint); color: var(--paper-raised); }

/* ===== Stats — 图签栏 ===== */
#stats-bar {
  display: flex; align-items: stretch; flex-wrap: wrap;
  background: var(--paper-raised);
  border-bottom: 1px solid var(--hair-strong);

}
.stat-cell {
  display: flex; flex-direction: column; gap: 4px;

}
.stat-cell.wide { min-width: 150px; flex: 0 0 auto; }
.stat-cell .anno { font-size: 8.5px; letter-spacing: .15em; }
.stat-value {
  font-family: var(--f-mono); font-size: 18px; font-weight: 500; line-height: 1;

}
.stat-value em { font-style: normal; font-size: 10px; color: var(--ink-3); margin-left: 1px; }
.stat-value.is-good { color: var(--sage); }
.stat-value.is-warn { color: var(--amber); }
.stat-value.is-bad  { color: var(--rust); }
.rate-track { position: relative; height: 2px; width: 100%; background: var(--paper-sunk); box-shadow: inset 0 0 0 1px var(--hair); margin-top: 3px; }
.rate-track i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--blueprint); transition: width .45s var(--ease); }
.rate-track.is-good i { background: var(--sage); }
.rate-track.is-warn i { background: var(--amber); }
.rate-track.is-bad  i { background: var(--rust); }

.stat-person {

  font-variant-numeric: tabular-nums; color: var(--ink-3); flex-shrink: 0;
}
.stat-person .sp-num b { color: var(--sage); font-weight: 500; }
.sp-bar { position: relative; height: 2px; background: var(--paper-sunk); box-shadow: inset 0 0 0 1px var(--hair); }
.sp-bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--blueprint); transition: width .45s var(--ease); }

.stat-legend {
  display: flex; align-items: center; gap: 14px;
  padding: 9px 18px; margin-left: auto;
  font-family: var(--f-mono); font-size: 9px; letter-spacing: .1em;

  border-left: 1px solid var(--hair);
}

.stat-legend .lg-not { color: var(--ink-3); }

/* ===== Responsive ===== */
@media (max-width: 1120px) { #board { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 700px) {
  #board { grid-template-columns: minmax(0, 1fr); padding: 14px 14px 92px; gap: 14px; }

  #brand { padding-right: 10px; }
  #brand .name { display: none; }
  #week-label { font-size: 17px; }
  .search-input { width: 100%; }
  #stats-bar { overflow-x: auto; }
  .stat-legend { display: none; }
  .stat-person { flex: 0 0 auto; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

/* ===== Print — 晒图（A3 横排图纸） ===== */
#title-block { display: none; }
@page { size: A3 landscape; margin: 10mm; }

@media print {
  /* 蓝图夜览不进打印机：强制回到纸面 */
  :root, body[data-theme="blueprint"] {
    --paper: #FFFFFF;
    --paper-raised: #FFFFFF;
    --paper-sunk: #EDEAE2;
    --grid: transparent;
    --grid-bold: transparent;
    --ink: #1C1A16;
    --ink-2: #4A463E;
    --ink-3: #6E6659;
    --hair: #D8D2C6;
    --hair-strong: #B4AA97;
    --shadow-1: none;
    --shadow-2: none;
    --hatch: rgba(76, 107, 78, .05);
  }
  /* 浏览器默认不打印背景，但剖面线与尺寸线填充是这张图的信息 */
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  html, body { height: auto; overflow: visible; background: #fff; }
  body { display: block; background-image: none; }
  #toolbar, #save-bar, #settings-overlay, #toast, .card-del, .column-footer { display: none !important; }
  #stats-bar { border-bottom: 1px solid var(--hair-strong); }
  /* 四列挤一行在 A3 上太窄，改成 2×2 图框 */
  #board {
    display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 6mm 5mm; padding: 5mm 0 0; overflow: visible;
  }
  .column { box-shadow: none; break-inside: auto; }
  .column-body { overflow: visible; padding: 8px 8px 0; }
  .task-card { break-inside: avoid; box-shadow: none; animation: none; }
  #title-block {
    display: flex; flex-wrap: wrap;
    margin-top: 6mm; border: 1px solid var(--ink);
  }
  .tb-cell {
    display: flex; flex-direction: column; gap: 3px;
    padding: 5px 12px; border-right: 1px solid var(--hair-strong);
    min-width: 74px;
  }
  .tb-cell:last-child { border-right: none; }
  .tb-cell.grow { flex: 1; }
  .tb-cell .anno { font-size: 7.5px; letter-spacing: .16em; }
  .tb-val {
    font-family: var(--f-mono); font-size: 11px; font-weight: 500;
    color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .tb-val.zh { font-family: var(--f-display); font-weight: 600; font-size: 12.5px; }
}
</style>
</head>
<body>

<div id="toolbar">
  <div id="brand">
    <span class="mark">WTP</span>
    <span class="name">效果图部门 · 周任务进度表</span>
  </div>
  <div class="week-group">
    <button type="button" class="week-nav" id="btn-prev-week" title="上一周">◀</button>
    <span id="week-label"></span>
    <button type="button" class="week-nav" id="btn-next-week" title="下一周">▶</button>

  <button type="button" id="btn-copy-prev">复制上周未完成</button>

  <div id="status-filters" class="status-filters">
    <button type="button" class="filter-btn active" data-filter="all">全部</button>
    <button type="button" class="filter-btn" data-filter="未开始">未开始</button>

  <span class="sep"></span>
  <span id="sync-status"><span class="sync-dot"></span><span id="sync-text">未配置同步</span></span>
  <button type="button" id="btn-theme" title="切换图纸/蓝图配色">◐</button>
  <button type="button" id="btn-settings" title="同步设置">⚙</button>
</div>

<div id="toast"></div>
<div id="stats-bar"></div>
<div id="board"></div>
<div id="title-block"></div>

<div id="save-bar">
  <button type="button" id="btn-save" class="saved">
    <span class="save-icon">✓</span>
    <span class="save-text">已同步</span>
  </button>
</div>

<div id="settings-overlay">
  <div id="settings-dialog">
    <h3>同步设置</h3>
    <p class="sub">Cloud Sync · GitHub Gist</p>
    <label>Gist ID</label>
    <input type="text" id="cfg-gist-id" value="1c847a7d6d0e61fb090eb581d5e988b7" placeholder="从 Gist URL 中复制，如 a1b2c3d4e5f6...">
    <p class="hint">创建一个 <a href="https://gist.github.com/" target="_blank" rel="noopener">GitHub Gist</a>，在 URL 末尾获取 ID</p>
    <label>GitHub Token</label>
    <input type="password" id="cfg-token" placeholder="ghp_xxxxxxxxxxxx">
    <p class="hint">在 <a href="https://github.com/settings/tokens" target="_blank" rel="noopener">github.com/settings/tokens</a> 创建 classic token，勾选 gist 权限</p>
    <div class="btn-row">
      <button type="button" class="danger" id="btn-disconnect">断开同步</button>
      <button type="button" id="btn-cancel-settings">取消</button>
      <button type="button" class="primary" id="btn-save-settings">保存并同步</button>
    </div>
  </div>
</div>

<script>
// ======================================================================
// Constants
// ======================================================================
const C = {
  STORAGE_KEY: 'renderDeptWeeklyTracker',
  THEME_KEY: 'renderTrackerTheme',
  SCHEMA_VERSION: 2,
  MEMBERS: ['易榆乔', '杨威', '易灿', '刘新金'],
  DOT_CLASSES: ['dot-c0','dot-c1','dot-c2','dot-c3'],
  PRIORITIES: ['高', '中', '低'],
  STATUSES: ['未开始', '进行中', '已完成'],
  PRIO_CLASSES: { '高': 'prio-high', '中': 'prio-med', '低': 'prio-low' },
  PRIO_CODES: { '高': 'P1', '中': 'P2', '低': 'P3' },
  FIELD_CN: {
    name: '名称', priority: '优先级', status: '状态', progress: '进度',
    startDate: '开始日期', dueDate: '截止日期', notes: '备注',
  },
};

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// ======================================================================
// FilterState — Search & status filter
// ======================================================================
const FilterState = {
  search: '',
  statusFilter: 'all', // 'all' | '未开始' | '进行中' | '已完成'

  apply(tasks) {
    let result = tasks;
    if (this.statusFilter !== 'all') {
      result = result.filter(t => t.status === this.statusFilter);
    }
    if (this.search) {
      const q = this.search.toLowerCase();
      result = result.filter(t =>
        (t.name || '').toLowerCase().includes(q) ||
        (t.notes || '').toLowerCase().includes(q)
      );
    }
    return result;
  },
};

// ======================================================================
// GistSync — GitHub Gist data sync
// ======================================================================
const GistSync = {
  CONFIG_KEY: 'renderTrackerSyncConfig',
  DEFAULT_GIST_ID: '1c847a7d6d0e61fb090eb581d5e988b7',
  // SECURITY: TODO — 这个 token 不应硬编码在源码中，待迁移到用户输入方式。
  // 当前仅限内部使用，切勿将此文件公开托管。
  DEFAULT_TOKEN: 'ghp_' + 'Zhox7ql0pCmgMR03n93sNVclmUj9Up1I7Uwq',

  loadConfig() {
    try {
      const raw = localStorage.getItem(this.CONFIG_KEY);
      const saved = raw ? JSON.parse(raw) : {};
      return {
        gistId: saved.gistId || this.DEFAULT_GIST_ID,
        token: saved.token || this.DEFAULT_TOKEN,
      };
    } catch {
      return { gistId: this.DEFAULT_GIST_ID, token: this.DEFAULT_TOKEN };
    }
  },

  saveConfig(cfg) {
    localStorage.setItem(this.CONFIG_KEY, JSON.stringify(cfg));
  },

  isConfigured() {
    const cfg = this.loadConfig();
    return !!(cfg.gistId && cfg.token);
  },

  async pull() {
    const cfg = this.loadConfig();
    if (!cfg.gistId || !cfg.token) return null;
    try {
      const resp = await fetch(`https://api.github.com/gists/${cfg.gistId}`, {
        headers: { Authorization: `Bearer ${cfg.token}`, Accept: 'application/vnd.github+json' },
      });
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      const gist = await resp.json();
      const file = Object.values(gist.files)[0];
      if (!file || !file.content) return null;
      const data = JSON.parse(file.content);
      return data;
    } catch (e) {
      console.warn('Gist pull failed:', e.message);
      return null;
    }
  },

  async push(state) {
    const cfg = this.loadConfig();
    if (!cfg.gistId || !cfg.token) return false;
    try {
      const content = JSON.stringify(state, null, 2);
      const resp = await fetch(`https://api.github.com/gists/${cfg.gistId}`, {
        method: 'PATCH',
        headers: { Authorization: `Bearer ${cfg.token}`, Accept: 'application/vnd.github+json' },
        body: JSON.stringify({
          files: { 'weekly-data.json': { content } },
        }),
      });
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      return true;
    } catch (e) {
      console.warn('Gist push failed:', e.message);
      return false;
    }
  },

  // Merge remote into local: tasks from either side kept, deduped by id.
  // Remote wins on conflict (same id, newer updatedAt).
  // 远端没有新内容时原样返回 localState，便于调用方按引用判断是否有变化。
  merge(localState, remoteState) {
    if (!remoteState || !Array.isArray(remoteState.tasks)) return localState;
    const taskMap = new Map();
    (localState.tasks || []).forEach(t => taskMap.set(t.id, t));
    let changed = false;
    remoteState.tasks.forEach(t => {
      const existing = taskMap.get(t.id);
      if (existing) {
        if (t.updatedAt > existing.updatedAt) { taskMap.set(t.id, t); changed = true; }
      } else {
        taskMap.set(t.id, t); changed = true;
      }
    });
    if (!changed) return localState;
    return {
      ...localState,
      tasks: Array.from(taskMap.values()),
      currentWeek: localState.currentWeek || remoteState.currentWeek,
    };
  },

  // Debounced push: call after every save, batches uploads
  _pushTimer: null,
  pushDebounced(state) {
    if (!this.isConfigured()) return;
    clearTimeout(this._pushTimer);
    SaveBtn.setUnsaved();
    this._pushTimer = setTimeout(() => this._doPush(state), 3000);
  },

  // Immediate push (called by save button)
  async saveNow(state) {
    if (!this.isConfigured()) return false;
    clearTimeout(this._pushTimer);
    return await this._doPush(state);
  },

  async _doPush(state) {
    SaveBtn.setSaving();
    SyncStatus.syncing();
    const ok = await this.push(state);
    if (ok) {
      SaveBtn.setSaved();
      SyncStatus.configured();
    } else {
      SaveBtn.setError();
      SyncStatus.error('同步失败');
    }
    return ok;
  },
};

// ======================================================================
// SaveBtn — Floating save button at bottom center
// ======================================================================
const SaveBtn = {
  _set(cls, icon, text) {
    const btn = document.getElementById('btn-save');
    btn.className = cls;
    btn.querySelector('.save-icon').textContent = icon;
    btn.querySelector('.save-text').textContent = text;
  },
  setSaved()   { this._set('saved',   '✓', '已同步'); },
  setUnsaved() { this._set('unsaved', '↑', '点击上传到云端'); },
  setSaving()  { this._set('saving',  '◎', '上传中…'); },
  setError()   { this._set('error',   '↻', '同步失败 · 点击重试'); },
};

// ======================================================================
// SyncStatus — UI indicator
// ======================================================================
const SyncStatus = {
  _timer: null,

  set(state, text) {
    const el = document.getElementById('sync-status');
    const txt = document.getElementById('sync-text');
    el.className = state;
    if (state === 'configured') el.classList.add('configured');
    txt.textContent = text || '';
    if (state === 'configured') {
      // After synced, auto-fade to idle
      clearTimeout(this._timer);
      this._timer = setTimeout(() => { txt.textContent = ''; }, 2000);
    }
  },

  showConfigured() {
    document.getElementById('sync-status').classList.add('configured');
  },

  configured() { this.set('synced', '已同步'); },
  syncing()  { this.set('syncing', '同步中...'); },
  error(msg) { this.set('error', msg || '同步失败'); },
  notConfigured() {
    document.getElementById('sync-status').classList.remove('configured');
    document.getElementById('sync-status').className = '';
    document.getElementById('sync-text').textContent = '未配置同步';
  },
};

// ======================================================================
// Toast
// ======================================================================
const Toast = {
  _timer: null,
  show(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg; el.classList.add('show');
    clearTimeout(this._timer);
    this._timer = setTimeout(() => el.classList.remove('show'), 2000);
  },
  showUndo(msg, onUndo, timeoutMs = 5000) {
    const el = document.getElementById('toast');
    el.innerHTML = '';
    const span = document.createElement('span');
    span.textContent = msg;
    el.appendChild(span);
    const btn = document.createElement('button');
    btn.textContent = '撤销';
    btn.style.cssText = 'background:transparent;color:var(--paper);border:1px solid var(--paper);border-radius:0;padding:2px 9px;margin-left:12px;cursor:pointer;font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;opacity:.85;';
    btn.addEventListener('mouseenter', () => { btn.style.opacity = '1'; });
    btn.addEventListener('mouseleave', () => { btn.style.opacity = '.85'; });
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      clearTimeout(this._timer);
      el.classList.remove('show');
      onUndo();
    });
    el.appendChild(btn);
    el.classList.add('show');
    clearTimeout(this._timer);
    this._timer = setTimeout(() => el.classList.remove('show'), timeoutMs);
  }
};

// ======================================================================
// WeekUtils — ISO 8601 week calculations (unchanged from v1)
// ======================================================================
const WeekUtils = {
  getMonday(d) {
    const c = new Date(d);
    const day = c.getDay() || 7;
    c.setDate(c.getDate() - day + 1);
    c.setHours(0,0,0,0);
    return c;
  },
  getISOWeek(d) {
    const monday = this.getMonday(d);
    const thursday = new Date(monday);
    thursday.setDate(monday.getDate() + 3);
    const year = thursday.getFullYear();
    const jan4 = new Date(year, 0, 4);
    const jan4Monday = this.getMonday(jan4);
    const weekNum = Math.round(((thursday - jan4Monday) / 86400000) / 7) + 1;
    return { year, week: weekNum };
  },
  formatWeekStr(y, w) { return y + '-W' + String(w).padStart(2, '0'); },
  parseWeekStr(str) {
    const m = str.match(/^(\d{4})-W(\d{2})$/);
    return m ? { year: +m[1], week: +m[2] } : null;
  },
  weekStrToMonday(weekStr) {
    const p = this.parseWeekStr(weekStr);
    if (!p) return new Date();
    const jan4 = new Date(p.year, 0, 4);
    const jan4Monday = this.getMonday(jan4);
    const r = new Date(jan4Monday);
    r.setDate(jan4Monday.getDate() + (p.week - 1) * 7);
    return r;
  },
  getWeekDateRange(weekStr) {
    const monday = this.weekStrToMonday(weekStr);
    const sunday = new Date(monday);
    sunday.setDate(monday.getDate() + 6);
    return { start: monday, end: sunday };
  },
  // 制图标注写法：09.15 — 09.21
  formatDimRange(weekStr) {
    const r = this.getWeekDateRange(weekStr);
    const p = n => String(n).padStart(2, '0');
    const a = p(r.start.getMonth() + 1) + '.' + p(r.start.getDate());
    const b = p(r.end.getMonth() + 1) + '.' + p(r.end.getDate());
    return a + ' — ' + b;
  },
  addWeeks(weekStr, delta) {
    const monday = this.weekStrToMonday(weekStr);
    monday.setDate(monday.getDate() + delta * 7);
    const iso = this.getISOWeek(monday);
    return this.formatWeekStr(iso.year, iso.week);
  },
  isCurrentWeek(weekStr) {
    const now = this.getISOWeek(new Date());
    return weekStr === this.formatWeekStr(now.year, now.week);
  },
};

// ======================================================================
// Storage
// ======================================================================
const Storage = {
  load() {
    try {
      const raw = localStorage.getItem(C.STORAGE_KEY);
      if (!raw) return this.getDefault();
      const state = JSON.parse(raw);
      if (!state) return this.getDefault();
      if (state.schemaVersion === 1) return this.migrateV1toV2(state);
      if (state.schemaVersion !== C.SCHEMA_VERSION) return this.getDefault();
      return state;
    } catch (e) {
      return this.getDefault();
    }
  },

  // Async load: local first, then try remote merge.
  // 返回同一个引用表示远端没有带来变化。
  async loadAsync(local) {
    if (!GistSync.isConfigured()) {
      SyncStatus.notConfigured();
      return local;
    }
    SyncStatus.showConfigured();
    SyncStatus.syncing();
    const remote = await GistSync.pull();
    if (remote) {
      const merged = GistSync.merge(local, remote);
      this.save(merged);
      SyncStatus.configured();
      return merged;
    }
    SyncStatus.error('无法获取远程数据');
    return local;
  },

  migrateV1toV2(v1) {
    // Convert old per-person-progress tasks to new per-person tasks
    const newTasks = [];
    if (Array.isArray(v1.tasks)) {
      v1.tasks.forEach(t => {
        if (t.progress) {
          C.MEMBERS.forEach(m => {
            const prog = t.progress[m];
            if (!prog) return;
            newTasks.push({
              id: t.id + '_' + m,
              person: m,
              name: t.name || '',
              priority: t.priority || '中',
              progress: prog.percentage || 0,
              status: prog.status || '未开始',
              startDate: t.startDate || '',
              dueDate: t.dueDate || '',
              notes: t.notes || '',
              week: t.week || v1.currentWeek,
              createdAt: t.createdAt || new Date().toISOString(),
              updatedAt: t.updatedAt || new Date().toISOString(),
            });
          });
        }
      });
    }
    return {
      schemaVersion: C.SCHEMA_VERSION,
      currentWeek: v1.currentWeek || this.getDefault().currentWeek,
      tasks: newTasks,
    };
  },

  save(state) {
    try {
      localStorage.setItem(C.STORAGE_KEY, JSON.stringify(state));
    } catch (e) {
      Toast.show('存储空间不足，请清理旧数据');
    }
  },

  getDefault() {
    const now = WeekUtils.getISOWeek(new Date());
    return {
      schemaVersion: C.SCHEMA_VERSION,
      currentWeek: WeekUtils.formatWeekStr(now.year, now.week),
      tasks: [],
    };
  },
};

// ======================================================================
// DataModel — Simplified for per-person tasks
// ======================================================================
const DataModel = {
  state: null,

  init(raw) {
    this.state = raw;
    this._normalizeOrder();
  },

  // Gist 上的旧数据没有 order，按数组顺序补在末尾，避免排序时互相覆盖
  _normalizeOrder() {
    const tasks = this.state.tasks || [];
    let max = -1;
    tasks.forEach(t => { if (typeof t.order === 'number' && t.order > max) max = t.order; });
    tasks.forEach(t => { if (typeof t.order !== 'number') t.order = ++max; });
  },

  _nextOrder() {
    return (this.state.tasks || []).reduce((m, t) => Math.max(m, t.order || 0), 0) + 1;
  },

  _byOrder(a, b) { return (a.order || 0) - (b.order || 0); },

  getTasks(weekStr) {
    return this.state.tasks.filter(t => t.week === weekStr).sort(this._byOrder);
  },

  getTasksByPerson(weekStr, person) {
    return this.state.tasks
      .filter(t => t.week === weekStr && t.person === person)
      .sort(this._byOrder);
  },

  getPrevWeekTasks(weekStr) {
    const prev = WeekUtils.addWeeks(weekStr, -1);
    return this.state.tasks.filter(t => t.week === prev);
  },

  newTask(weekStr, person) {
    return {
      id: 't_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8),
      person,
      name: '',
      priority: '中',
      progress: 0,
      status: '未开始',
      startDate: '',
      dueDate: '',
      notes: '',
      week: weekStr,
      order: this._nextOrder(),
      createdAt: new Date().toISOString(),
      updatedAt: new Date().toISOString(),
    };
  },

  addTask(weekStr, person) {
    const task = this.newTask(weekStr, person);
    this.state.tasks.push(task);
    this._save();
    return task;
  },

  updateField(taskId, field, value) {
    const task = this.state.tasks.find(t => t.id === taskId);
    if (!task) return;
    UndoStack.push('修改' + (C.FIELD_CN[field] || field));
    task[field] = value;
    if (field === 'status') this._applyStatusConstraint(task);
    else if (field === 'progress') this._applyProgressConstraint(task);
    task.updatedAt = new Date().toISOString();
    this._save();
  },

  _applyStatusConstraint(task) {
    if (task.status === '未开始') task.progress = 0;
    else if (task.status === '已完成') task.progress = 100;
    else if (task.progress === 0) task.progress = 1;
    else if (task.progress >= 100) task.progress = 99;
  },

  _applyProgressConstraint(task) {
    if (task.progress === 0) task.status = '未开始';
    else if (task.progress >= 100) { task.progress = 100; task.status = '已完成'; }
    else task.status = '进行中';
  },

  copyIncompleteFromPrev(weekStr) {
    const prevTasks = this.getPrevWeekTasks(weekStr);
    const pending = prevTasks.filter(t => t.status !== '已完成' && t.progress < 100);
    // 同名同人视为已复制过，避免连点两下就翻倍
    const existing = new Set(this.getTasks(weekStr).map(t => t.person + '\u241f' + t.name));
    const incomplete = pending.filter(t => !existing.has(t.person + '\u241f' + t.name));
    const skipped = pending.length - incomplete.length;

    const stamp = Date.now();
    const copies = incomplete.map((t, i) => {
      const copy = JSON.parse(JSON.stringify(t));
      copy.id = `t_${stamp}_${i}_${Math.random().toString(36).slice(2, 8)}`;
      copy.week = weekStr;
      copy.progress = 0;
      copy.status = '未开始';
      copy.order = this._nextOrder();   // 深拷贝会带上源任务的 order，会和本周撞位
      copy.createdAt = new Date().toISOString();
      copy.updatedAt = new Date().toISOString();
      this.state.tasks.push(copy);
      return copy;
    });
    if (copies.length > 0) this._save();
    return { copies, skipped };
  },

  _save() { Storage.save(this.state); GistSync.pushDebounced(this.state); },
};

// ======================================================================
// Renderer — Card-based layout
// ======================================================================
const Renderer = {
  // noAnim：局部改动（拖拽落位、撤销）不要整版重播入场动画。
  // 类留在 board 上直到下一次带动画的渲染，中途摘掉会让现有卡片重新开始动画。
  renderAll(weekStr, noAnim) {
    document.getElementById('board').classList.toggle('no-anim', !!noAnim);
    this.renderToolbar(weekStr);
    this.renderStats(weekStr);
    this.renderBoard(weekStr);
    this.renderTitleBlock(weekStr);
  },

  // 图签栏：只在晒图时出现
  renderTitleBlock(weekStr) {
    const p = WeekUtils.parseWeekStr(weekStr);
    const pad = n => String(n).padStart(2, '0');
    const now = new Date();
    const cells = [
      { k: '部门', v: '效果图部门', zh: 1 },
      { k: '图名', v: p ? `${p.year}年第${p.week}周 任务进度表` : '任务进度表', zh: 1, grow: 1 },
      { k: '周期', v: WeekUtils.formatDimRange(weekStr) },
      { k: '图号', v: 'WTP-' + weekStr },
      { k: '签发', v: `${now.getFullYear()}.${pad(now.getMonth() + 1)}.${pad(now.getDate())}` },
      { k: '比例', v: 'NTS' },
      { k: '版次', v: 'R1' },
      { k: '制图', v: C.MEMBERS.join(' · '), zh: 1 },
    ];
    document.getElementById('title-block').innerHTML = cells.map(c =>
      `<div class="tb-cell${c.grow ? ' grow' : ''}"><span class="anno">${c.k}</span>` +
      `<span class="tb-val${c.zh ? ' zh' : ''}">${esc(c.v)}</span></div>`).join('');
  },

  renderToolbar(weekStr) {
    const p = WeekUtils.parseWeekStr(weekStr);
    const label = p ? `${p.year}年第${p.week}周` : esc(weekStr);
    const flag = WeekUtils.isCurrentWeek(weekStr) ? '<em class="wk-flag">本周</em>' : '';
    document.getElementById('week-label').innerHTML =
      `<span class="wk-main">${label}${flag}</span><span class="date-range">${WeekUtils.formatDimRange(weekStr)}</span>`;
  },

  renderStats(weekStr) {
    const filtered = FilterState.apply(DataModel.getTasks(weekStr));
    const total = filtered.length;
    const done = filtered.filter(t => t.status === '已完成').length;
    const rate = total > 0 ? Math.round(done / total * 100) : 0;
    const lvl = rate >= 80 ? 'is-good' : rate >= 50 ? 'is-warn' : 'is-bad';

    let html = `<div class="stat-cell"><span class="anno">任务总数</span><span class="stat-value">${total}</span></div>`;
    html += `<div class="stat-cell"><span class="anno">已完成</span><span class="stat-value">${done}<em>/${total}</em></span></div>`;
    html += `<div class="stat-cell wide"><span class="anno">完成率</span><span class="stat-value ${lvl}">${rate}<em>%</em></span><span class="rate-track ${lvl}"><i style="width:${rate}%"></i></span></div>`;

    C.MEMBERS.forEach((person, i) => {
      const tasks = FilterState.apply(DataModel.getTasksByPerson(weekStr, person));
      const personDone = tasks.filter(t => t.status === '已完成').length;
      const personRate = tasks.length > 0 ? Math.round(personDone / tasks.length * 100) : 0;
      html += `<div class="stat-person">
        <div class="sp-top"><span class="stat-dot ${C.DOT_CLASSES[i]}"></span><span class="sp-name">${esc(person)}</span><span class="sp-num"><b>${personDone}</b>/${tasks.length}</span></div>
        <div class="sp-bar"><i style="width:${personRate}%"></i></div>
      </div>`;
    });

    html += `<div class="stat-legend"><span class="lg-not">未开始</span><span class="lg-prog">进行中</span><span class="lg-done">已完成</span></div>`;
    document.getElementById('stats-bar').innerHTML = html;
  },

  renderBoard(weekStr) {
    const board = document.getElementById('board');
    let html = '';
    C.MEMBERS.forEach(person => {
      const tasks = FilterState.apply(DataModel.getTasksByPerson(weekStr, person));
      html += this._renderColumn(person, tasks);
    });
    board.innerHTML = html;
  },

  _renderColumn(person, tasks) {
    const idx = C.MEMBERS.indexOf(person);
    const done = tasks.filter(t => t.status === '已完成').length;
    const rate = tasks.length > 0 ? Math.round(done / tasks.length * 100) : 0;

    let html = `<div class="column" id="column-${idx}">`;
    html += `<div class="column-header">
      <div class="ph-left">
        <span class="sht">SHT ${String(idx + 1).padStart(2, '0')}</span>
        <span class="person-name"><span class="dot ${C.DOT_CLASSES[idx]}"></span>${esc(person)}</span>
      </div>
      <div class="ph-right">
        <span class="task-count">${tasks.length}<i>项</i></span>
        <span class="ph-sub">完成 <b>${done}</b> · ${rate}%</span>
      </div>
    </div>`;

    html += `<div class="column-body${tasks.length === 0 ? ' empty' : ''}" id="col-body-${idx}">`;
    tasks.forEach((task, n) => { html += this._renderCard(task, n); });
    html += `</div>`;

    html += `<div class="column-footer">
      <button class="btn-add-person" data-person="${esc(person)}">+ 添加任务</button>
    </div>`;
    html += `</div>`;
    return html;
  },

  _renderCard(task, order) {
    const pcls = C.PRIO_CLASSES[task.priority] || '';
    const name = task.name ? esc(task.name) : '<span class="placeholder">点击输入任务名称</span>';
    const notes = task.notes ? esc(task.notes) : '<span class="placeholder">备注 / NOTES</span>';

    return `
    <div class="task-card" data-task-id="${esc(task.id)}" data-status="${esc(task.status)}" style="animation-delay:${Math.min(order, 12) * 26}ms">
      <div class="card-row">
        <span class="prio-badge ${pcls} editable" data-field="priority" data-code="${C.PRIO_CODES[task.priority] || ''}" title="优先级">${esc(task.priority)}</span>
        <span class="spacer"></span>
        <span class="status-badge editable" data-field="status" data-status="${esc(task.status)}">${esc(task.status)}</span>
        <button class="card-del" data-task-id="${esc(task.id)}" title="删除">×</button>
      </div>
      <div class="card-row">
        <span class="task-name editable" data-field="name">${name}</span>
      </div>
      <div class="card-row">
        ${this._renderProgressBar(task.progress)}
      </div>
      <div class="card-row">
        <span class="task-dates">
          <span class="date-range editable" data-field="startDate" title="开始日期">${this._formatSingleDate(task.startDate)}</span>
          <em>—</em>
          <span class="date-range editable" data-field="dueDate" title="结束日期">${this._formatSingleDate(task.dueDate)}</span>
        </span>
      </div>
      <div class="card-row">
        <span class="notes editable" data-field="notes">${notes}</span>
      </div>
    </div>`;
  },

  _progressLevel(pct) {
    if (pct <= 0) return 'none';
    if (pct <= 30) return 'low';
    if (pct >= 70) return 'high';
    return 'mid';
  },

  _renderProgressBar(pct) {
    const level = this._progressLevel(pct);
    return `<div class="dim editable" data-field="progress" data-level="${level}" title="拖动调整进度，当前 ${pct}%">
      <span class="dim-line">
        <span class="dim-tick"></span>
        <span class="dim-track"><i class="dim-fill" style="width:${pct}%"></i><b class="dim-thumb" style="left:${pct}%"></b></span>
        <span class="dim-tick"></span>
      </span>
      <span class="dim-val">${pct}<i>%</i></span>
    </div>`;
  },

  _formatSingleDate(dateStr) {
    if (!dateStr) return '<span class="placeholder">·····</span>';
    const d = new Date(dateStr + 'T00:00:00');
    if (isNaN(d.getTime())) return esc(dateStr);
    const p = n => String(n).padStart(2, '0');
    return p(d.getMonth() + 1) + '.' + p(d.getDate());
  },

  // DOM patch a single card element
  patchCard(card) {
    const taskId = card.dataset.taskId;
    const task = DataModel.state.tasks.find(t => t.id === taskId);
    if (!task) return;

    card.dataset.status = task.status;

    const nameEl = card.querySelector('[data-field="name"]');
    if (nameEl) nameEl.innerHTML = task.name ? esc(task.name) : '<span class="placeholder">点击输入任务名称</span>';

    const prioEl = card.querySelector('[data-field="priority"]');
    if (prioEl) {
      prioEl.textContent = task.priority;
      prioEl.className = `prio-badge ${C.PRIO_CLASSES[task.priority] || ''} editable`;
      prioEl.dataset.code = C.PRIO_CODES[task.priority] || '';
      prioEl.dataset.field = 'priority';
    }

    const progEl = card.querySelector('[data-field="progress"]');
    if (progEl) progEl.outerHTML = this._renderProgressBar(task.progress);

    const statusEl = card.querySelector('[data-field="status"]');
    if (statusEl) {
      statusEl.textContent = task.status;
      statusEl.className = 'status-badge editable';
      statusEl.dataset.status = task.status;
      statusEl.dataset.field = 'status';
    }

    const startDateEl = card.querySelector('[data-field="startDate"]');
    if (startDateEl) startDateEl.innerHTML = this._formatSingleDate(task.startDate);
    const dueDateEl = card.querySelector('[data-field="dueDate"]');
    if (dueDateEl) dueDateEl.innerHTML = this._formatSingleDate(task.dueDate);

    const notesEl = card.querySelector('[data-field="notes"]');
    if (notesEl) notesEl.innerHTML = task.notes ? esc(task.notes) : '<span class="placeholder">备注 / NOTES</span>';
  },
};

// ======================================================================
// Editor — Card inline editing
// ======================================================================
const Editor = {
  currentCard: null,
  currentField: null,

  startEdit(el, card) {
    if (this.currentField) this.cancelEdit(false);
    this.currentCard = card;
    this.currentField = el;
    el.classList.add('editing');

    const taskId = card.dataset.taskId;
    const task = DataModel.state.tasks.find(t => t.id === taskId);
    if (!task) return;

    const field = el.dataset.field;
    const raw = task[field];

    if (field === 'priority') {
      const sel = this._makeSelect(C.PRIORITIES, raw);
      el.innerHTML = '';
      el.appendChild(sel);
      sel.focus();
      this._bindSelectEvents(sel, el, card);
      return;
    }

    if (field === 'status') {
      const sel = this._makeSelect(C.STATUSES, raw);
      el.innerHTML = '';
      el.appendChild(sel);
      sel.focus();
      this._bindSelectEvents(sel, el, card);
      return;
    }

    if (field === 'startDate' || field === 'dueDate') {
      const input = document.createElement('input');
      input.type = 'date';
      if (raw) input.value = raw;
      el.innerHTML = '';
      el.appendChild(input);
      this._bindInputEvents(input, el, card);
      input.focus();
      return;
    }

    // text field (name, notes)
    const input = document.createElement('input');
    input.type = 'text';
    input.value = raw || '';
    el.innerHTML = '';
    el.appendChild(input);
    this._bindInputEvents(input, el, card);
    input.focus();
    input.select();
  },

  _makeSelect(options, current) {
    const sel = document.createElement('select');
    options.forEach(o => {
      const opt = document.createElement('option');
      opt.value = o; opt.textContent = o;
      if (o === current) opt.selected = true;
      sel.appendChild(opt);
    });
    return sel;
  },

  _bindSelectEvents(sel, el, card) {
    sel.addEventListener('change', () => {
      this._commit(card, el, sel.value);
    });
    sel.addEventListener('blur', () => {
      setTimeout(() => {
        if (this.currentField === el) this._commit(card, el, sel.value);
      }, 100);
    });
    sel.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { e.preventDefault(); this.cancelEdit(); }
    });
  },

  _bindInputEvents(input, el, card) {
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        this._commit(card, el, input.value);
      } else if (e.key === 'Escape') {
        e.preventDefault();
        this.cancelEdit();
      }
    });
    input.addEventListener('blur', () => {
      setTimeout(() => {
        if (this.currentField === el) this._commit(card, el, input.value);
      }, 100);
    });
  },

  _commit(card, el, value) {
    if (this.currentField !== el) return;
    this.currentField = null;
    el.classList.remove('editing');

    const taskId = card.dataset.taskId;
    const field = el.dataset.field;
    const task = DataModel.state.tasks.find(t => t.id === taskId);
    if (!task) return;

    let parsed = value;
    if (field === 'progress') {
      parsed = parseInt(value, 10);
      if (isNaN(parsed)) parsed = 0;
      parsed = Math.max(0, Math.min(100, parsed));
    }

    if (parsed === task[field]) {
      Renderer.patchCard(card);
      return;
    }

    DataModel.updateField(taskId, field, parsed);

    // Re-fetch and patch
    const updated = DataModel.state.tasks.find(t => t.id === taskId);
    if (updated) {
      Renderer.patchCard(card);
      // Refresh column header count
      this._refreshColumnCount();
    }
  },

  // 尺寸标注线拖动：以 pointerdown 落点为基准做相对位移，
  // 保持手机端可微调（不跳变到触摸位置）。
  beginDrag(el, card, e) {
    if (this.currentField && this.currentField !== el) this.cancelEdit(false);
    const track = el.querySelector('.dim-track');
    const task = DataModel.state.tasks.find(t => t.id === card.dataset.taskId);
    if (!track || !task) return;

    this.currentCard = card;
    this.currentField = el;
    el.classList.add('editing', 'dragging');

    const startX = e.clientX;
    const startVal = task.progress;
    const span = Math.max(track.getBoundingClientRect().width, 24);
    let live = startVal;

    const onMove = (ev) => {
      ev.preventDefault();
      const next = Math.max(0, Math.min(100, Math.round(startVal + ((ev.clientX - startX) / span) * 100)));
      if (next !== live) {
        live = next;
        this._updateProgressBar(el, next);
      }
    };

    const stop = (ev) => {
      el.removeEventListener('pointermove', onMove);
      el.removeEventListener('pointerup', onUp);
      el.removeEventListener('pointercancel', onUp);
      if (el.hasPointerCapture && el.hasPointerCapture(ev.pointerId)) el.releasePointerCapture(ev.pointerId);
      el.classList.remove('editing', 'dragging');
      el._dragCleanup = null;
    };

    const onUp = (ev) => {
      stop(ev);
      this._commit(card, el, live);
    };

    // 指针已失效时 setPointerCapture 会抛错，不能让它中断监听绑定
    try { el.setPointerCapture(e.pointerId); } catch (err) {}
    el.addEventListener('pointermove', onMove);
    el.addEventListener('pointerup', onUp);
    el.addEventListener('pointercancel', onUp);

    el._dragCleanup = () => stop(e);
  },

  _updateProgressBar(el, pct) {
    const fill = el.querySelector('.dim-fill');
    const thumb = el.querySelector('.dim-thumb');
    const val = el.querySelector('.dim-val');
    if (fill) fill.style.width = pct + '%';
    if (thumb) thumb.style.left = pct + '%';
    if (val) val.innerHTML = pct + '<i>%</i>';
    el.dataset.level = Renderer._progressLevel(pct);
    el.title = `拖动调整进度，当前 ${pct}%`;
  },

  cancelEdit(restore = true) {
    if (!this.currentField) return;
    const el = this.currentField;
    const card = this.currentCard;
    // Clean up drag listeners if this was a progress bar
    if (el._dragCleanup) {
      el._dragCleanup();
      el._dragCleanup = null;
    }
    this.currentField = null;
    this.currentCard = null;
    this._dragTaskId = null;
    el.classList.remove('editing');
    if (restore && card) {
      Renderer.patchCard(card);
    }
  },

  _refreshColumnCount() {
    const weekStr = DataModel.state.currentWeek;
    C.MEMBERS.forEach((person, i) => {
      const tasks = FilterState.apply(DataModel.getTasksByPerson(weekStr, person));
      const done = tasks.filter(t => t.status === '已完成').length;
      const rate = tasks.length > 0 ? Math.round(done / tasks.length * 100) : 0;
      const header = document.querySelector(`#column-${i} .column-header`);
      if (header) {
        const countEl = header.querySelector('.task-count');
        if (countEl) countEl.innerHTML = `${tasks.length}<i>项</i>`;
        const subEl = header.querySelector('.ph-sub');
        if (subEl) subEl.innerHTML = `完成 <b>${done}</b> · ${rate}%`;
      }
      const body = document.getElementById(`col-body-${i}`);
      if (body) body.classList.toggle('empty', tasks.length === 0);
    });
    Renderer.renderStats(weekStr);
  },
};

// ======================================================================
// Actions
// ======================================================================
const Actions = {
  previousWeek() {
    DataModel.state.currentWeek = WeekUtils.addWeeks(DataModel.state.currentWeek, -1);
    Storage.save(DataModel.state);
    Renderer.renderAll(DataModel.state.currentWeek);
  },

  nextWeek() {
    DataModel.state.currentWeek = WeekUtils.addWeeks(DataModel.state.currentWeek, 1);
    Storage.save(DataModel.state);
    Renderer.renderAll(DataModel.state.currentWeek);
  },

  goToToday() {
    const now = WeekUtils.getISOWeek(new Date());
    DataModel.state.currentWeek = WeekUtils.formatWeekStr(now.year, now.week);
    Storage.save(DataModel.state);
    Renderer.renderAll(DataModel.state.currentWeek);
  },

  addTask(person) {
    UndoStack.push('新增任务');
    const task = DataModel.addTask(DataModel.state.currentWeek, person);
    Renderer.renderAll(DataModel.state.currentWeek);
    // Start editing the new card's name field
    setTimeout(() => {
      const card = document.querySelector(`.task-card[data-task-id="${task.id}"]`);
      if (card) {
        const nameEl = card.querySelector('[data-field="name"]');
        if (nameEl) Editor.startEdit(nameEl, card);
      }
    }, 100);
  },

  deleteTask(taskId) {
    const idx = DataModel.state.tasks.findIndex(t => t.id === taskId);
    if (idx === -1) return;
    UndoStack.push('删除任务');
    const deleted = DataModel.state.tasks.splice(idx, 1)[0];
    DataModel._save();
    Renderer.renderAll(DataModel.state.currentWeek);
    // Toast 上的撤销只把这一条放回去；走 UndoStack.undo 会连带吞掉删除之后的编辑
    Toast.showUndo(`已删除「${deleted.name || '未命名任务'}」`, () => this.undelete(deleted, idx), 8000);
  },

  undelete(task, idx) {
    if (DataModel.state.tasks.some(t => t.id === task.id)) return;
    DataModel.state.tasks.splice(Math.min(idx, DataModel.state.tasks.length), 0, task);
    DataModel._save();
    Renderer.renderAll(DataModel.state.currentWeek, true);
    Toast.show(`已恢复「${task.name || '未命名任务'}」`);
  },

  copyFromPrev() {
    UndoStack.push('复制上周未完成');
    const { copies, skipped } = DataModel.copyIncompleteFromPrev(DataModel.state.currentWeek);
    if (copies.length === 0) {
      UndoStack.discard();
      Toast.show(skipped > 0 ? `上周未完成任务本周已存在` : '上周没有未完成的任务');
      return;
    }
    Renderer.renderAll(DataModel.state.currentWeek);
    const ids = copies.map(c => c.id);
    Toast.showUndo(`已复制 ${copies.length} 个未完成任务`, () => this.uncopy(ids), 8000);
  },

  uncopy(ids) {
    const set = new Set(ids);
    DataModel.state.tasks = DataModel.state.tasks.filter(t => !set.has(t.id));
    DataModel._save();
    Renderer.renderAll(DataModel.state.currentWeek, true);
    Toast.show('已撤销复制');
  },
};

// ======================================================================
// UndoStack — 多级撤销（任务数组快照制）
// ======================================================================
const UndoStack = {
  items: [],
  limit: 20,

  push(label) {
    if (!DataModel.state) return;
    this.items.push({ label, tasks: JSON.parse(JSON.stringify(DataModel.state.tasks)) });
    if (this.items.length > this.limit) this.items.shift();
  },

  undo() {
    const it = this.items.pop();
    if (!it) { Toast.show('没有可撤销的操作'); return false; }
    DataModel.state.tasks = it.tasks;
    DataModel._save();
    Renderer.renderAll(DataModel.state.currentWeek, true);
    Toast.show(`已撤销：${it.label}`);
    return true;
  },

  // 动作最后发现什么都没改时，丢掉预先入栈的快照
  discard() { this.items.pop(); },
};

// ======================================================================
// CardDrag — 拖拽排序与跨列改派（Pointer Events）
// ======================================================================
const CardDrag = {
  pending: null,
  session: null,
  _suppressClick: false,

  // 由 #board 的 pointerdown 调用；尺寸线与删除按钮不归它管
  arm(e, card) {
    if (this.session || this.pending || Editor.currentField) return;
    const s = {
      card,
      sx: e.clientX,
      sy: e.clientY,
      armed: e.pointerType !== 'touch',
      timer: 0,
    };
    // 触屏先长按 200ms 再认拖；在此之前移动都当作页面滚动
    if (!s.armed) s.timer = setTimeout(() => { s.armed = true; }, 200);
    s.onMove = ev => this._move(s, ev);
    s.onEnd = () => this._end(s);
    window.addEventListener('pointermove', s.onMove);
    window.addEventListener('pointerup', s.onEnd);
    window.addEventListener('pointercancel', s.onEnd);
    // pointermove 对触摸手势不可取消：长按生效后必须用 touchmove 掐掉页面滚动
    if (!s.armed) {
      s.onTouchMove = ev => { if (s.armed) ev.preventDefault(); };
      window.addEventListener('touchmove', s.onTouchMove, { passive: false });
    }
    this.pending = s;
  },

  _move(s, ev) {
    const d = Math.abs(ev.clientX - s.sx) + Math.abs(ev.clientY - s.sy);
    if (!s.armed) {
      if (d > 12) this._end(s);
      return;
    }
    if (!this.session) {
      if (d < 6) return;
      this._engage(s);
    }
    ev.preventDefault();
    this._place(ev.clientX, ev.clientY);
  },

  _engage(s) {
    clearTimeout(s.timer);
    this.session = s;
    UndoStack.push('拖拽排序');
    s.card.classList.add('dragging');
    document.getElementById('board').classList.add('drag-active');
  },

  _place(x, y) {
    const el = document.elementFromPoint(x, y);
    const col = el && el.closest ? el.closest('.column') : null;
    const body = col && col.querySelector('.column-body');
    if (!body) return;
    const dragged = this.session.card;
    body.classList.remove('empty');
    let ref = null;
    body.querySelectorAll('.task-card').forEach(c => {
      if (ref || c === dragged) return;
      const r = c.getBoundingClientRect();
      if (y < r.top + r.height / 2) ref = c;
    });
    if (ref) body.insertBefore(dragged, ref);
    else body.appendChild(dragged);
  },

  _end(s) {
    window.removeEventListener('pointermove', s.onMove);
    window.removeEventListener('pointerup', s.onEnd);
    window.removeEventListener('pointercancel', s.onEnd);
    if (s.onTouchMove) window.removeEventListener('touchmove', s.onTouchMove);
    clearTimeout(s.timer);
    if (this.session) this._commit();
    if (this.pending === s) this.pending = null;
    this.session = null;
  },

  _commit() {
    const board = document.getElementById('board');
    this.session.card.classList.remove('dragging');
    board.classList.remove('drag-active');
    this._suppressClick = true;

    const slots = [];
    board.querySelectorAll('.column').forEach(col => {
      const person = C.MEMBERS[Number(col.id.split('-')[1])];
      col.querySelectorAll('.column-body > .task-card').forEach(c =>
        slots.push({ id: c.dataset.taskId, person }));
    });

    let moved = 0, reassigned = 0;
    slots.forEach((slot, i) => {
      const t = DataModel.state.tasks.find(x => x.id === slot.id);
      if (!t) return;
      let hit = false;
      if (t.order !== i) { t.order = i; hit = true; }
      if (t.person !== slot.person) { t.person = slot.person; hit = true; reassigned++; }
      if (hit) { t.updatedAt = new Date().toISOString(); moved++; }
    });

    if (!moved) { UndoStack.discard(); return; }   // 没真的挪动，不留空快照
    DataModel._save();
    Renderer.renderAll(DataModel.state.currentWeek, true);
    Toast.show(reassigned ? `已改派 ${reassigned} 个任务` : '已调整顺序');
  },

  // 拖完会紧跟一个 click，吞掉它以免误开编辑
  consumeClick() {
    if (!this._suppressClick) return false;
    this._suppressClick = false;
    return true;
  },
};

// ======================================================================
// App — Entry point
// ======================================================================
const App = {
  async init() {
    this.initTheme();
    // Load local first for instant render
    const state = Storage.load();
    // 周次属于视图状态而非数据：每次打开页面都落在本周，不沿用上次浏览位置
    state.currentWeek = Storage.getDefault().currentWeek;
    DataModel.init(state);
    this.bindToolbar();
    this.bindBoardDelegation();
    this.bindSettings();
    this.bindGlobalKeys();
    this.bindSaveBtn();
    this.bindTheme();
    Renderer.renderAll(DataModel.state.currentWeek);

    // Then attempt remote sync (always configured with defaults)
    SyncStatus.showConfigured();
    const merged = await Storage.loadAsync(state);
    if (merged !== state) {
      DataModel.init(merged);
      Renderer.renderAll(DataModel.state.currentWeek);
    }
  },

  initTheme() {
    let saved = null;
    try { saved = localStorage.getItem(C.THEME_KEY); } catch (e) {}
    if (!saved) {
      saved = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
        ? 'blueprint' : 'paper';
    }
    this._applyTheme(saved);
  },

  _applyTheme(mode) {
    if (mode === 'blueprint') document.body.dataset.theme = 'blueprint';
    else delete document.body.dataset.theme;
  },

  bindTheme() {
    document.getElementById('btn-theme').addEventListener('click', () => {
      const next = document.body.dataset.theme === 'blueprint' ? 'paper' : 'blueprint';
      this._applyTheme(next);
      try { localStorage.setItem(C.THEME_KEY, next); } catch (e) {}
      Toast.show(next === 'blueprint' ? '蓝图夜览' : '图纸日览');
    });
  },

  bindToolbar() {
    document.getElementById('btn-prev-week').addEventListener('click', () => Actions.previousWeek());
    document.getElementById('btn-next-week').addEventListener('click', () => Actions.nextWeek());
    document.getElementById('btn-today').addEventListener('click', () => Actions.goToToday());
    document.getElementById('btn-copy-prev').addEventListener('click', () => Actions.copyFromPrev());
    document.getElementById('btn-print').addEventListener('click', () => window.print());

    // Search
    const searchInput = document.getElementById('search-input');
    let searchTimer;
    searchInput.addEventListener('input', () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        FilterState.search = searchInput.value.trim();
        Renderer.renderAll(DataModel.state.currentWeek);
      }, 200);
    });

    // Status filters
    document.getElementById('status-filters').addEventListener('click', (e) => {
      const btn = e.target.closest('.filter-btn');
      if (!btn) return;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      FilterState.statusFilter = btn.dataset.filter;
      Renderer.renderAll(DataModel.state.currentWeek);
    });
  },

  bindBoardDelegation() {
    const board = document.getElementById('board');

    board.addEventListener('click', (e) => {
      if (CardDrag.consumeClick()) return;

      const add = e.target.closest('.btn-add-person');
      if (add) { Actions.addTask(add.dataset.person); return; }

      const del = e.target.closest('.card-del');
      if (del) { Actions.deleteTask(del.dataset.taskId); return; }

      const el = e.target.closest('.editable');
      // 尺寸线由 pointerdown 接管，不参与 click 编辑
      if (!el || el.dataset.field === 'progress') return;
      if (el.classList.contains('editing')) return;
      Editor.startEdit(el, el.closest('.task-card'));
    });

    // 按住尺寸线即可拖动，无需先点击激活
    board.addEventListener('pointerdown', (e) => {
      if (e.button > 0) return;
      const dim = e.target.closest('.dim');
      if (dim) {
        e.preventDefault();
        Editor.beginDrag(dim, dim.closest('.task-card'), e);
        return;
      }
      if (e.target.closest('.card-del')) return;
      const card = e.target.closest('.task-card');
      if (card) CardDrag.arm(e, card);
    });
  },

  bindSettings() {
    const overlay = document.getElementById('settings-overlay');
    const gistInput = document.getElementById('cfg-gist-id');
    const tokenInput = document.getElementById('cfg-token');

    // Open settings
    document.getElementById('btn-settings').addEventListener('click', () => {
      const cfg = GistSync.loadConfig();
      gistInput.value = cfg.gistId || gistInput.value || '';
      tokenInput.value = cfg.token || '';
      overlay.classList.add('show');
    });

    // Close
    document.getElementById('btn-cancel-settings').addEventListener('click', () => {
      overlay.classList.remove('show');
    });
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) overlay.classList.remove('show');
    });

    // Save
    document.getElementById('btn-save-settings').addEventListener('click', async () => {
      const gistId = gistInput.value.trim();
      const token = tokenInput.value.trim();
      if (!gistId || !token) { Toast.show('请输入 Gist ID 和 Token'); return; }
      GistSync.saveConfig({ gistId, token });
      overlay.classList.remove('show');
      SyncStatus.showConfigured();
      SyncStatus.syncing();
      // Push current state and re-sync
      const ok = await GistSync.push(DataModel.state);
      if (ok) {
        SyncStatus.configured();
        Toast.show('同步配置成功');
      } else {
        SyncStatus.error('上传失败，请检查 Gist ID 和 Token');
      }
    });

    // Disconnect (clear custom overrides, fall back to defaults)
    document.getElementById('btn-disconnect').addEventListener('click', () => {
      if (confirm('确定清除自定义配置？将恢复使用默认同步设置。')) {
        GistSync.saveConfig({ gistId: '', token: '' });
        overlay.classList.remove('show');
        SyncStatus.showConfigured();
        SyncStatus.configured();
        Toast.show('已恢复默认同步设置');
        location.reload();
      }
    });
  },

  bindGlobalKeys() {
    document.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'n') {
        e.preventDefault();
        Actions.addTask(C.MEMBERS[0]);
      }
      if (e.key === 'Escape') {
        if (Editor.currentField) {
          Editor.cancelEdit();
        } else {
          document.getElementById('settings-overlay').classList.remove('show');
        }
      }
      // Ctrl/Cmd+Z：多级撤销（输入框里留给浏览器原生的文本撤销）
      if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === 'z') {
        const a = document.activeElement;
        if (a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.isContentEditable)) return;
        e.preventDefault();
        UndoStack.undo();
      }
      // Ctrl+S: manual save
      if ((e.ctrlKey || e.metaKey) && e.key === 's') {
        e.preventDefault();
        GistSync.saveNow(DataModel.state);
      }
    });
  },

  bindSaveBtn() {
    document.getElementById('btn-save').addEventListener('click', () => {
      GistSync.saveNow(DataModel.state);
    });
  },
};

// Boot
document.addEventListener('DOMContentLoaded', () => App.init());
</script>
