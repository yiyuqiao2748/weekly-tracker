    const idx = C.MEMBERS.indexOf(person);
    const suffix = o.idSuffix || '';
    // 跨页续排的续页上只有半截卡，列头那串「n 项 / 完成 x · y%」要按整周算 ——
    // 两张纸上写同一组数字，读者才知道这是同一张图的两页，不是两张图。
    const n = o.totals ? o.totals.n : tasks.length;
    const done = o.totals ? o.totals.done : tasks.filter(t => t.status === '已完成').length;
    const rate = n > 0 ? Math.round(done / n * 100) : 0;

    let html = `<div class="column" id="column-${idx}${suffix}">`;
    html += `<div class="column-header">
      <div class="ph-left">
        <span class="sht">${esc(o.divLabel || 'SHT ' + String(idx + 1).padStart(2, '0'))}</span>
        <span class="person-name"><span class="dot ${C.DOT_CLASSES[idx]}"></span>${esc(person)}</span>
      </div>
      <div class="ph-right">
        <span class="task-count">${n}<i>项</i></span>
        <span class="ph-sub">完成 <b>${done}</b> · ${rate}%</span>
        ${this._sparkline(load.weeks, load.grid[idx])}
      </div>
    </div>`;

    html += `<div class="column-body${tasks.length === 0 ? ' empty' : ''}" id="col-body-${idx}${suffix}">`;
    tasks.forEach((task, n) => { html += this._renderCard(task, n, marks); });
    html += `</div>`;

    html += `<div class="column-footer">
      <button class="btn-add-person" data-person="${esc(person)}">+ 添加任务</button>
    </div>`;
    html += `</div>`;
    return html;
  },

  _renderCard(task, order, marks) {
    const pcls = C.PRIO_CLASSES[task.priority] || '';
    const name = task.name ? esc(task.name) : '<span class="placeholder">点击输入任务名称</span>';
    const notes = task.notes ? esc(task.notes) : '<span class="placeholder">备注 / NOTES</span>';
    const hist = task.history || [];
    // 两张跨周徽标的读数一律由调用方算好递进来（_weekMarks / taskMarks），
    // 卡片自己不查全局：整板渲染与出图铺纸因此走的是同一条判断。
    const key = DataModel.weekKey(task);
    const delta = (marks && marks.delta && marks.delta.get(key)) || '';
    const streak = (marks && marks.streak && marks.streak.get(key)) || 0;
    const earlier = (marks && marks.broken && marks.broken.get(key)) || 0;
    const cls = 'task-card'
      + (delta === 'new' ? ' is-new' : '')
      + (this.openRevs.has(task.id) ? ' rev-open' : '');

    return `
    <div class="${cls}" data-task-id="${esc(task.id)}" data-status="${esc(task.status)}" style="animation-delay:${Math.min(order, 12) * 26}ms">
      <div class="card-row">
        <span class="prio-badge ${pcls} editable" data-field="priority" data-code="${C.PRIO_CODES[task.priority] || ''}" title="优先级">${esc(task.priority)}</span>
        <span class="spacer"></span>
        <span class="status-badge editable" data-field="status" data-status="${esc(task.status)}">${esc(task.status)}</span>
        <button class="card-del" data-task-id="${esc(task.id)}" title="删除">×</button>
      </div>
      <div class="card-row">
        <span class="task-name editable" data-field="name">${name}</span>
      </div>
      <div class="card-row">
        ${this._renderProgressBar(task.progress)}
      </div>
      <div class="card-row">
        <!-- 中间那枚破折号是尺寸线连接符，纯装饰：aria-hidden 让读屏别念出「dash」 -->
        <span class="task-dates">
          <span class="date-range editable" data-field="startDate" title="开始日期">${this._formatSingleDate(task.startDate)}</span>
          <em aria-hidden="true">—</em>
          <span class="date-range editable" data-field="dueDate" title="结束日期">${this._formatSingleDate(task.dueDate)}</span>
        </span>
        <span class="rev-slot">${this._revChips({ hist: hist.length, delta, streak, earlier, status: task.status })}</span>
      </div>
      <div class="card-row">
        <span class="notes editable" data-field="notes">${notes}</span>
      </div>
      ${this._revTable(hist)}
    </div>`;
  },

  // 卡右上角那一槽的三枚徽标：在册第几周 / 新增 / REV。
  // 收成一个入参对象是有原因的：全量渲染与 patchCard 各要填一次，四个位置参数
  // 传错顺序不会报错、只会少画一枚徽标（`_tocMatrix` 那个 isSum 就是这么被抓出来的）。
  //   第 N 周 —— streak > 1 才印，第 1 周就是「上一周没有」，那件事虚线云线 + `新增` 已经说了；
  //             已完成的也不再印：这张表跟踪的是还欠着的，纸上要一眼看出谁挂了四周。
  //   断后第 N 周 —— 第十轮：earlier > 0 时在前面加两个字。断过之后重开的「第 2 周」
  //             与一直连着的「第 2 周」原来在纸上是同一句话（fixture 里 TB 那五周就是
  //             「不印 → 第 2 周 →（断一周）→ 新增 → 第 2 周」），而这一格要说的是
  //             **这一段之前它还排过**，不是这一段有多长 —— 所以只在前面加记号、
  //             不把周数改成「第 2/4 周」那种带分母的写法（那会被读成「一个四周的活」，
  //             而真相是「断过、重开到第 2 周」）。代价先量过：行高钉在 15px 一动不动，
  //             横向 +19.1px 吃的是槽与日期之间那一段留白（三例里最紧的一枚还剩
  //             127.4px），43 枚徽标逐一对上：**折行 0 张、行内溢出增量 0px**
  //             （`.preview/probe_r10_broken.py`，槽是右对齐的，加宽只往左吃留白）。
  //   新增 / REV —— 口径与改动前一字不动（决策待定：纸上到底印不印这两枚，见「还欠着的」）。
  _revChips(o) {
    const n = o.hist || 0;
    const e = o.earlier || 0;
    let h = '';
    if (o.streak > 1 && o.status !== '已完成') {
      h += `<span class="chip ten${o.streak >= 4 ? ' long' : ''}"`
        + ` title="同一人同名连续在册 ${o.streak} 周（含本周）`
        + (e ? `；这一段之前它还断续排过 ${e} 周，这一轮是断过之后重开的` : '')
        + `">${e ? '断后' : ''}第 ${o.streak} 周</span>`;
    }
    if (o.delta === 'new') h += '<span class="chip new" title="上一周没有这条任务">新增</span>';
    if (n || o.delta === 'rev') {
      h += `<button type="button" class="chip rev" title="修订记录 ${n} 条">${n ? 'REV ' + n : 'REV'}</button>`;
    }
    return h;
  },

  // 图纸修订栏的样子：细线分栏 + 等宽数字，默认折叠
  _revTable(hist) {
    const rows = hist.length ? hist.map((r, i) => `<tr>
        <td class="rv-no">${i + 1}</td>
        <td>${this._revTime(r.at)}</td>
        <td class="rv-what">${esc(C.FIELD_CN[r.field] || r.field)} ${this._revVal(r.field, r.from)}<span class="arrow">→</span>${this._revVal(r.field, r.to)}</td>
      </tr>`).join('')
      : '<tr><td class="rv-no">—</td><td colspan="2" class="rv-what">跨周变更，本周内暂无编辑</td></tr>';
    return `<table class="rev-table"><thead><tr><th>版次</th><th>时间</th><th>修改</th></tr></thead><tbody>${rows}</tbody></table>`;
  },

  _revVal(field, v) {
    if (v === '' || v == null) return '—';
    if (field === 'progress') return esc(v + '%');
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(v));
    if (m && (field === 'startDate' || field === 'dueDate')) return esc(m[2] + '.' + m[3]);
    return esc(v);
  },

  _revTime(iso) {
    const d = new Date(iso);
    if (isNaN(d.getTime())) return '—';
    const p = n => String(n).padStart(2, '0');
    return `${p(d.getMonth() + 1)}.${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
  },

  _progressLevel(pct) {
    if (pct <= 0) return 'none';
    if (pct <= 30) return 'low';
    if (pct >= 70) return 'high';
    return 'mid';
  },

  _renderProgressBar(pct) {
    const level = this._progressLevel(pct);
    return `<div class="dim editable" data-field="progress" data-level="${level}" title="拖动调整进度，当前 ${pct}%">
      <span class="dim-line">
        <span class="dim-tick"></span>
        <span class="dim-track"><i class="dim-fill" style="width:${pct}%"></i><b class="dim-thumb" style="left:${pct}%"></b></span>
        <span class="dim-tick"></span>
      </span>
      <span class="dim-val">${pct}<i>%</i></span>
    </div>`;
  },

  _formatSingleDate(dateStr) {
    if (!dateStr) return '<span class="placeholder">·····</span>';
    const d = new Date(dateStr + 'T00:00:00');
    if (isNaN(d.getTime())) return esc(dateStr);
    const p = n => String(n).padStart(2, '0');
    return p(d.getMonth() + 1) + '.' + p(d.getDate());
  },

  // DOM patch a single card element
  patchCard(card) {
    const taskId = card.dataset.taskId;
    const task = DataModel.state.tasks.find(t => t.id === taskId);
    if (!task) return;

    card.dataset.status = task.status;

    const nameEl = card.querySelector('[data-field="name"]');
    if (nameEl) nameEl.innerHTML = task.name ? esc(task.name) : '<span class="placeholder">点击输入任务名称</span>';

    const prioEl = card.querySelector('[data-field="priority"]');
    if (prioEl) {
      prioEl.textContent = task.priority;
      prioEl.className = `prio-badge ${C.PRIO_CLASSES[task.priority] || ''} editable`;
      prioEl.dataset.code = C.PRIO_CODES[task.priority] || '';
      prioEl.dataset.field = 'priority';
    }

    const progEl = card.querySelector('[data-field="progress"]');
    if (progEl) progEl.outerHTML = this._renderProgressBar(task.progress);

    const statusEl = card.querySelector('[data-field="status"]');
    if (statusEl) {
      statusEl.textContent = task.status;
      statusEl.className = 'status-badge editable';
      statusEl.dataset.status = task.status;
      statusEl.dataset.field = 'status';
    }

    const startDateEl = card.querySelector('[data-field="startDate"]');
    if (startDateEl) startDateEl.innerHTML = this._formatSingleDate(task.startDate);
    const dueDateEl = card.querySelector('[data-field="dueDate"]');
    if (dueDateEl) dueDateEl.innerHTML = this._formatSingleDate(task.dueDate);

    const notesEl = card.querySelector('[data-field="notes"]');
    if (notesEl) notesEl.innerHTML = task.notes ? esc(task.notes) : '<span class="placeholder">备注 / NOTES</span>';

    // 修订徽标和修订表也要跟着这次编辑更新，否则 REV 计数会停在旧值。
    // 2026-09-23 起整槽按 taskMarks 重算：改状态、改名、换人都会改到跨周读数 ——
    // 留着一枚「第 4 周」印在刚点成「已完成」的卡上，是这块版面最容易犯也最难看的假话。
    // 原来这里是从 `card.classList` 里读旧答案（所以改完名，那圈「新增」虚线不会跟着动），
    // 现在虚线与徽标同源，两处一起翻。
    const hist = task.history || [];
    const m = DataModel.taskMarks(task);
    card.classList.toggle('is-new', m.delta === 'new');
    const slot = card.querySelector('.rev-slot');
    if (slot) slot.innerHTML = this._revChips({ hist: hist.length, delta: m.delta, streak: m.streak, earlier: m.earlier, status: task.status });
    const table = card.querySelector('.rev-table');
    if (table) table.outerHTML = this._revTable(hist);
  },
};

// ======================================================================
// SheetSet — 出图：多周连排 / 按人分册 / 图纸目录
// 一张纸 = 一个 .sheet-page，全部先铺进 #print-stack，打印时只露这个容器。
// 卡片与分栏的 markup 一律复用 Renderer 的私有渲染函数，出图与看板同源，
// 否则「屏上好看、纸上走样」会一直修不完。
// ======================================================================
const SheetSet = {
  MAX_COUNT: 8,
  // 按人成册时页数 = 周数 × 人数，给个上限免得一次打出一本书
  MAX_PAGES: 16,
  CODE: 'WTP',
  cfg: null,

  defaultCfg() {
    return { from: DataModel.state.currentWeek, count: 1, mode: 'weeks', scope: 'all', toc: true };
  },

  // 截止周的下拉：有数据的周 + 本周往前 7 周（空周也要能选，连排时它是「本周没排」的证据）
  weekOptions() {
    const set = new Set(DataModel.state.tasks.map(t => t.week));
    const now = DataModel.state.currentWeek;
    set.add(now);
    for (let i = 1; i < this.MAX_COUNT; i++) set.add(WeekUtils.addWeeks(now, -i));
    return Array.from(set)
      .filter(w => WeekUtils.parseWeekStr(w))
      .sort()
      .reverse();
  },

  // 从 from 往回数 count 周，旧→新排列：读图顺序就是进度推进方向
  weeks(cfg) {
    const list = [];
    for (let i = cfg.count - 1; i >= 0; i--) list.push(WeekUtils.addWeeks(cfg.from, -i));
    return list;
  },

  // 收录范围：全部 / 只出未完成 / 沿用看板当前筛选
  tasksFor(week, person, cfg) {
    let tasks = DataModel.getTasksByPerson(week, person);
    if (cfg.scope === 'open') tasks = tasks.filter(t => t.status !== '已完成');
    else if (cfg.scope === 'filtered') tasks = FilterState.apply(tasks);
    return tasks;
  },

  // 请求周数 → 实际周数（受 MAX_PAGES 约束）。上限之内返回 capped=false。
  clampCount(want, mode) {
    const perWeek = mode === 'persons' ? C.MEMBERS.length : 1;
    const room = Math.max(1, Math.floor((this.MAX_PAGES - 1) / perWeek));
    const n = Math.max(1, Math.min(this.MAX_COUNT, want, room));
    return { count: n, capped: n < want };
  },

  // 排纸：按周连排保留每个请求周（空周也是「本周没排」的证据）；
  // 按人成册则跳过那人那周的空页，不出一张白纸。
  plan(cfg) {
    const weeks = this.weeks(cfg);
    const sheets = [];
    if (cfg.mode === 'weeks') {
      weeks.forEach(w => sheets.push({ kind: 'week', week: w }));
    } else {
      // 按人成册：一个人先把几周排完再换下一个人 —— 装订时是一卷一卷的，
      // 目录读下来是「易榆乔 W37 → W38」而不是四个人交错。空的那人那周不出白纸。
      C.MEMBERS.forEach(p => {
        weeks.forEach(w => {
          const tasks = this.tasksFor(w, p, cfg);
          if (!tasks.length) return;
          sheets.push({ kind: 'person', week: w, person: p, tasks });
        });
      });
    }
    const withToc = !!cfg.toc && sheets.length > 1;
    sheets.forEach((s, i) => { s.no = i + 1; });
    return {
      cfg, weeks, sheets, withToc,
      total: sheets.length + (withToc ? 1 : 0),
      first: weeks[0], last: weeks[weeks.length - 1],
    };
  },

  setCode(week) { return this.CODE + '-' + week; },

  // 装订位置：这几张纸叠成一册之后，手里这张是第几张。
  // sheets 里的 no 只数分图，目录页不在其中（它的 no 是 0），但目录页自己
  // 也是一张 A3 —— 所以有目录时每张纸的装订位置都要往后挪一格，
  // 否则 8 张纸的册子最后一张写 07/08，而 08/08 这张根本不存在。
  pos(plan, sheet) {
    // 装订位置以「物理纸张」为准（paginate 已经数过续页）；
    // 探针草稿阶段还没有纸张表，退回按逻辑页算，保证草稿也不会 NaN。
    if (sheet.pos) return sheet.pos;
    return (sheet.toc ? 0 : (sheet.no || 0)) + (plan.withToc ? 1 : 0);
  },

  // ---- 跨页续排：把装不下的那张纸按卡切开 --------------------------
  // 旧办法是让内容整块往下流：图签栏跟着跑到第二页、页眉上也没有「续」。
  // 现在按「一张卡」为最小单位开刀，每一半都是**完整的一张纸** ——
  // 自己的页眉、自己的图签、自己的配平。切多页就照着重开一遍，直到装得下。
  // 判据是「这张纸的自然高还装不装得下」。第九轮起图框不吃配平，这个上限就
  // 不再是一个常数：图面在下限处最多能吃 (1046 − PAD − F)/下限，
  // 加上图框 F 与上下内边距 PAD 才是整张纸的自然高上限（旧算法是 1047÷0.66≈1586，
  // 那是按「整张等比缩」推的；图框一钉住它就必须跟着图框高走，否则切点会错 ——
  // probe_r9_look.py 量过：不重推的话图签栏会掉到纸外 35px）。
  // 切完之后每张纸通常能回到 100%，而不是继续挤在 66% 上。
  // 第十二轮换掉的正是这里的**除数**：下限从 FIT_FLOOR(.66) 换成 COMFORT_FLOOR(.8824)。
  // 理由是量出来的，不是观感投票：图框钉在 100%，它最小的字（图签小标 7.5px）就永远是
  // 7.5px；图面却能压到 66% —— 那一档上图面最小的字（卡内徽标 8.5px）只剩 5.61px，
  // **比第九轮特意救回来的图框小字还难读**，一条规矩自己咬了自己的尾巴。
  // 逐档代价都称过（probe_r12_floor.py，0.66/0.75/0.80/0.85/0.8824/0.9259 六档）：
  // 换成 .8824 之后真种子两档排法逐张 fc 仍是 1.0000（对今天的数据零影响），代价只在
  // 每人 +2 / +3 那两档各多一张纸，而最满的 6/5/6/5 那例张数不变、配平从 0.6724 抬到 0.9079。
  // 想连「项目名比图签中文格值小」那一档也翻回来得 .9259，量过的代价是每人 +1 就要多一张纸。
  FRAME_SEL: ':scope > .sheet-head, :scope > .stat-bar, :scope > .tb',
  FLOW_SEL: ':scope > .sheet-board, :scope > .sheet-flow, :scope > .sheet-nil, :scope > .toc',
  // 这张纸「压到舒适下限还能吃多高的自然内容」= PAD + 图框 F + floor(avail / COMFORT_FLOOR)。
  // 图框一钉住，这个上限就不再是常数：目录页没有统计条，图框比周页矮 81px
  // （现数 2026-09-24：周/人纸 pad 40 + 图框 198 → avail 808 → 预算 1153；
  // 目录纸 pad 40 + 图框 117 → avail 889 → 预算 1163）。**图框矮 81px 只换来 10px 预算**，
  // 因为每少 1px 图框就多 1/0.8824px 的图面额度，净增只有 1 − 1÷0.8824 ≈ 0.133 倍；
  // 换成舒适下限之前的 .66 除数，这个净增是 0.515 倍、量到的差是 42px（1461 / 1503）。
  // 量之前必须把 fit() 写过的两处内联样式摘掉：图签栏上挂着负 margin（补图面缩掉的
  // 那截），图面上挂着 100%/fc 的宽。带着它们量，图框高会被负 margin 抵消掉 ——
  // verify_framescale.py 头一跑就量出「每人+3 那例预算 1461 变 1663」，
  // 整整多出 200px，切点会晚切一整列卡。摘完量完原样还原，调用方看不出差别。
  _budgetFor(page) {
    const cs = getComputedStyle(page);
    const pad = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
    const flow = page.querySelector(this.FLOW_SEL);
    const tb = page.querySelector(':scope > .tb');
    const keep = { w: flow ? flow.style.width : null, m: tb ? tb.style.marginTop : null };
    if (flow) flow.style.width = '';
    if (tb) tb.style.marginTop = '';
    let frame = 0;
    page.querySelectorAll(this.FRAME_SEL).forEach(el => {
      const c = getComputedStyle(el);
      frame += el.getBoundingClientRect().height
        + parseFloat(c.marginTop) + parseFloat(c.marginBottom);
    });
    if (flow) flow.style.width = keep.w;
    if (tb) tb.style.marginTop = keep.m;
    const avail = (this.A3_H - 1) - pad - frame;
    // 除数是 COMFORT_FLOOR 而不是 FIT_FLOOR（第十二轮）：预算管的是「什么时候该换一张纸」，
    // 那就得按「这张纸还读得下去」来定，不能按「这张纸还没装不下」来定 —— 后者允许图面
    // 一路压到 66%，量出来图面最小的字（5.61px）比钉死不许缩的图框小字（7.5px）还小。
    return pad + frame + Math.floor(avail / this.COMFORT_FLOOR);
  },

  // 探针：一张看不见、但走同一套 CSS 与渲染器的纸。量它才算数 ——
  // 报纸分栏（.sheet-flow）的配平是排版引擎的事，在 JS 里模拟必然出错。
  _probe(html) {
    let box = document.getElementById('sheet-probe');
    if (!box) {
      box = document.createElement('div');
      box.id = 'sheet-probe';
      box.className = 'sheet-paper';
      box.innerHTML = '<div class="sheet-page"></div>';
      document.body.appendChild(box);
    }
    box.querySelector('.sheet-page').innerHTML = html;
    return box.querySelector('.sheet-page');
  },

  _probeFits(html) {
    const page = this._probe(html);
    return page.scrollHeight <= this._budgetFor(page);
  },

  // 量完就把探针摘掉：它带的也是 .sheet-paper，留在 DOM 里会让任何
  // 全局数纸张的脚本（包括 harness 自己）多算一张，屏上还会多出一道纸影。
  _dropProbe() {
    const box = document.getElementById('sheet-probe');
    if (box) box.remove();
  },

  // 整张铺进探针，量两样东西：整张的自然高，以及每个竖排单元里每张卡的底边
  // （都是纸内自然像素 —— 探针挂在 body 下、不在 #print-stack 里，--fv 传不进来，
  // 所以 --pvs 与 --fc 恒为 1，rect 不会被缩放骗掉）。
  // 「这一页能画到哪儿」= limit = 下限能吞下的自然高 − 最高那列最后一张卡以下的占位。
  _sheetGeom(html, itemSel) {
    const page = this._probe(html);
    const pr = page.getBoundingClientRect();
    const k = pr.width / 1512 || 1;
    const bottom = el => (el.getBoundingClientRect().bottom - pr.top) / k;
    const groups = [];
    let lastParent = null;
    page.querySelectorAll(itemSel).forEach(el => {
      if (el.parentElement !== lastParent) { lastParent = el.parentElement; groups.push([]); }
      groups[groups.length - 1].push(bottom(el));
    });
    // tail = 「最高那一列的最后一张卡底边以下」占掉多少 —— 列框自己的下内边距、
    // 图签栏的下边距与整条图签栏、纸的下内边距都在里面。
    // 注意别拿图面块(block)的底边来算：图框是带内边距的，block 底边比最后一张卡的
    // 底边低十几像素，少的正是那十几 —— 第一次实现就栽在这儿，量着 1502 装得下，
    // 真铺出来 1599，白续一页。
    const H = page.scrollHeight;
    const tops = groups.filter(b => b.length).map(b => b[b.length - 1]);
    const tail = tops.length ? H - Math.max.apply(null, tops) : 0;
    // 上限跟着这张探针纸自己的图框高走（目录页没有统计条，比周页矮 81px）
    const budget = this._budgetFor(page);
    return { h: H, budget, limit: budget - tail, groups };
  },

  // 竖排堆叠的列（按周连排的四列、目录页的表体）：一页里每列各自吃到装不下为止，
  // 剩下的进下一页。续页里第一张卡贴回列头下沿，所以底边要按「本段第一张」重新对齐。
  _sliceGroups(bottoms, limit) {
    const cur = bottoms.map(() => 0);
    const parts = [];
    while (cur.some((c, i) => c < bottoms[i].length)) {
      const take = bottoms.map((b, i) => {
        const c = cur[i];
        if (c >= b.length) return 0;
        let n = 0;
        while (c + n < b.length && b[0] + (b[c + n] - b[c]) <= limit) n++;
        return Math.max(n, 1);            // 一张卡就比一页高，也得给它一张纸
      });
      parts.push(take);
      take.forEach((n, i) => { cur[i] += n; });
      if (parts.length > 24) break;        // 兜底：任何量法都要退出
    }
    return parts;
  },

  // 报纸分栏：只能整段试排（_probeFits），二分找这一页装得下的最多张数。
  _sliceFlow(tasks, htmlOf) {
    const ranges = [];
    let c = 0;
    while (c < tasks.length) {
      let lo = 1, hi = tasks.length - c;
      if (hi > 1 && this._probeFits(htmlOf(c, 1))) {
        while (lo < hi) {
          const mid = (lo + hi + 1) >> 1;
          if (this._probeFits(htmlOf(c, mid))) lo = mid; else hi = mid - 1;
        }
      }
      ranges.push([c, c + lo]);
      c += lo;
    }
    return ranges;
  },

  // 排一次册：逻辑页 → 物理纸张。每张纸带 pos（装订位置）、cont/conts（本图第几页）。
  _paginate(plan, cfg) {
    const papers = [];
    if (plan.withToc) {
      const idx = plan.sheets.map((s, i) => i);
      // 试排时就把「本图第 n/m 页」那格预留出来：续排标记会让图签栏那行字变长，
      // 长了就可能换行、换行就把整张纸撑高 —— 不预留的话量到的是矮的那版，
      // 铺真册时才发现高出来十几像素，压到下限还超纸面，白续一页。
      const g = this._sheetGeom(this._tocSheet(plan, cfg, { rows: idx, cont: 1, conts: 2 }),
        // 必须限定 `toc-index`：目录页现在有两张表，裸 `.toc table tbody > tr` 会把
        // 任务分布横表那五行也当成目录行切一刀 —— 切分对象错了，段数和卡数全乱。
        '.toc table.toc-index tbody > tr');
      if (g.h <= g.budget || !g.groups.length) papers.push({ kind: 'toc', rows: idx });
      else {
        let c = 0;
        this._sliceGroups(g.groups, g.limit).forEach(take => {
          papers.push({ kind: 'toc', rows: idx.slice(c, c + take[0]) });
          c += take[0];
        });
      }
    }
    const draft = { cont: 1, conts: 2 };   // 试排一律按「带续排标记」量，见上面目录页那条注释
    plan.sheets.forEach(s => {
      if (s.kind === 'week') {
        const cols = C.MEMBERS.map(p => this.tasksFor(s.week, p, cfg));
        const g = this._sheetGeom(this._weekSheet(s, plan, cfg, Object.assign({ cols }, draft)),
          '.sheet-board .column-body > .task-card');
        if (g.h <= g.budget) { papers.push({ kind: 'week', sheet: s, cols }); return; }
        const cur = cols.map(() => 0);
        this._sliceGroups(g.groups, g.limit).forEach(take => {
          papers.push({ kind: 'week', sheet: s,
            cols: cols.map((list, i) => list.slice(cur[i], cur[i] + take[i])) });
          take.forEach((n, i) => { cur[i] += n; });
        });
        return;
      }
      const htmlOf = (from, n) => this._personSheet(s, plan, cfg,
        Object.assign({ tasks: s.tasks.slice(from, from + n) }, draft));
      const wholePage = this._probe(htmlOf(0, s.tasks.length));
      const whole = wholePage.scrollHeight;
      if (whole <= this._budgetFor(wholePage)) {
        papers.push({ kind: 'person', sheet: s, tasks: s.tasks }); return;
      }
      this._sliceFlow(s.tasks, htmlOf).forEach(([a, b]) =>
        papers.push({ kind: 'person', sheet: s, tasks: s.tasks.slice(a, b) }));
    });
    papers.forEach((p, i) => { p.pos = i + 1; });
    // 同一逻辑页被切成几张 → 标上「本图第 n / m 页」，目录页也要能看出这是个区间
    const runs = new Map();
    papers.forEach(p => {
      const key = p.sheet || 'toc';
      const list = runs.get(key) || [];
      list.push(p);
      runs.set(key, list);
    });
    runs.forEach(list => list.forEach((p, i) => { p.cont = i + 1; p.conts = list.length; }));
    plan.sheets.forEach(s => {
      const list = runs.get(s);
      s.posA = list[0].pos;
      s.posB = list[list.length - 1].pos;
      s.parts = list.length;
    });
    // 卷内张次：按人成册时「一卷 = 一个人从头到尾那几张纸」。装订位置（`pos`）回答的是
    // 「这张是整册第几张」，回答不了「易榆乔那一卷是不是少了一张」——一叠 13 张纸摊在桌上
    // 要分给四个人时，后一个问题才是实际会问的。卷内号只写进页眉，图签栏的 `SHT` 与
    // 「本图 n/m」口径不动（见决策 13：那两格一个是装订位置、一个是一张图自己的页次）。
    // 一个人在册里是**连着排**的（`plan()` 先按人、再按周），所以卷内就是纸张表上的一段连续区间。
    plan.volumes = [];
    if (cfg.mode === 'persons') {
      const byPerson = new Map();
      papers.forEach(p => {
        if (p.kind !== 'person') return;
        const list = byPerson.get(p.sheet.person) || [];
        list.push(p);
        byPerson.set(p.sheet.person, list);
      });
      C.MEMBERS.forEach(person => {
        const list = byPerson.get(person);
        if (!list) return;
        list.forEach((p, i) => { p.volPos = i + 1; p.volPapers = list.length; });
        plan.volumes.push({ person, papers: list.length,
          first: list[0].pos, last: list[list.length - 1].pos });
      });
    }
    this._dropProbe();
    return papers;
  },

  // 整套图的图册号：单周不写区间，多周写成 W36–W39
  suiteCode(plan) {
    if (plan.first === plan.last) return this.CODE + '-' + plan.first;
    const p = w => WeekUtils.parseWeekStr(w);
    const a = p(plan.first), b = p(plan.last);
    const prefix = this.CODE + '-' + a.year + '-W';
    return a.year === b.year
      ? prefix + a.week + '–' + b.week
      : prefix + a.week + ' – ' + this.CODE + '-' + plan.last;
  },

  weekLabel(weekStr) {
    const p = WeekUtils.parseWeekStr(weekStr);
    return p ? `${p.year}年第${p.week}周` : weekStr;
  },

  // 纸面「周期」格：单周写本周（周一 — 周日），多周写整册的头尾（09.07 — 10.04）
  suiteRange(plan) {
    const p = n => String(n).padStart(2, '0');
    const f = d => p(d.getMonth() + 1) + '.' + p(d.getDate());
    if (plan.weeks.length <= 1) return WeekUtils.formatDimRange(plan.first);
    return f(WeekUtils.getWeekDateRange(plan.first).start) + ' — ' + f(WeekUtils.getWeekDateRange(plan.last).end);
  },

  // ---- 纸面零件 ----------------------------------------------------

  _tbCells(plan, sheet) {
    const now = new Date();
    const pad = n => String(n).padStart(2, '0');
    const cells = [
      { k: '部门', v: '效果图部门', zh: 1 },
      { k: '图名', v: sheet.title, zh: 1, grow: 1 },
      // 周期一格写这张纸自己的那一周；只有目录页写整册的头尾
      { k: '周期', v: sheet.period || WeekUtils.formatDimRange(sheet.week) },
      { k: '图号', v: sheet.code },
    ];
    if (sheet.vol) cells.push({ k: '册', v: sheet.vol });
    // 一张图号被续排拆到几张纸上时，张次后头带上「本图第几页」：图号只有一枚，纸有好几张。
    // 写「本图」不写「续」—— 第一页不是续页，标「续 1/2」是假话；这一格在每张纸上同形，
    // 只有数字变，量高度的时候才不会因为文案长短而抖。
    const seq = sheet.toc ? 'INDEX' : sheet.nil ? 'NIL'
      : `SHT ${pad(this.pos(plan, sheet))}/${pad(plan.total)}`;
    cells.push({ k: '张次', v: seq + (sheet.conts > 1 ? ` · 本图 ${sheet.cont}/${sheet.conts}` : '') });
    cells.push({ k: '签发', v: `${now.getFullYear()}.${pad(now.getMonth() + 1)}.${pad(now.getDate())}` });
    cells.push({ k: '比例', v: 'NTS' });
    cells.push({ k: '版次', v: 'R1' });
    cells.push({ k: '制图', v: sheet.people, zh: 1 });
    return `<div class="tb">` + cells.map(c =>
      `<div class="tb-cell${c.grow ? ' grow' : ''}"><span class="anno">${c.k}</span>` +
      `<span class="tb-val${c.zh ? ' zh' : ''}">${esc(c.v)}</span></div>`).join('') + `</div>`;
  },

  _head(sheet, plan) {
    const pad = n => String(n).padStart(2, '0');
    // 页眉这格是装订位置（第几张纸），不是分图号 —— 目录页自己占第 01 张
    const seq = `第 ${pad(this.pos(plan, sheet))} / ${pad(plan.total)} 张`;
    // 按人成册且不止一卷时才加后半句：一卷就一个人数得过来，写「本卷」是给自己添一格数字。
    // 这半句跟着 `seq` 进同一个 `<b>`（15px 等宽），为的是摊开一叠纸就能看见；
    // `.sh-right` 是 nowrap、左边那两行离它还有九百多像素，加宽一百来像素挤不到换行
    // （`.preview/head_geom.py` 逐张量过页眉与左块的高度，见决策 17）。
    const vols = plan.volumes && plan.volumes.length > 1;
    const volSeq = (vols && sheet.volPos) ? ` · 本卷 ${pad(sheet.volPos)} / ${pad(sheet.volPapers)}` : '';
    return `<div class="sheet-head">
      <div>
        <div class="sh-title">${esc(sheet.title)}${sheet.conts > 1 && sheet.cont > 1 ? ' · 续' : ''}</div>
        <div class="sh-sub">效果图部门 · 周任务进度表 · ${esc(sheet.code)}${sheet.vol ? ' · ' + esc(sheet.vol) : ''}</div>
      </div>
      <div class="sh-right"><span>${esc(suiteRangeLabel(plan))}</span><b>${sheet.nil ? '占位' : sheet.toc ? '目录 · ' + seq : seq + volSeq}</b></div>
    </div>`;
  },

  // 纸面上的图签统计条：与 #stats-bar 同一套 class，口径换成出图范围
  _stats(week, onlyPerson, cfg) {
    const names = onlyPerson ? [onlyPerson] : C.MEMBERS;
    const groups = names.map(p => ({ p, tasks: this.tasksFor(week, p, cfg) }));
    let all = [];
    groups.forEach(g => { all = all.concat(g.tasks); });
    const total = all.length;
    const done = all.filter(t => t.status === '已完成').length;
    const rate = total > 0 ? Math.round(done / total * 100) : 0;
    const lvl = rate >= 80 ? 'is-good' : rate >= 50 ? 'is-warn' : 'is-bad';
    let html = `<div class="stat-bar">`;
    html += `<div class="stat-cell"><span class="anno">任务总数</span><span class="stat-value">${total}</span></div>`;
    html += `<div class="stat-cell"><span class="anno">已完成</span><span class="stat-value">${done}<em>/${total}</em></span></div>`;
    html += `<div class="stat-cell wide"><span class="anno">完成率</span><span class="stat-value ${lvl}">${rate}<em>%</em></span><span class="rate-track ${lvl}"><i style="width:${rate}%"></i></span></div>`;
    groups.forEach(g => {
      const i = C.MEMBERS.indexOf(g.p);
      const d = g.tasks.filter(t => t.status === '已完成').length;
      const r = g.tasks.length ? Math.round(d / g.tasks.length * 100) : 0;
      html += `<div class="stat-person">
        <div class="sp-top"><span class="stat-dot ${C.DOT_CLASSES[i]}"></span><span class="sp-name">${esc(g.p)}</span><span class="sp-num"><b>${d}</b>/${g.tasks.length}</span></div>
        <div class="sp-bar"><i style="width:${r}%"></i></div>
      </div>`;
    });
    html += `<div class="stat-legend"><span class="lg-not">未开始</span><span class="lg-prog">进行中</span><span class="lg-done">已完成</span></div>`;
    return html + `</div>`;
  },

  // 把这张纸的装订信息抄到图签用的 meta 上（pos=第几张纸，cont/conts=本图第几页）
  _mark(meta, paper) {
    if (paper) {
      meta.pos = paper.pos; meta.cont = paper.cont; meta.conts = paper.conts;
      meta.volPos = paper.volPos; meta.volPapers = paper.volPapers;
    }
    return meta;
  },

  // paper = 这张纸留哪些卡（跨页续排切出来的一段）；不给就是整张。
  _weekSheet(sheet, plan, cfg, paper) {
    const load = Renderer._weekLoad(sheet.week);
    const marks = Renderer._weekMarks(sheet.week);
    const cols = (paper && paper.cols) || C.MEMBERS.map(p => this.tasksFor(sheet.week, p, cfg));
    // 列头的人数与完成率始终按整周算：续页上那半截卡不能把它改小，
    // 不然两张纸上的「4 项 / 8 项」看着像两回事。
    // 负荷迷你格同理走 load —— 它是这个人的历史节律，
    // 不该被「只出未完成」这类出图范围改动含义。
    const totals = C.MEMBERS.map((p, i) => {
      const all = this.tasksFor(sheet.week, p, cfg);
      return { n: all.length, done: all.filter(t => t.status === '已完成').length };
    });
    const html = cols.map((list, i) => Renderer._renderColumn(C.MEMBERS[i], list, load, marks, {
      divLabel: `分图 ${String(i + 1).padStart(2, '0')}`,
      idSuffix: `-s${sheet.no}${paper && paper.conts > 1 ? 'c' + paper.cont : ''}`,
      totals: totals[i],
    })).join('');
    const meta = this._mark({
      week: sheet.week, no: sheet.no,
      title: this.weekLabel(sheet.week) + ' 任务进度表',
      code: this.setCode(sheet.week),
      people: C.MEMBERS.join(' · '),
    }, paper);
    return this._head(meta, plan)
      + this._stats(sheet.week, null, cfg)
      + `<div class="sheet-board">${html}</div>`
      + this._tbCells(plan, meta);
  },

  _personSheet(sheet, plan, cfg, paper) {
    const idx = C.MEMBERS.indexOf(sheet.person) + 1;
    const vol = `VOL ${String(idx).padStart(2, '0')} · ${sheet.person}`;
    const title = `${sheet.person} · ${this.weekLabel(sheet.week)} 任务进度表`;
    const code = `${this.setCode(sheet.week)}-${String(idx).padStart(2, '0')}`;
    const marks = Renderer._weekMarks(sheet.week);
    const tasks = (paper && paper.tasks) || sheet.tasks;
    const cards = tasks.map((t, n) => Renderer._renderCard(t, n, marks)).join('');
    const meta = this._mark({ week: sheet.week, no: sheet.no, title, code, vol, people: sheet.person }, paper);
    return this._head(meta, plan)
      + this._stats(sheet.week, sheet.person, cfg)
      + `<div class="sheet-flow${tasks.length > 5 ? '' : ' sparse'}">${cards}</div>`
      + this._tbCells(plan, meta);
  },

  // 目录页第二张表：人 × 周（观感与理由见 CSS 里 `.toc-matrix` 那段）。
  // 只在目录的**第一张纸**上画：横表统共四行，重复到续页上是噪音。
  // 试排（`_paginate` 里那份 cont:1 的草稿）带着它，所以量出来的 limit 是「带横表」
  // 那一版 —— 偏小，续页只会更松，不会反过来超。
  _tocMatrix(plan, cfg) {
    const weeks = plan.weeks;
    const ZERO = { n: 0, k: 0 };
    const cell = (w, p) => {
      const list = this.tasksFor(w, p, cfg);
      return { n: list.length, k: list.filter(t => t.status !== '已完成').length };
    };
    const add = (a, b) => ({ n: a.n + b.n, k: a.k + b.k });
    const grid = C.MEMBERS.map(p => weeks.map(w => cell(w, p)));
    // 负荷条按全表最满的一格归一（不是按行、不是按周），横着比和竖着比才是同一个尺子
    const max = Math.max(1, ...grid.map(r => Math.max(...r.map(c => c.n))));
    // 只有「一人一周」那几格画负荷条。合计格是另一种量（跨周或跨人累加），
    // 拿同一把尺子量会把条撑出格子，而且「谁这周最满」这件事本来就在网格里比。
    const td = (c, isSum) => `<td class="tm-c${c.n ? '' : ' tm-nil'}">`
      + `<span class="tm-k${c.k || !c.n ? '' : ' ok'}">${c.n ? c.k : '—'}</span>`
      + (c.n ? `<span class="tm-s">/</span><span class="tm-n">${c.n}</span>` : '')
      + (isSum ? '' : `<i class="tm-bar"><b style="width:${c.n ? Math.max(8, Math.round(c.n / max * 100)) : 0}%"></b></i>`)
      + '</td>';
    const wpct = (68 / weeks.length).toFixed(2);
    const cols = '<colgroup><col style="width:20%">'
      + weeks.map(() => `<col style="width:${wpct}%">`).join('')
      + '<col style="width:12%"></colgroup>';
    const head = `<tr><th class="tm-p">制图人</th>`
      // 表头那一格只写 `W39`：八周并排时全名「2026年第39周」会挤成两行，
      // 年份与区间已经写在上面那行说明里了（术语表：周 = `W39`）。
      + weeks.map(w => `<th>W${esc(String(w).split('-W')[1] || '')}</th>`).join('')
      + '<th>合计</th></tr>';
    // `r.map(td)` 这种写法在这儿是**陷阱**：`map` 会把下标当第二个实参递进来，
    // 而第二个实参正是 `isSum` —— 于是每行只有第 0 格画得出负荷条，其余全被当成合计格。
    // （断言「网格每格都得有负荷条」当场把它抓了出来，见 .preview/verify_sheet.py。）
    const rows = grid.map((r, i) => `<tr>`
      + `<td class="zh tm-p"><i class="md ${C.DOT_CLASSES[i]}"></i>${esc(C.MEMBERS[i])}</td>`
      + r.map(c => td(c)).join('') + td(r.reduce(add, ZERO), 1) + '</tr>').join('');
    const colTot = weeks.map((w, j) => grid.reduce((a, r) => add(a, r[j]), ZERO));
    const sum = '<tr class="tm-sum"><td class="zh tm-p">全组合计</td>'
      + colTot.map(c => td(c, 1)).join('') + td(colTot.reduce(add, ZERO), 1) + '</tr>';
    const gap = cfg.mode === 'persons' ? ' · 按人成册时那格的 0 就是没出卷的一周' : '';
    return `<div class="toc-matrix">
      <div class="tm-cap"><b>任务分布 · Task Matrix</b><span>格内为「未完成 / 任务数」，细条为负荷（按最满的一格归一）${gap}</span></div>
      <table>${cols}<thead>${head}</thead><tbody>${rows}${sum}</tbody></table>
    </div>`;
  },

  _tocSheet(plan, cfg, paper) {
    const pad = n => String(n).padStart(2, '0');
    let prevVol = 0;
    const listed = ((paper && paper.rows) || plan.sheets.map((s, i) => i)).map(i => plan.sheets[i]);
    // 卷小计只在按人成册且**不止一卷**时出现 —— 与页眉「本卷 k / m」共用决策 17 那道闸：
    // 整册就一卷时，「本卷几张」跟全册张次是同一个数，那行纯属重复。
    // 任务数与欠项按**整册**算，不按 `listed` 算：目录页被续排切开时，后半张上那一卷
    // 只剩几行，小计说的仍是这一卷的全貌（它因此只在卷的真·第一行前面出现一次）。
    const vols = (cfg.mode === 'persons' && plan.volumes && plan.volumes.length > 1) ? plan.volumes : null;
    const volStat = {};
    if (vols) {
      plan.sheets.forEach(s => {
        if (s.kind !== 'person') return;
        const st = volStat[s.person] || (volStat[s.person] = { n: 0, done: 0, first: s });
        st.n += s.tasks.length;
        st.done += s.tasks.filter(t => t.status === '已完成').length;
      });
    }
    const rows = listed.map(s => {
      const tasks = s.kind === 'week'
        ? C.MEMBERS.reduce((a, p) => a.concat(this.tasksFor(s.week, p, cfg)), [])
        : s.tasks;
      const done = tasks.filter(t => t.status === '已完成').length;
      const rate = tasks.length ? Math.round(done / tasks.length * 100) : 0;
      const vn = s.kind === 'person' ? C.MEMBERS.indexOf(s.person) + 1 : 0;
      const vol = vols && s.kind === 'person' ? vols.find(v => v.person === s.person) : null;
      const st = vol && volStat[s.person].first === s ? volStat[s.person] : null;
      // 小计行用 <th scope="row"> 而不是 <td>：语义上它是下面那几行的行头，
      // 且目录的张次对账取的是 `tbody tr > td:first-child`，这行没有 td，就不会被读成一张纸。
      const lead = st
        ? `<tr class="toc-vol"><th colspan="8" scope="row">`
          + `<b>VOL ${pad(vn)} · ${esc(s.person)}</b>`
          + ` 本卷 ${vol.papers} 张 · ${vol.first === vol.last ? '第 ' + pad(vol.first) : '第 ' + pad(vol.first) + '–' + pad(vol.last)} 张`
          + ` · 任务 ${st.n} 项 · <i class="${st.n - st.done ? '' : 'ok'}">欠 ${st.n - st.done} 项</i>`
          + `</th></tr>`
        : '';
      // 成册时给每卷开头一道加重横线，目录上能看出「这里换了一卷」；
      // 有小计那一行时它自己就带了上边线，下面这张行不再重复加重。
      const brk = cfg.mode === 'persons' && vn !== prevVol && !st;
      prevVol = vn;
      const meta = s.kind === 'week'
        ? { title: this.weekLabel(s.week), code: this.setCode(s.week), vol: '—', people: tasks.length }
        : { title: `${s.person} · ${this.weekLabel(s.week)}`, code: `${this.setCode(s.week)}-${String(vn).padStart(2, '0')}`, vol: `VOL ${String(vn).padStart(2, '0')}`, people: tasks.length };
      return `${lead}<tr${brk ? ' class="vol-break"' : ''}>
        <td class="num">${s.posA ? (s.posA === s.posB ? pad(s.posA) : pad(s.posA) + '–' + pad(s.posB)) : pad(this.pos(plan, s))}</td>
        <td>${esc(meta.code)}</td>
        <td class="zh">${esc(meta.title)}</td>
        <td>${esc(WeekUtils.formatDimRange(s.week))}</td>
        <td>${esc(meta.vol)}</td>
        <td class="num">${meta.people}</td>
        <td class="num">${done}</td>
        <td class="num">${rate}%</td>
      </tr>`;
    }).join('');
    let all = [];
    plan.sheets.forEach(s => {
      all = all.concat(s.kind === 'week'
        ? C.MEMBERS.reduce((a, p) => a.concat(this.tasksFor(s.week, p, cfg)), [])
        : s.tasks);
    });
    // 一张任务只属于一个人 + 一周，各页之间天然不重不漏，直接计数
    const total = all.length;
    const done = all.filter(t => t.status === '已完成').length;
    // 册级「挂了几周」读数：纸上那几枚 `第 N 周` 的汇总，判的是同一份 taskMarks，
    // 所以把这一册的分图挨张数一遍，数出来的徽标要和这句里的数一模一样。
    // 数的是**卡**不是**身份**：同一条在两张纸上就记两次 —— 与上面那句
    // 「同一条任务在相邻两周各记一次」同一口径，换成去重这两句会互相打脸。
    const tctx = DataModel.tenureCtx();
    let stuck = 0, longest = 0, resum = 0, longestBroken = false;
    all.forEach(t => {
      if (t.status === '已完成') return;
      const mk = DataModel.taskMarks(t, tctx);
      if (mk.streak > 1) {
        stuck++;
        // 「最长的一项在纸上印着「X」」引用的是**纸面上那串字**，所以那一档断没断
        // 也得跟着走：若并列最长的几枚里有一枚没断，纸上就真有「第 K 周」那串字，
        // 引号里就不该带「断后」；只有它们**全**断过时，那串字才是「断后第 K 周」。
        if (mk.streak > longest) { longest = mk.streak; longestBroken = mk.earlier > 0; }
        else if (mk.streak === longest) longestBroken = longestBroken && mk.earlier > 0;
        if (mk.earlier > 0) resum++;      // 纸上印「断后第 N 周」的那几枚，同一个判据
      }
    });
    const stuckNote = stuck
      ? `未完成里 ${stuck} 项已连续在册到第 2 周以上，最长的一项在纸上印着「${longestBroken ? '断后' : ''}第 ${longest} 周」`
        + (resum ? `；其中 ${resum} 项印的是「断后第 N 周」—— 那几条断过一周以上，这一轮是重开之后数到的` : '')
        + `。`
      : `未完成里没有一条排到第 2 周。`;
    const scope = { all: '全部任务', open: '只出未完成', filtered: '沿用看板当前筛选' }[cfg.scope];
    // 卷内那句跟着页眉的**同一道闸**（`volumes.length > 1`）：只有一卷时纸上压根不印
    // 「本卷」，目录却解释它，就是让读的人去找一格不存在的数字。
    const volNote = (plan.volumes && plan.volumes.length > 1)
      ? '页眉的「本卷 k / m」数的是自己那一卷摊开的张数，与全册张次各说各的。' : '';
    const order = cfg.mode === 'persons'
      ? '按人成册，每人一卷（VOL），卷内按周从旧到新；当周没有排任务的人不出空卷。' + volNote
      : '按周连排，一人一张分图（四人四张），排空的周也保留一张，作为「本周没排」的证据。';
    const note = `<div class="toc-note">本册 ${plan.weeks.length} 周（${esc(this.weekLabel(plan.first))} 至 ${esc(this.weekLabel(plan.last))}），`
      + `共 ${plan.total} 张 A3 横排（含本页，本页是第 01 张），收录范围：${esc(scope)}。${esc(order)}<br>`
      + `合计 ${total} 项、已完成 ${done} 项；同一条任务在相邻两周各记一次，按周分别计数。${stuckNote}<br>`
      + `数据截至 ${esc(new Date().toLocaleString('zh-CN', { hour12: false }))}，来源为云端 Gist 与本机缓存合并后的结果。</div>`;
    const meta = this._mark({
      week: plan.last, no: 0, toc: true, period: this.suiteRange(plan),
      title: '图纸目录 · Drawing Index',
      code: this.suiteCode(plan),
      people: C.MEMBERS.join(' · '),
    }, paper);
    return this._head(meta, plan)
      + `<div class="toc"><table class="toc-index">
          <thead><tr><th class="num">张次</th><th>图号</th><th>图名</th><th>周期</th><th>册</th><th class="num">任务</th><th class="num">完成</th><th class="num">率</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>${(paper && paper.cont > 1) ? '' : this._tocMatrix(plan, cfg)}${note}</div>`
      + this._tbCells(plan, Object.assign({}, meta, { title: '周任务进度表 · 图纸目录' }));
  },

  // 零张纸的原因有两种：区间本身没数据，或者收录范围把它滤空了 —— 别把后者说成「四个人都排空了」
  nilReason(cfg) {
    if (cfg.scope === 'filtered') return '看板当前的搜索与筛选把这一段全滤掉了';
    if (cfg.scope === 'open') return '这一段里没有未完成任务，「只出未完成」就一张也不剩';
    return cfg.mode === 'persons'
      ? '四个人在这个区间都没排任务，按人成册就不出空卷'
      : '这一段里板上没有任务';
  },

  // 空册也要有一张纸可打：按人成册时如果区间内一个人排的任务都没有，
  // 排纸结果是 0 张 —— 屏上是一片空白、摘要写「0 张」、打印机直接出零页，
  // 谁都不知道是没活还是没配对。给一张「此页无图」占位页，图上写清楚为什么。
  _emptySheet(plan, cfg) {
    const meta = {
      week: plan.last, no: 0, nil: true, period: this.suiteRange(plan),
      title: '此页无图 · No Work To Plot',
      code: this.suiteCode(plan),
      people: C.MEMBERS.join(' · '),
    };
    const why = this.nilReason(cfg) + '。';
    const hint = (cfg.mode === 'persons' ? '换成「按周连排」会把没排任务的周也画出来，作为缺口的证据；' : '')
      + '或者把「截止周」挪到有活的那几周'
      + (cfg.scope === 'all' ? '。' : '，也可以把收录范围换回「全部任务」。');
    return this._head(meta, plan)
      + `<div class="sheet-nil"><div class="nil-box">`
      + `<div class="nil-t">本区间没有可出的任务</div>`
      + `<div class="nil-w">${esc(why)}</div>`
      + `<div class="nil-w">${esc(hint)}</div>`
      + `<div class="nil-meta">区间 ${esc(this.weekLabel(plan.first))} — ${esc(this.weekLabel(plan.last))} · 收录范围 `
      + `${esc({ all: '全部任务', open: '只出未完成', filtered: '沿用看板当前筛选' }[cfg.scope])}`
      + ` · 板上任务总数 ${esc(String(DataModel.state.tasks.length))}</div>`
      + `</div></div>`
      + this._tbCells(plan, Object.assign({}, meta, { title: '周任务进度表 · 此页无图' }));
  },

  // ---- 铺纸 / 预览 / 出纸 -------------------------------------------

  // 排一次册，并把「上限 16 张」那笔账收在**实际纸张**上。
  // `build()` 与 `updateSummary()` 共用这一个实现（2026-09-22，尾巴③）：同一件事一旦有
  // 两套算法，两套就会各自说谎 —— 摘要那三句假话（打脸的压周说明、带过来的配平读数、
  // 少报一张的张数）全是这么来的。返回的是物理纸张，顺带把 `capped` / `trimmed` /
  // `overCap` 三格按**这一册**重算，不给上一册留残值。
  planPapers(base) {
    const clamped = this.clampCount(base.count, base.mode);
    this.capped = clamped.capped;
    // 被上限压掉的是「这次排纸用几周」，不是「用户要几周」：base.count 保持原值，
    // 否则重开对话框时周数下拉会自己变成压完的 3，用户看着像被吞了一次输入。
    //
    // `clampCount` 只看**逻辑页**（一周一张、按人四张），它管不着续排：一张纸被切成
    // 两半之后物理纸张还会往上涨，原来 `MAX_PAGES` 因此是个**假上限**（2026-09-22 记在
    // 「还欠着的」里的尾巴①）。这里在切完之后按**实际纸张**复核一次：超了就从**最旧的
    // 那一周**起丢（连排是从截止周往回数的，最近的周才是用户要的），再整册重排。
    // 重排而不是「砍掉多出来的那几张」：张次、目录区间、图签分母全都建立在完整的一册上，
    // 从尾巴上摘纸会让「第 09 / 17 张」这种读数当场对不上。
    let count = clamped.count, plan = null, papers = [], over = 0;
    this.trimmed = null; this.overCap = 0;
    for (;;) {
      plan = this.plan(Object.assign({}, base, { count }));
      if (!plan.sheets.length) { papers = []; break; }
      papers = this._paginate(plan, base);
      if (papers.length <= this.MAX_PAGES || count <= 1) break;
      over = Math.max(over, papers.length - this.MAX_PAGES);
      count -= 1;
    }
    if (papers.length > this.MAX_PAGES && count === 1) {
      // 只剩一周还超上限：那是「一个人一周灌了两百项」，没有周可丢了。
      // 不硬压、不裁纸，照原样出，只在摘要里把超了多少张说清楚。
      this.overCap = papers.length - this.MAX_PAGES;
    } else if (count < clamped.count) {
      // `want` 存的是**用户开口要的那几周**：压周一共有两处（`clampCount` 看逻辑页、
      // 这一圈看实际纸张），摘要只报一次总数，不然「压到 1」和「丢掉 1 周」并排印出来，
      // 读的人分不清那个 1 是哪个 1。
      this.trimmed = { weeks: clamped.count - count, used: count, over, want: base.count };
    }
    // 目录页与续页各自占一张纸，都进分母；张数从这一行起就是**纸**不是**页**。
    // 空册那一路 papers 是空的，`plan.total` 留给 `plan()` 算出来的 0，占位页不进摘要。
    if (papers.length) plan.total = papers.length;
    return { plan, papers, count };
  },

  build(cfg) {
    this.cfg = Object.assign(this.defaultCfg(), cfg || this.cfg || {});
    const r = this.planPapers(this.cfg);
    const plan = r.plan, papers = r.papers;
    this.lastPlan = plan;
    // 纸（.sheet-paper，屏上带边带影、纸上只管分页）包着画布（.sheet-page，
    // 固定 1512×1047 = A3 可印区），配平缩放发生在画布这一层。
    // 第二参数是「这张纸是某张图的第二页起」——只用来换续页上那句空列说明（见 CSS 里
    // `.sheet-cont` 那条），不参与量高度：试排量的是整张未切的纸，那时 cont 恒 1。
    const page = (s, cont) => `<div class="sheet-paper"><div class="sheet-page${cont ? ' sheet-cont' : ''}">${s}</div></div>`;
    const stack = document.getElementById('print-stack');
    // 一张都没有：换成「此页无图」占位页，屏上有解释、纸上也有东西可打
    if (!plan.sheets.length) {
      stack.innerHTML = page(this._emptySheet(plan, this.cfg));
      this.fit();
      return plan;
    }
    // 两遍铺纸：第一遍把整张铺进探针量尺寸，决定哪几张要开刀（`planPapers` 里已经量过，
    // 切口就记在 `plan.sheets` 的 `parts` / `posA` / `posB` 上，这里不重复探一遍）；
    // 第二遍按切口铺真册 —— 张次、图名上的「续」都按物理纸张算，得等切完才知分母。
    // `plan.total` 已是纸张数（`planPapers` 那一行改写的），这里不再另算一遍。
    stack.innerHTML = papers.map(p => page(
      p.kind === 'toc' ? this._tocSheet(plan, this.cfg, p)
        : p.kind === 'week' ? this._weekSheet(p.sheet, plan, this.cfg, p)
        : this._personSheet(p.sheet, plan, this.cfg, p),
      p.conts > 1 && p.cont > 1)).join('');
    this.fit();
    return plan;
  },

  // 配平：图框（页眉 / 统计条 / 图签栏）永远 100%，装不下时只缩中间那块图面。
  // 量法必须「先回到自然尺寸再量」：--fc 是上一遍写进去的，不摁回 1 就量到缩放后
  // 的版面，fc 会一遍比一遍小（反馈环）。图面按 100%/fc 重排再缩回满幅，
  // transform 不改占位，所以占位高还是布局盒高 —— 差出来那截用图签栏的负 margin
  // 提回来，提完「图面视觉底边 → 图签栏」正好还是那 6mm。
  // 压到 FIT_FLOOR 就不再压 —— 宁可让它续一张纸，也不印出读不得的小字；
  // 续不续由 _paginate 拿 _budgetFor() 判。
  // 第十二轮起这两处**不再共用一个除数**（原来这一句写的是「同一条公式」，那是假的：
  // 共用 .66 时「不印出读不得的小字」这句话根本没兑现 —— 预算允许一张纸装下 1.51 倍
  // 纸高的自然内容，图面就一路压到 66%，图面最小字掉到 5.61px，比图框钉死的 7.5px 还小）。
  // 现在分工是：_budgetFor 按 COMFORT_FLOOR(.8824) 决定**什么时候换纸**，
  // fit() 这里的 FIT_FLOOR(.66) 只在切无可切（一张卡本身就高过一张纸）时兜底，
  // 兜底的那几张必然标 is-spill，判据 verify_comfort.py 要当场把它们数出来。
  A3_H: 1047,
  FIT_FLOOR: .66,
  // 续排预算用的舒适下限：图面压到底时，图面里最小的字仍要 ≥ 图框里最小的字。
  // 分子分母都是量出来的（probe_r12_ladder.py，2026-09-24，28 个角色 × 8 档负荷的
  // 落纸排位表）：图框一档最小是图签小标 `.tb-cell .anno` 7.5px，
  // 图面一档最小是卡内徽标 `.task-card .chip` 8.5px，7.5 ÷ 8.5 = .8824。
  // **改任何一侧的最小字号都要回来重算这个比值** —— 它不是一个审美常数，是一条除法。
  COMFORT_FLOOR: .8824,
  // 第十五轮：`fit()` 那一步除法用的是**窄版**（100% 宽）的自然高，画出来的却是**宽版**
  // （100/fc% 宽）缩完的样子。图面里有会折行的东西时宽版比窄版矮 —— 那一步就白缩一截。
  // 下面两格管这一截：**多小的余量不去追**、**最多追几步**。
  // FIT_SLACK = 2px 不是审美常数，是一道「根本不打算碰」的闸：那一位向下截断本身只留
  // 0.02–0.08px 的余量（1e-4 × 900px ≈ 0.09px），2px 已经把它连量具噪声一起挡在外面。
  // 现量：打码种子上每一张被缩过的纸余量都 ≤ 0.08px，一格也进不去；换成会折行的那颗
  // fixture（`name` 最长 76 字），62 张纸里也只有 1 张进得来，余量 50.88px
  // （probe_r15_curve.py / probe_r15_headroom.py，2026-09-24）。
  // FIT_TURNS 只是保险：从 fc 二分到 1，1e-4 那条判据自己会停（实测 12 步内），16 步罩得住。
  FIT_SLACK: 2,
  FIT_TURNS: 16,
  fit() {
    const H = this.A3_H;
    const stack = document.getElementById('print-stack');
    // #print-stack 在屏上是 display:none（只有预览层与打印媒体才让它露出来），看不见
    // 就量不到高度：scrollHeight 全是 0，拿 0 去配平等于把上一次量好的缩放抹回 100%，
    // 那张本来就超纸面的纸就再没人管了。所以临时借一次预览态来量、量完还原 ——
    // 整段同步，中间不重绘，用户看不到这一帧。借了还看不见（整页被隐藏）才真的跳过。
    // 「借」只认**这枚 class 本来不在**的那一种看不见：应用自己在预览层里时
    // `sheet-preview` 是它自己加的，还回去等于把用户的预览界面拆掉（整屏空白、
    // 纸还在 DOM 里却量不到矩形）。2026-09-23 夜里造 bail 时撞见的，
    // 读数与判据见「测量陷阱」该轮那条。
    const had = document.body.classList.contains('sheet-preview');
    let borrow = false;
    if (!had && !stack.getClientRects().length) {
      borrow = true;
      document.body.classList.add('sheet-preview');
    }
    if (!stack.getClientRects().length) {
      // 这一册一个数都没量到，那两格就得**当场清空**而不是留着：`minFit` / `spillPages`
      // 写在函数末尾，走这条路时它们仍是**上一册**的读数，而摘要那句「图面配平 n%」
      // 「n 张压到下限仍超纸面」认的就是这两格 —— 于是它会替一本没量过的册子说话
      // （决策 15 那三句互相打脸的账同一族）。清成 null / 0 之后 `summaryText` 那道
      // `minFit != null` 的闸自然闭嘴，与决策 16 定的「对话框里量不到的那格宁可不写」同规矩。
      if (borrow) document.body.classList.remove('sheet-preview');
      this.minFit = null;
      this.spillPages = 0;
      return { worst: 1, spill: 0, skipped: true };
    }
    const fv = parseFloat(getComputedStyle(stack).getPropertyValue('--fv')) || 1;
    let worst = 1, spill = 0;
    document.querySelectorAll('#print-stack .sheet-paper').forEach(paper => {
      const page = paper.querySelector('.sheet-page');
      const flow = page.querySelector(this.FLOW_SEL);
      const tb = page.querySelector(':scope > .tb');
      paper.style.setProperty('--fc', '1');
      if (flow) flow.style.width = '';
      if (tb) tb.style.marginTop = '';
      const cs = getComputedStyle(page);
      const pad = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
      let frame = 0;
      page.querySelectorAll(this.FRAME_SEL).forEach(el => {
        const c = getComputedStyle(el);
        frame += el.getBoundingClientRect().height / fv
          + parseFloat(c.marginTop) + parseFloat(c.marginBottom);
      });
      let fc = 1;
      if (flow) {
        const keepFlex = flow.style.flex;
        // 量「图面在占位宽 = pct% 下的自然布局高」：三件还原一件不能少 —— `--fc` 摁回 1
        // （:3183 那一行做的）、`tb` 的负 margin 清空（:3185）、`flex-grow` 摘掉。
        // 少还原一样，量的就是上一遍缩放之后的版面，那正是函数头那句警告的反馈环。
        const natural = pct => {
          flow.style.flex = '0 0 auto';
          flow.style.width = pct === 100 ? '' : pct + '%';
          const h = flow.getBoundingClientRect().height / fv;
          flow.style.flex = keepFlex;
          return h;
        };
        const f = natural(100);
        const avail = (H - 1) - pad - frame;
        // 装不下的那张按 H−1 配平、并且**向下截断**到四位小数：
        // 四舍五入会把盒子顶到 1047.03px，而可印区只有 1046.9px —— 多出那零点
        // 三像素足以让出纸机多吐一张空白续页（2026-09-22 在续排用例上真出过）。
        if (f > avail) {
          fc = Math.max(this.FIT_FLOOR, Math.floor(avail / f * 1e4) / 1e4);
          // 第十五轮：上面那一步除的是**窄版**的高，而画出来的是 `100/fc%` 宽那一版缩完
          // 的样子（:3208 那一写）。图面里有会折行的东西时，宽的那一版比窄的矮，于是这一遍
          // 白缩一截 —— 白纸不会多一张、图签栏照样贴边线，全部落在「最后一张卡墨底 →
          // 图签栏」那一条带里：现量正常纸 23.7px，被白缩的那张 74.58px（多出来的正是 50.88px）。
          // 所以追它买的是观感（同一张纸上的字大 3.2%），不是页数。
          // `D(s) = s × natural(100/s)` 对 s **不减**（摊得越窄越高），可行集是 `(0, s*]` 一段，
          // 所以二分合法；那个「拿新高的倒数再乘一次」的**迭代**反而不合法 —— 它是反序映射，
          // 实测在那张纸上弹成两循环 0.9572 ↔ 0.8970，而且第二值是**不可行**的（probe_r15_curve.py）。
          // 起点 lo 可行（余量 > 0）、hi = 1 不可行（`D(1)` 就是上面那个 `f > avail`），不变量成立。
          if (avail - fc * natural(100 / fc) > this.FIT_SLACK) {
            let lo = fc, hi = 1;
            for (let k = 0; k < this.FIT_TURNS && hi - lo > 1e-4; k++) {
              const mid = (lo + hi) / 2;
              if (mid * natural(100 / mid) <= avail) lo = mid; else hi = mid;
              // lo = mid 而不是 lo = 截断(mid)：探针在这儿写过 `lo = trunc(mid)`，一旦区间
              // 窄过 1e-4 那位就把 lo 摁回原地，30 步烧完也收敛不了（结果仍可行，只是白跑）。
            }
            fc = Math.max(this.FIT_FLOOR, Math.floor(lo * 1e4) / 1e4);   // 只在末尾截断
          }
        }
      }
      paper.style.setProperty('--fc', fc.toFixed(4));
      if (flow) {
        flow.style.width = (100 / fc) + '%';
        const layoutH = flow.getBoundingClientRect().height / (fv * fc);
        const gap = layoutH * (1 - fc);
        tb.style.marginTop = gap > .5 ? 'calc(6mm - ' + gap.toFixed(2) + 'px)' : '';
      }
      // 这张纸的图到底画到哪儿：**数子元素的 rect 底边**，不认 scrollHeight。
      // scrollHeight 认不认「被 transform 缩小的图面」是各家引擎自己的事 —— Chromium 认，
      // 于是这里正好 1047；哪天某家不认，它会把没缩的布局盒（图面的自然高）算进去，
      // --nat 跟着虚高几十上百像素，出纸机就多吐一张空白续页（Safari 才是真出纸的那家，
      // 不能只在 Chromium 上对）。rect 在哪家都是缩放后的真底边，所以拿它算。
      const pr = page.getBoundingClientRect();
      let bot = 0;
      page.querySelectorAll(':scope > *').forEach(el => {
        bot = Math.max(bot, (el.getBoundingClientRect().bottom - pr.top) / fv);
      });
      const h = bot + parseFloat(cs.paddingBottom);
      // 纸的占位高度要自己写回 --nat，否则纸叠纸（transform 不改变盒子占位）。
      // 真装不下的那张（压到下限还超）就让它比 1047 高：宁可让出纸机续一张，
      // 也不把图签栏裁掉 —— is-spill 同时标出来，_paginate 下一遍会正式切开。
      paper.style.setProperty('--nat', Math.max(H, Math.ceil(h)) + 'px');
      paper.classList.toggle('is-spill', h > H + 1);
      worst = Math.min(worst, fc);
      if (h > H + 1) spill++;
    });
    // 借来的预览态必须在这里还掉，否则非预览页会被它自己塞的 class 留在预览样式里。
    if (borrow) document.body.classList.remove('sheet-preview');
    this.minFit = worst;
    this.spillPages = spill;
    return { worst, spill };
  },

  // 屏上适配：整叠纸按窗口宽等比缩小。这个值只影响预览，不参与出纸
  // （@media print 里 --pvs 被钉回 1，配平只剩 --fc），所以 1512 基准与纸面一一对应。
  viewFit() {
    const w = Math.min(window.innerWidth, document.documentElement.clientWidth || window.innerWidth);
    const fv = Math.max(.2, Math.min(1, (w - 44) / 1512));
    document.getElementById('print-stack').style.setProperty('--fv', fv.toFixed(4));
    return fv;
  },

  preview(cfg) {
    const plan = this.build(cfg);
    document.body.classList.add('sheet-preview');
    this.viewFit();
    document.getElementById('pv-set').textContent = this.summaryText(plan, false);
    // 思源宋体是后到的，字一换行高就变。麻烦的是「量着装得下」的那张纸，字体落地后
    // 可能高出十几像素：只重新配平的话，66% 的下限会把多出来的高度硬压回纸面 —— 纸是
    // 装下了，字却凭空小一圈，而续排明明可以再给它一张纸。所以落地后再量一次，
    // 真超了就照新的行高重排一次册（build 末尾自己会再 fit 一遍）。
    // WebKit 那条通道就是这一例的现成证据：它 2026-09-22 量到一张 1592px 的纸压到 66%
    // 还露出纸面 545px，而 Chromium 同一页在字体先落地的顺序下切得干干净净。
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(() => {
        if (!document.body.classList.contains('sheet-preview')) return;   // 用户已经关了预览
        const again = this.fit();
        const out = again.spill ? this.build() : plan;
        this.viewFit();
        document.getElementById('pv-set').textContent = this.summaryText(out, false);
      });
    }
    return plan;
  },

  close() {
    document.body.classList.remove('sheet-preview');
  },

  // 「晒图」= 直接出纸。标题临时换成图册号，另存为 PDF 时文件名就是图号。
  printNow() {
    const plan = this.build();
    const keep = document.title;
    document.title = plan.sheets.length > 1 ? this.suiteCode(plan) : (plan.sheets[0] ? this.setCode(plan.sheets[0].week) : keep);
    document.getElementById('pv-set').textContent = this.summaryText(plan, false);
    window.print();
    setTimeout(() => { document.title = keep; }, 400);
    return plan;
  },

  summaryText(plan, withRange) {
    const cfg = plan.cfg;
    const bits = [`${plan.total} 张`, 'A3 横排', this.suiteCode(plan)];
    if (!plan.sheets.length) {
      bits.length = 0;
      bits.push('此页无图', 'A3 横排', this.suiteCode(plan), this.nilReason(cfg) + ' · 出一张占位页');
      return bits.join(' · ');
    }
    if (cfg.mode === 'persons') bits.push('按人成册');
    if (cfg.scope === 'open') bits.push('只出未完成');
    if (cfg.scope === 'filtered') bits.push('沿用当前筛选');
    if (this.capped && !this.trimmed) bits.push(`周数已压到 ${cfg.count}（上限 ${this.MAX_PAGES} 张）`);
    // 续排把物理纸张顶过上限：丢的是最旧的周，说清楚丢了几个、实排几个。
    // 与上面那句**互斥**：两处压周各报各的数会打脸（「压到 1」＋「丢掉 1 周」，
    // 那个 1 到底指谁）。合起来说过一次，就把续排顶出来的那一截单独标出来。
    if (this.trimmed) {
      const total = this.trimmed.want - cfg.count;
      bits.push(total > this.trimmed.weeks
        ? `上限 ${this.MAX_PAGES} 张 · 从最旧的周起丢掉 ${total} 周（其中续排顶出 ${this.trimmed.weeks} 周），实排 ${cfg.count} 周`
        : `续排后超出上限 ${this.trimmed.over} 张 · 从最旧的周起丢掉 ${this.trimmed.weeks} 周，实排 ${cfg.count} 周`);
    }
    if (this.overCap) bits.push(`已超上限 ${this.overCap} 张（只剩一周，没有可丢的周）`);
    // 切开续排时要说清楚：「9 张」里有几张是被拆出来的，别让人以为排了 9 周
    const split = plan.sheets.filter(s => s.parts > 1);
    if (split.length) {
      const extra = plan.total - (plan.sheets.length + (plan.withToc ? 1 : 0));
      bits.push(`续排 ${split.length} 张 → ${split.length + extra} 张`);
    }
    if (this.minFit != null && this.minFit < .999) bits.push(`图面配平 ${Math.round(this.minFit * 100)}%`);
    if (this.spillPages) bits.push(`${this.spillPages} 张压到下限仍超纸面 · 出纸会续页`);
    return bits.join(' · ');
  },

  // ---- 对话框 -------------------------------------------------------

  openDialog() {
    if (!this.cfg) this.cfg = this.defaultCfg();
    const opts = this.weekOptions();
    if (opts.indexOf(this.cfg.from) === -1) this.cfg.from = opts[0];
    const sel = document.getElementById('sh-from');
    sel.innerHTML = opts.map(w =>
      `<option value="${esc(w)}"${w === this.cfg.from ? ' selected' : ''}>${esc(this.weekLabel(w))}${WeekUtils.isCurrentWeek(w) ? ' · 本周' : ''}</option>`).join('');
    const cnt = document.getElementById('sh-count');
    cnt.innerHTML = '';
    for (let i = 1; i <= this.MAX_COUNT; i++) {
      const o = document.createElement('option');
      o.value = String(i); o.textContent = i === 1 ? '1 周（单张）' : i + ' 周';
      if (i === this.cfg.count) o.selected = true;
      cnt.appendChild(o);
    }
    this._paintSeg('sh-mode', this.cfg.mode);
    this._paintSeg('sh-scope', this.cfg.scope);
    document.getElementById('sh-toc').checked = !!this.cfg.toc;
    this.updateSummary();
    document.getElementById('sheet-overlay').classList.add('show');
    document.getElementById('sh-from').focus();
  },

  _paintSeg(id, v) {
    document.querySelectorAll(`#${id} button`).forEach(b => b.classList.toggle('on', b.dataset.v === v));
  },

  readForm() {
    const on = id => { const b = document.querySelector('#' + id + ' button.on'); return b ? b.dataset.v : null; };
    return {
      from: document.getElementById('sh-from').value,
      count: parseInt(document.getElementById('sh-count').value, 10) || 1,
      mode: on('sh-mode') || 'weeks',
      scope: on('sh-scope') || 'all',
      toc: document.getElementById('sh-toc').checked,
    };
  },

  // 摘要要按「真会打出来的那个计划」算：先套上限再排纸，
  // 否则会出现「摘要说 21 张、实际只出 12 张」这种对不上的数字。
  //
  // 这一行现在**照字面执行**了：走 `planPapers()`（与 `build()` 同一套），所以对话框里
  // 那个「N 张」就是真铺出来会数到的纸。以前它只 `plan()` 量**逻辑页**，册子里只要有一张
  // 被续排切开就少报一张 —— 2026-09-22 量过：四周连排说 5 真 6、八周说 9 真 10，
  // 连「两周 + 目录」都是说 3 真 4（`.preview/summary_gap_probe.py`）。代价：一次
  // `updateSummary()` 从 ~2ms 变成下面那个数（探针试排，无 `fit()`、不铺 DOM），
  // 落在下拉框与分段按钮的 change 上，量不出手感差异。
  //
  // 唯一还量不到的是**配平**：`minFit` / `spillPages` 要 `fit()`，而 `fit()` 要真 DOM。
  // 这两格必须**当场清掉**，否则上一次 build() 留下的读数会赖在摘要里，跟着旋钮一起骗人
  // （实测：先铺一本 6 张的密册配平 73%，再开对话框拧周数，那句「配平 73%」一字不动地
  // 跟着换册子）。丢周与超限那两格现在由 `planPapers()` 自己按这一册重算。
  updateSummary() {
    const base = Object.assign(this.defaultCfg(), this.readForm());
    const plan = this.planPapers(base).plan;
    this.minFit = null; this.spillPages = 0;
    const el = document.getElementById('sh-summary');
    // 缩减提示只说一次：summaryText 里那句对预览条同样适用，这里靠颜色标出来
    el.innerHTML = this.summaryText(plan, true);
    el.classList.toggle('is-capped', !!(this.capped || this.trimmed || this.overCap));
  },

  bind() {
    const overlay = document.getElementById('sheet-overlay');
    const hide = () => overlay.classList.remove('show');
    const el = id => document.getElementById(id);

    // 分段控件：一档一改，改完立刻重算摘要（周数被上限压掉要当场看得见）
    document.querySelectorAll('#sh-mode button, #sh-scope button').forEach(b => {
      b.addEventListener('click', () => {
        const key = b.closest('.seg').id === 'sh-mode' ? 'mode' : 'scope';
        this.cfg = Object.assign(this.cfg || this.defaultCfg(), { [key]: b.dataset.v });
        this._paintSeg('sh-mode', this.cfg.mode);
        this._paintSeg('sh-scope', this.cfg.scope);
        this.updateSummary();
      });
    });
    ['sh-from', 'sh-count', 'sh-toc'].forEach(id => {
      el(id).addEventListener('change', () => {
        this.cfg = Object.assign(this.cfg || this.defaultCfg(), this.readForm());
        this.updateSummary();
      });
    });

    el('btn-cancel-sheet').addEventListener('click', hide);
    el('btn-sheet-preview').addEventListener('click', () => {
      this.cfg = this.readForm(); hide(); this.preview();
    });
    el('btn-sheet-print').addEventListener('click', () => {
      this.cfg = this.readForm(); hide(); this.printNow();
    });
    overlay.addEventListener('click', e => { if (e.target === overlay) hide(); });

    el('btn-pv-close').addEventListener('click', () => this.close());
    el('btn-pv-reopen').addEventListener('click', () => this.openDialog());
    el('btn-pv-print').addEventListener('click', () => this.printNow());

    // 有人直接按 Cmd+P 绕过晒图按钮：堆栈还没铺就先铺一张本周，
    // 别让打印机出一叠白纸。
    window.addEventListener('beforeprint', () => {
      if (!document.getElementById('print-stack').children.length) { this.build(); return; }
      // 已经有纸面：光重新配平一次不够。字体后落地、窗口变宽导致换行、或者用户在
      // 预览里改过任务，都可能让某张纸高出它自己那份预算（_budgetFor：图框钉住
      // 之后随图框高走。第十二轮把除数换成 COMFORT_FLOOR 之后现数是周/人纸 1153px、
      // 目录纸 1163px；换之前是 1461 / 1503，旧算法是一个常数 1047÷0.66≈1586）
      // —— 这时压到 FIT_FLOOR 只是把墨迹硬塞回纸面，出纸机照旧多吐一张没图签的续页。
      // 该重排一次册，让它正式多一张纸（跟 preview() 里那条 fonts.ready 是同一个道理）。
      if (this.fit().spill) this.build();
    });
    window.addEventListener('resize', () => {
      if (document.body.classList.contains('sheet-preview')) this.viewFit();
    });
  },

  // ---- 离线 harness：?sheet&from=2026-W36&count=4&mode=persons ------
  fromUrl() {
    const q = new URLSearchParams(location.search);
    if (location.search.indexOf('sheet') === -1) return null;
    const cfg = this.defaultCfg();
    if (q.get('from')) cfg.from = q.get('from');
    if (q.get('count')) cfg.count = Math.min(this.MAX_COUNT, parseInt(q.get('count'), 10) || 1);
    if (q.get('mode')) cfg.mode = q.get('mode') === 'persons' ? 'persons' : 'weeks';
    if (q.get('scope')) cfg.scope = ['all', 'open', 'filtered'].indexOf(q.get('scope')) >= 0 ? q.get('scope') : 'all';
    if (q.get('toc')) cfg.toc = q.get('toc') !== '0';
    return cfg;
  },
};

// 页眉右侧那行小字：单周只写周，多周写区间
function suiteRangeLabel(plan) {
  if (plan.weeks.length <= 1) return 'WEEKLY SHEET';
  const a = WeekUtils.parseWeekStr(plan.first), b = WeekUtils.parseWeekStr(plan.last);
  return `SUITE ${a.year} W${a.week}–W${b.week}`;
}

// ======================================================================
// Editor — Card inline editing
// ======================================================================

const Editor = {
  currentCard: null,
  currentField: null,

  startEdit(el, card) {
    if (this.currentField) this.cancelEdit(false);
    this.currentCard = card;
    this.currentField = el;
    el.classList.add('editing');

    const taskId = card.dataset.taskId;
    const task = DataModel.state.tasks.find(t => t.id === taskId);
    if (!task) return;

    const field = el.dataset.field;
    const raw = task[field];

    if (field === 'priority') {
      const sel = this._makeSelect(C.PRIORITIES, raw);
      el.innerHTML = '';
      el.appendChild(sel);
      sel.focus();
      this._bindSelectEvents(sel, el, card);
      return;
    }

    if (field === 'status') {
      const sel = this._makeSelect(C.STATUSES, raw);
      el.innerHTML = '';
      el.appendChild(sel);
      sel.focus();
      this._bindSelectEvents(sel, el, card);
      return;
    }

    if (field === 'startDate' || field === 'dueDate') {
      const input = document.createElement('input');
      input.type = 'date';
      if (raw) input.value = raw;
      el.innerHTML = '';
      el.appendChild(input);
      this._bindInputEvents(input, el, card);
      input.focus();
      return;
    }

    // text field (name, notes)
    const input = document.createElement('input');
    input.type = 'text';
    input.value = raw || '';
    el.innerHTML = '';
    el.appendChild(input);
    this._bindInputEvents(input, el, card);
    input.focus();
    input.select();
  },

  _makeSelect(options, current) {
    const sel = document.createElement('select');
    options.forEach(o => {
      const opt = document.createElement('option');
      opt.value = o; opt.textContent = o;
      if (o === current) opt.selected = true;
      sel.appendChild(opt);
    });
    return sel;
  },

  _bindSelectEvents(sel, el, card) {
    sel.addEventListener('change', () => {
      this._commit(card, el, sel.value);
    });
    sel.addEventListener('blur', () => {
      setTimeout(() => {
        if (this.currentField === el) this._commit(card, el, sel.value);
      }, 100);
    });
    sel.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { e.preventDefault(); this.cancelEdit(); }
    });
  },

  _bindInputEvents(input, el, card) {
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        this._commit(card, el, input.value);
      } else if (e.key === 'Escape') {
        e.preventDefault();
        this.cancelEdit();
      }
    });
    input.addEventListener('blur', () => {
      setTimeout(() => {
        if (this.currentField === el) this._commit(card, el, input.value);
      }, 100);
    });
  },

  _commit(card, el, value) {
    if (this.currentField !== el) return;
    this.currentField = null;
    el.classList.remove('editing');

    const taskId = card.dataset.taskId;
    const field = el.dataset.field;
    const task = DataModel.state.tasks.find(t => t.id === taskId);
    if (!task) return;

    let parsed = value;
    if (field === 'progress') {
      parsed = parseInt(value, 10);
      if (isNaN(parsed)) parsed = 0;
      parsed = Math.max(0, Math.min(100, parsed));
    }

    if (parsed === task[field]) {
      Renderer.patchCard(card);
      return;
    }

    DataModel.updateField(taskId, field, parsed);

    // Re-fetch and patch
    const updated = DataModel.state.tasks.find(t => t.id === taskId);
    if (updated) {
      Renderer.patchCard(card);
      // Refresh column header count
      this._refreshColumnCount();
    }
  },

  // 尺寸标注线拖动：以 pointerdown 落点为基准做相对位移，
  // 保持手机端可微调（不跳变到触摸位置）。
  beginDrag(el, card, e) {
    if (this.currentField && this.currentField !== el) this.cancelEdit(false);
    const track = el.querySelector('.dim-track');
    const task = DataModel.state.tasks.find(t => t.id === card.dataset.taskId);
    if (!track || !task) return;

    this.currentCard = card;
    this.currentField = el;
    el.classList.add('editing', 'dragging');

    const startX = e.clientX;
    const startVal = task.progress;
    const span = Math.max(track.getBoundingClientRect().width, 24);
    let live = startVal;

    const onMove = (ev) => {
      ev.preventDefault();
      const next = Math.max(0, Math.min(100, Math.round(startVal + ((ev.clientX - startX) / span) * 100)));
      if (next !== live) {
        live = next;
        this._updateProgressBar(el, next);
      }
    };

    const stop = (ev) => {
      el.removeEventListener('pointermove', onMove);
      el.removeEventListener('pointerup', onUp);
      el.removeEventListener('pointercancel', onUp);
      if (el.hasPointerCapture && el.hasPointerCapture(ev.pointerId)) el.releasePointerCapture(ev.pointerId);
      el.classList.remove('editing', 'dragging');
      el._dragCleanup = null;
    };

    const onUp = (ev) => {
      stop(ev);
      this._commit(card, el, live);
    };

    // 指针已失效时 setPointerCapture 会抛错，不能让它中断监听绑定
    try { el.setPointerCapture(e.pointerId); } catch (err) {}
    el.addEventListener('pointermove', onMove);
    el.addEventListener('pointerup', onUp);
    el.addEventListener('pointercancel', onUp);

    el._dragCleanup = () => stop(e);
  },

  _updateProgressBar(el, pct) {
    const fill = el.querySelector('.dim-fill');
    const thumb = el.querySelector('.dim-thumb');
    const val = el.querySelector('.dim-val');
    if (fill) fill.style.width = pct + '%';
    if (thumb) thumb.style.left = pct + '%';
    if (val) val.innerHTML = pct + '<i>%</i>';
    el.dataset.level = Renderer._progressLevel(pct);
    el.title = `拖动调整进度，当前 ${pct}%`;
  },

  cancelEdit(restore = true) {
    if (!this.currentField) return;
    const el = this.currentField;
    const card = this.currentCard;
    // Clean up drag listeners if this was a progress bar
    if (el._dragCleanup) {
      el._dragCleanup();
      el._dragCleanup = null;
    }
    this.currentField = null;
    this.currentCard = null;
    this._dragTaskId = null;
    el.classList.remove('editing');
    if (restore && card) {
      Renderer.patchCard(card);
    }
  },

  _refreshColumnCount() {
    const weekStr = DataModel.state.currentWeek;
    C.MEMBERS.forEach((person, i) => {
      const tasks = FilterState.apply(DataModel.getTasksByPerson(weekStr, person));
      const done = tasks.filter(t => t.status === '已完成').length;
      const rate = tasks.length > 0 ? Math.round(done / tasks.length * 100) : 0;
      const header = document.querySelector(`#column-${i} .column-header`);
      if (header) {
        const countEl = header.querySelector('.task-count');
        if (countEl) countEl.innerHTML = `${tasks.length}<i>项</i>`;
        const subEl = header.querySelector('.ph-sub');
        if (subEl) subEl.innerHTML = `完成 <b>${done}</b> · ${rate}%`;
      }
      const body = document.getElementById(`col-body-${i}`);
      if (body) body.classList.toggle('empty', tasks.length === 0);
    });
    Renderer.renderStats(weekStr);
  },
};
