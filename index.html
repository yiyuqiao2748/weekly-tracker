    if (notesEl) notesEl.innerHTML = task.notes ? esc(task.notes) : '<span class="placeholder">备注 / NOTES</span>';

    // 修订徽标和修订表也要跟着这次编辑更新，否则 REV 计数会停在旧值
    const hist = task.history || [];
    const slot = card.querySelector('.rev-slot');
    if (slot) slot.innerHTML = this._revChips(hist.length, card.classList.contains('is-new') ? 'new' : '');
    const table = card.querySelector('.rev-table');
    if (table) table.outerHTML = this._revTable(hist);
  },
};

// ======================================================================
// SheetSet — 出图：多周连排 / 按人分册 / 图纸目录
// 一张纸 = 一个 .sheet-page，全部先铺进 #print-stack，打印时只露这个容器。
// 卡片与分栏的 markup 一律复用 Renderer 的私有渲染函数，出图与看板同源，
// 否则「屏上好看、纸上走样」会一直修不完。
// ======================================================================
const SheetSet = {
  MAX_COUNT: 8,
  // 按人成册时页数 = 周数 × 人数，给个上限免得一次打出一本书
  MAX_PAGES: 16,
  CODE: 'WTP',
  cfg: null,

  defaultCfg() {
    return { from: DataModel.state.currentWeek, count: 1, mode: 'weeks', scope: 'all', toc: true };
  },

  // 截止周的下拉：有数据的周 + 本周往前 7 周（空周也要能选，连排时它是「本周没排」的证据）
  weekOptions() {
    const set = new Set(DataModel.state.tasks.map(t => t.week));
    const now = DataModel.state.currentWeek;
    set.add(now);
    for (let i = 1; i < this.MAX_COUNT; i++) set.add(WeekUtils.addWeeks(now, -i));
    return Array.from(set)
      .filter(w => WeekUtils.parseWeekStr(w))
      .sort()
      .reverse();
  },

  // 从 from 往回数 count 周，旧→新排列：读图顺序就是进度推进方向
  weeks(cfg) {
    const list = [];
    for (let i = cfg.count - 1; i >= 0; i--) list.push(WeekUtils.addWeeks(cfg.from, -i));
    return list;
  },

  // 收录范围：全部 / 只出未完成 / 沿用看板当前筛选
  tasksFor(week, person, cfg) {
    let tasks = DataModel.getTasksByPerson(week, person);
    if (cfg.scope === 'open') tasks = tasks.filter(t => t.status !== '已完成');
    else if (cfg.scope === 'filtered') tasks = FilterState.apply(tasks);
    return tasks;
  },

  // 请求周数 → 实际周数（受 MAX_PAGES 约束）。上限之内返回 capped=false。
  clampCount(want, mode) {
    const perWeek = mode === 'persons' ? C.MEMBERS.length : 1;
    const room = Math.max(1, Math.floor((this.MAX_PAGES - 1) / perWeek));
    const n = Math.max(1, Math.min(this.MAX_COUNT, want, room));
    return { count: n, capped: n < want };
  },

  // 排纸：按周连排保留每个请求周（空周也是「本周没排」的证据）；
  // 按人成册则跳过那人那周的空页，不出一张白纸。
  plan(cfg) {
    const weeks = this.weeks(cfg);
    const sheets = [];
    if (cfg.mode === 'weeks') {
      weeks.forEach(w => sheets.push({ kind: 'week', week: w }));
    } else {
      // 按人成册：一个人先把几周排完再换下一个人 —— 装订时是一卷一卷的，
      // 目录读下来是「易榆乔 W37 → W38」而不是四个人交错。空的那人那周不出白纸。
      C.MEMBERS.forEach(p => {
        weeks.forEach(w => {
          const tasks = this.tasksFor(w, p, cfg);
          if (!tasks.length) return;
          sheets.push({ kind: 'person', week: w, person: p, tasks });
        });
      });
    }
    const withToc = !!cfg.toc && sheets.length > 1;
    sheets.forEach((s, i) => { s.no = i + 1; });
    return {
      cfg, weeks, sheets, withToc,
      total: sheets.length + (withToc ? 1 : 0),
      first: weeks[0], last: weeks[weeks.length - 1],
    };
  },

  setCode(week) { return this.CODE + '-' + week; },

  // 整套图的图册号：单周不写区间，多周写成 W36–W39
  suiteCode(plan) {
    if (plan.first === plan.last) return this.CODE + '-' + plan.first;
    const p = w => WeekUtils.parseWeekStr(w);
    const a = p(plan.first), b = p(plan.last);
    const prefix = this.CODE + '-' + a.year + '-W';
    return a.year === b.year
      ? prefix + a.week + '–' + b.week
      : prefix + a.week + ' – ' + this.CODE + '-' + plan.last;
  },

  weekLabel(weekStr) {
    const p = WeekUtils.parseWeekStr(weekStr);
    return p ? `${p.year}年第${p.week}周` : weekStr;
  },

  // 纸面「周期」格：单周写本周（周一 — 周日），多周写整册的头尾（09.07 — 10.04）
  suiteRange(plan) {
    const p = n => String(n).padStart(2, '0');
    const f = d => p(d.getMonth() + 1) + '.' + p(d.getDate());
    if (plan.weeks.length <= 1) return WeekUtils.formatDimRange(plan.first);
    return f(WeekUtils.getWeekDateRange(plan.first).start) + ' — ' + f(WeekUtils.getWeekDateRange(plan.last).end);
  },

  // ---- 纸面零件 ----------------------------------------------------

  _tbCells(plan, sheet) {
    const now = new Date();
    const pad = n => String(n).padStart(2, '0');
    const cells = [
      { k: '部门', v: '效果图部门', zh: 1 },
      { k: '图名', v: sheet.title, zh: 1, grow: 1 },
      // 周期一格写这张纸自己的那一周；只有目录页写整册的头尾
      { k: '周期', v: sheet.period || WeekUtils.formatDimRange(sheet.week) },
      { k: '图号', v: sheet.code },
    ];
    if (sheet.vol) cells.push({ k: '册', v: sheet.vol });
    cells.push({ k: '张次', v: sheet.toc ? 'INDEX' : `SHT ${pad(sheet.no)}/${pad(plan.total)}` });
    cells.push({ k: '签发', v: `${now.getFullYear()}.${pad(now.getMonth() + 1)}.${pad(now.getDate())}` });
    cells.push({ k: '比例', v: 'NTS' });
    cells.push({ k: '版次', v: 'R1' });
    cells.push({ k: '制图', v: sheet.people, zh: 1 });
    return `<div class="tb">` + cells.map(c =>
      `<div class="tb-cell${c.grow ? ' grow' : ''}"><span class="anno">${c.k}</span>` +
      `<span class="tb-val${c.zh ? ' zh' : ''}">${esc(c.v)}</span></div>`).join('') + `</div>`;
  },

  _head(sheet, plan) {
    return `<div class="sheet-head">
      <div>
        <div class="sh-title">${esc(sheet.title)}</div>
        <div class="sh-sub">效果图部门 · 周任务进度表 · ${esc(sheet.code)}${sheet.vol ? ' · ' + esc(sheet.vol) : ''}</div>
      </div>
      <div class="sh-right"><span>${esc(suiteRangeLabel(plan))}</span><b>${sheet.toc ? '目录' : `第 ${String(sheet.no).padStart(2, '0')} / ${String(plan.total).padStart(2, '0')} 张`}</b></div>
    </div>`;
  },

  // 纸面上的图签统计条：与 #stats-bar 同一套 class，口径换成出图范围
  _stats(week, onlyPerson, cfg) {
    const names = onlyPerson ? [onlyPerson] : C.MEMBERS;
    const groups = names.map(p => ({ p, tasks: this.tasksFor(week, p, cfg) }));
    let all = [];
    groups.forEach(g => { all = all.concat(g.tasks); });
    const total = all.length;
    const done = all.filter(t => t.status === '已完成').length;
    const rate = total > 0 ? Math.round(done / total * 100) : 0;
    const lvl = rate >= 80 ? 'is-good' : rate >= 50 ? 'is-warn' : 'is-bad';
    let html = `<div class="stat-bar">`;
    html += `<div class="stat-cell"><span class="anno">任务总数</span><span class="stat-value">${total}</span></div>`;
    html += `<div class="stat-cell"><span class="anno">已完成</span><span class="stat-value">${done}<em>/${total}</em></span></div>`;
    html += `<div class="stat-cell wide"><span class="anno">完成率</span><span class="stat-value ${lvl}">${rate}<em>%</em></span><span class="rate-track ${lvl}"><i style="width:${rate}%"></i></span></div>`;
    groups.forEach(g => {
      const i = C.MEMBERS.indexOf(g.p);
      const d = g.tasks.filter(t => t.status === '已完成').length;
      const r = g.tasks.length ? Math.round(d / g.tasks.length * 100) : 0;
      html += `<div class="stat-person">
        <div class="sp-top"><span class="stat-dot ${C.DOT_CLASSES[i]}"></span><span class="sp-name">${esc(g.p)}</span><span class="sp-num"><b>${d}</b>/${g.tasks.length}</span></div>
        <div class="sp-bar"><i style="width:${r}%"></i></div>
      </div>`;
    });
    html += `<div class="stat-legend"><span class="lg-not">未开始</span><span class="lg-prog">进行中</span><span class="lg-done">已完成</span></div>`;
    return html + `</div>`;
  },

  _weekSheet(sheet, plan, cfg) {
    const load = Renderer._weekLoad(sheet.week);
    const delta = Renderer._weekDelta(sheet.week);
    const cols = C.MEMBERS.map((p, i) =>
      Renderer._renderColumn(p, this.tasksFor(sheet.week, p, cfg), load, delta,
        { divLabel: `分图 ${String(i + 1).padStart(2, '0')}`, idSuffix: `-s${sheet.no}` })
    ).join('');
    // 列头那串负荷迷你格始终按全部任务计数 —— 它是这个人的历史节律，
    // 不该被「只出未完成」这类出图范围改动含义。
    const meta = {
      week: sheet.week, no: sheet.no,
      title: this.weekLabel(sheet.week) + ' 任务进度表',
      code: this.setCode(sheet.week),
      people: C.MEMBERS.join(' · '),
    };
    return this._head(meta, plan)
      + this._stats(sheet.week, null, cfg)
      + `<div class="sheet-board">${cols}</div>`
      + this._tbCells(plan, meta);
  },

  _personSheet(sheet, plan, cfg) {
    const idx = C.MEMBERS.indexOf(sheet.person) + 1;
    const vol = `VOL ${String(idx).padStart(2, '0')} · ${sheet.person}`;
    const title = `${sheet.person} · ${this.weekLabel(sheet.week)} 任务进度表`;
    const code = `${this.setCode(sheet.week)}-${String(idx).padStart(2, '0')}`;
    const delta = Renderer._weekDelta(sheet.week);
    const cards = sheet.tasks.map((t, n) =>
      Renderer._renderCard(t, n, delta.get(DataModel.weekKey(t)))).join('');
    const meta = { week: sheet.week, no: sheet.no, title, code, vol, people: sheet.person };
    return this._head(meta, plan)
      + this._stats(sheet.week, sheet.person, cfg)
      + `<div class="sheet-flow${sheet.tasks.length > 5 ? '' : ' sparse'}">${cards}</div>`
      + this._tbCells(plan, meta);
  },

  _tocSheet(plan, cfg) {
    let prevVol = 0;
    const rows = plan.sheets.map(s => {
      const tasks = s.kind === 'week'
        ? C.MEMBERS.reduce((a, p) => a.concat(this.tasksFor(s.week, p, cfg)), [])
        : s.tasks;
      const done = tasks.filter(t => t.status === '已完成').length;
      const rate = tasks.length ? Math.round(done / tasks.length * 100) : 0;
      const vn = s.kind === 'person' ? C.MEMBERS.indexOf(s.person) + 1 : 0;
      // 成册时给每卷开头一道加重横线，目录上能看出「这里换了一卷」
      const brk = cfg.mode === 'persons' && vn !== prevVol;
      prevVol = vn;
      const meta = s.kind === 'week'
        ? { title: this.weekLabel(s.week), code: this.setCode(s.week), vol: '—', people: tasks.length }
        : { title: `${s.person} · ${this.weekLabel(s.week)}`, code: `${this.setCode(s.week)}-${String(vn).padStart(2, '0')}`, vol: `VOL ${String(vn).padStart(2, '0')}`, people: tasks.length };
      return `<tr${brk ? ' class="vol-break"' : ''}>
        <td class="num">${String(s.no).padStart(2, '0')}</td>
        <td>${esc(meta.code)}</td>
        <td class="zh">${esc(meta.title)}</td>
        <td>${esc(WeekUtils.formatDimRange(s.week))}</td>
        <td>${esc(meta.vol)}</td>
        <td class="num">${meta.people}</td>
        <td class="num">${done}</td>
        <td class="num">${rate}%</td>
      </tr>`;
    }).join('');
    let all = [];
    plan.sheets.forEach(s => {
      all = all.concat(s.kind === 'week'
        ? C.MEMBERS.reduce((a, p) => a.concat(this.tasksFor(s.week, p, cfg)), [])
        : s.tasks);
    });
    // 一张任务只属于一个人 + 一周，各页之间天然不重不漏，直接计数
    const total = all.length;
    const done = all.filter(t => t.status === '已完成').length;
    const scope = { all: '全部任务', open: '只出未完成', filtered: '沿用看板当前筛选' }[cfg.scope];
    const order = cfg.mode === 'persons'
      ? '按人成册，每人一卷（VOL），卷内按周从旧到新；当周没有排任务的人不出空卷。'
      : '按周连排，一人一张分图（四人四张），排空的周也保留一张，作为「本周没排」的证据。';
    const note = `<div class="toc-note">本册 ${plan.weeks.length} 周（${esc(this.weekLabel(plan.first))} 至 ${esc(this.weekLabel(plan.last))}），`
      + `共 ${plan.total} 张 A3 横排，收录范围：${esc(scope)}。${esc(order)}<br>`
      + `合计 ${total} 项、已完成 ${done} 项；同一条任务在相邻两周各记一次，按周分别计数。<br>`
      + `数据截至 ${esc(new Date().toLocaleString('zh-CN', { hour12: false }))}，来源为云端 Gist 与本机缓存合并后的结果。</div>`;
    const meta = {
      week: plan.last, no: 0, toc: true, period: this.suiteRange(plan),
      title: '图纸目录 · Drawing Index',
      code: this.suiteCode(plan),
      people: C.MEMBERS.join(' · '),
    };
    return this._head(meta, plan)
      + `<div class="toc"><table>
          <thead><tr><th class="num">张次</th><th>图号</th><th>图名</th><th>周期</th><th>册</th><th class="num">任务</th><th class="num">完成</th><th class="num">率</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>${note}</div>`
      + this._tbCells(plan, Object.assign({}, meta, { title: '周任务进度表 · 图纸目录' }));
  },

  // ---- 铺纸 / 预览 / 出纸 -------------------------------------------

  build(cfg) {
    this.cfg = Object.assign(this.defaultCfg(), cfg || this.cfg || {});
    const clamped = this.clampCount(this.cfg.count, this.cfg.mode);
    this.capped = clamped.capped;
    // 被上限压掉的是「这次排纸用几周」，不是「用户要几周」：this.cfg 保持原值，
    // 否则重开对话框时周数下拉会自己变成压完的 3，用户看着像被吞了一次输入。
    const plan = this.plan(Object.assign({}, this.cfg, { count: clamped.count }));
    this.lastPlan = plan;
    // 纸（.sheet-paper，屏上带边带影、纸上只管分页）包着画布（.sheet-page，
    // 固定 1512×1047 = A3 可印区），配平缩放发生在画布这一层。
    const page = s => `<div class="sheet-paper"><div class="sheet-page">${s}</div></div>`;
    const html = [];
    if (plan.withToc) html.push(page(this._tocSheet(plan, this.cfg)));
    plan.sheets.forEach(s => {
      html.push(page(s.kind === 'week'
        ? this._weekSheet(s, plan, this.cfg)
        : this._personSheet(s, plan, this.cfg)));
    });
    document.getElementById('print-stack').innerHTML = html.join('');
    this.fit();
    return plan;
  },

  // 配平：纸面按 1512 宽排版后量自然高度，缩到装得进 A3 短边。
  // transform 不改变盒子占位，所以纸的占位高度要自己写回 --nat，否则纸叠纸。
  // 压到 FIT_FLOOR 就不再压 —— 宁可让它续一张纸，也不印出读不得的小字。
  A3_H: 1047,
  FIT_FLOOR: .66,
  fit() {
    const H = this.A3_H;
    let worst = 1, spill = 0;
    document.querySelectorAll('#print-stack .sheet-paper').forEach(paper => {
      const page = paper.querySelector('.sheet-page');
      const h = page.scrollHeight;
      const fc = h > H ? Math.max(this.FIT_FLOOR, H / h) : 1;
      paper.style.setProperty('--fc', fc.toFixed(4));
      paper.style.setProperty('--nat', Math.max(H, h) + 'px');
      paper.classList.toggle('is-spill', h * fc > H + 1);
      worst = Math.min(worst, fc);
      if (h * fc > H + 1) spill++;
    });
    this.minFit = worst;
    this.spillPages = spill;
    return { worst, spill };
  },

  // 屏上适配：整叠纸按窗口宽等比缩小。这个值只影响预览，不参与出纸
  // （@media print 里的 --fit 只认 --fc），所以 1512 基准与纸面一一对应。
  viewFit() {
    const w = Math.min(window.innerWidth, document.documentElement.clientWidth || window.innerWidth);
    const fv = Math.max(.2, Math.min(1, (w - 44) / 1512));
    document.getElementById('print-stack').style.setProperty('--fv', fv.toFixed(4));
    return fv;
  },

  preview(cfg) {
    const plan = this.build(cfg);
    document.body.classList.add('sheet-preview');
    this.viewFit();
    document.getElementById('pv-set').textContent = this.summaryText(plan, false);
    // 思源宋体是后到的，字一换行高就变；字体落地后重新配平一次
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(() => {
        this.fit();
        document.getElementById('pv-set').textContent = this.summaryText(plan, false);
      });
    }
    return plan;
  },

  close() {
    document.body.classList.remove('sheet-preview');
  },

  // 「晒图」= 直接出纸。标题临时换成图册号，另存为 PDF 时文件名就是图号。
  printNow() {
    const plan = this.build();
    const keep = document.title;
    document.title = plan.sheets.length > 1 ? this.suiteCode(plan) : (plan.sheets[0] ? this.setCode(plan.sheets[0].week) : keep);
    document.getElementById('pv-set').textContent = this.summaryText(plan, false);
    window.print();
    setTimeout(() => { document.title = keep; }, 400);
    return plan;
  },

  summaryText(plan, withRange) {
    const cfg = plan.cfg;
    const bits = [`${plan.total} 张`, 'A3 横排', this.suiteCode(plan)];
    if (cfg.mode === 'persons') bits.push('按人成册');
    if (cfg.scope === 'open') bits.push('只出未完成');
    if (cfg.scope === 'filtered') bits.push('沿用当前筛选');
    if (this.capped) bits.push(`周数已压到 ${cfg.count}（上限 ${this.MAX_PAGES} 张）`);
    if (this.minFit != null && this.minFit < .999) bits.push(`配平 ${Math.round(this.minFit * 100)}%`);
    if (this.spillPages) bits.push(`${this.spillPages} 张压到下限仍超纸面 · 出纸会续页`);
    return bits.join(' · ');
  },

  // ---- 对话框 -------------------------------------------------------

  openDialog() {
    if (!this.cfg) this.cfg = this.defaultCfg();
    const opts = this.weekOptions();
    if (opts.indexOf(this.cfg.from) === -1) this.cfg.from = opts[0];
    const sel = document.getElementById('sh-from');
    sel.innerHTML = opts.map(w =>
      `<option value="${esc(w)}"${w === this.cfg.from ? ' selected' : ''}>${esc(this.weekLabel(w))}${WeekUtils.isCurrentWeek(w) ? ' · 本周' : ''}</option>`).join('');
    const cnt = document.getElementById('sh-count');
    cnt.innerHTML = '';
    for (let i = 1; i <= this.MAX_COUNT; i++) {
      const o = document.createElement('option');
      o.value = String(i); o.textContent = i === 1 ? '1 周（单张）' : i + ' 周';
      if (i === this.cfg.count) o.selected = true;
      cnt.appendChild(o);
    }
    this._paintSeg('sh-mode', this.cfg.mode);
    this._paintSeg('sh-scope', this.cfg.scope);
    document.getElementById('sh-toc').checked = !!this.cfg.toc;
    this.updateSummary();
    document.getElementById('sheet-overlay').classList.add('show');
    document.getElementById('sh-from').focus();
  },

  _paintSeg(id, v) {
    document.querySelectorAll(`#${id} button`).forEach(b => b.classList.toggle('on', b.dataset.v === v));
  },

  readForm() {
    const on = id => { const b = document.querySelector('#' + id + ' button.on'); return b ? b.dataset.v : null; };
    return {
      from: document.getElementById('sh-from').value,
      count: parseInt(document.getElementById('sh-count').value, 10) || 1,
      mode: on('sh-mode') || 'weeks',
      scope: on('sh-scope') || 'all',
      toc: document.getElementById('sh-toc').checked,
    };
  },

  // 摘要要按「真会打出来的那个计划」算：先套上限再排纸，
  // 否则会出现「摘要说 21 张、实际只出 12 张」这种对不上的数字。
  updateSummary() {
    const base = Object.assign(this.defaultCfg(), this.readForm());
    const clamped = this.clampCount(base.count, base.mode);
    base.count = clamped.count;
    this.capped = clamped.capped;
    const plan = this.plan(base);
    const el = document.getElementById('sh-summary');
    // 缩减提示只说一次：summaryText 里那句对预览条同样适用，这里靠颜色标出来
    el.innerHTML = this.summaryText(plan, true);
    el.classList.toggle('is-capped', !!this.capped);
  },

  bind() {
    const overlay = document.getElementById('sheet-overlay');
    const hide = () => overlay.classList.remove('show');
    const el = id => document.getElementById(id);

    // 分段控件：一档一改，改完立刻重算摘要（周数被上限压掉要当场看得见）
    document.querySelectorAll('#sh-mode button, #sh-scope button').forEach(b => {
      b.addEventListener('click', () => {
        const key = b.closest('.seg').id === 'sh-mode' ? 'mode' : 'scope';
        this.cfg = Object.assign(this.cfg || this.defaultCfg(), { [key]: b.dataset.v });
        this._paintSeg('sh-mode', this.cfg.mode);
        this._paintSeg('sh-scope', this.cfg.scope);
        this.updateSummary();
      });
    });
    ['sh-from', 'sh-count', 'sh-toc'].forEach(id => {
      el(id).addEventListener('change', () => {
        this.cfg = Object.assign(this.cfg || this.defaultCfg(), this.readForm());
        this.updateSummary();
      });
    });

    el('btn-cancel-sheet').addEventListener('click', hide);
    el('btn-sheet-preview').addEventListener('click', () => {
      this.cfg = this.readForm(); hide(); this.preview();
    });
    el('btn-sheet-print').addEventListener('click', () => {
      this.cfg = this.readForm(); hide(); this.printNow();
    });
    overlay.addEventListener('click', e => { if (e.target === overlay) hide(); });

    el('btn-pv-close').addEventListener('click', () => this.close());
    el('btn-pv-reopen').addEventListener('click', () => this.openDialog());
    el('btn-pv-print').addEventListener('click', () => this.printNow());

    // 有人直接按 Cmd+P 绕过晒图按钮：堆栈还没铺就先铺一张本周，
    // 别让打印机出一叠白纸。
    window.addEventListener('beforeprint', () => {
      if (!document.getElementById('print-stack').children.length) this.build();
      else this.fit();
    });
    window.addEventListener('resize', () => {
      if (document.body.classList.contains('sheet-preview')) this.viewFit();
    });
  },

  // ---- 离线 harness：?sheet&from=2026-W36&count=4&mode=persons ------
  fromUrl() {
    const q = new URLSearchParams(location.search);
    if (location.search.indexOf('sheet') === -1) return null;
    const cfg = this.defaultCfg();
    if (q.get('from')) cfg.from = q.get('from');
    if (q.get('count')) cfg.count = Math.min(this.MAX_COUNT, parseInt(q.get('count'), 10) || 1);
    if (q.get('mode')) cfg.mode = q.get('mode') === 'persons' ? 'persons' : 'weeks';
    if (q.get('scope')) cfg.scope = ['all', 'open', 'filtered'].indexOf(q.get('scope')) >= 0 ? q.get('scope') : 'all';
    if (q.get('toc')) cfg.toc = q.get('toc') !== '0';
    return cfg;
  },
};

// 页眉右侧那行小字：单周只写周，多周写区间
function suiteRangeLabel(plan) {
  if (plan.weeks.length <= 1) return 'WEEKLY SHEET';
  const a = WeekUtils.parseWeekStr(plan.first), b = WeekUtils.parseWeekStr(plan.last);
  return `SUITE ${a.year} W${a.week}–W${b.week}`;
}

// ======================================================================
// Editor — Card inline editing
// ======================================================================

const Editor = {
  currentCard: null,
  currentField: null,

  startEdit(el, card) {
    if (this.currentField) this.cancelEdit(false);
    this.currentCard = card;
    this.currentField = el;
    el.classList.add('editing');

    const taskId = card.dataset.taskId;
    const task = DataModel.state.tasks.find(t => t.id === taskId);
    if (!task) return;

    const field = el.dataset.field;
    const raw = task[field];

    if (field === 'priority') {
      const sel = this._makeSelect(C.PRIORITIES, raw);
      el.innerHTML = '';
      el.appendChild(sel);
      sel.focus();
      this._bindSelectEvents(sel, el, card);
      return;
    }

    if (field === 'status') {
      const sel = this._makeSelect(C.STATUSES, raw);
      el.innerHTML = '';
      el.appendChild(sel);
      sel.focus();
      this._bindSelectEvents(sel, el, card);
      return;
    }

    if (field === 'startDate' || field === 'dueDate') {
      const input = document.createElement('input');
      input.type = 'date';
      if (raw) input.value = raw;
      el.innerHTML = '';
      el.appendChild(input);
      this._bindInputEvents(input, el, card);
      input.focus();
      return;
    }

    // text field (name, notes)
    const input = document.createElement('input');
    input.type = 'text';
    input.value = raw || '';
    el.innerHTML = '';
    el.appendChild(input);
    this._bindInputEvents(input, el, card);
    input.focus();
    input.select();
  },

  _makeSelect(options, current) {
    const sel = document.createElement('select');
    options.forEach(o => {
      const opt = document.createElement('option');
      opt.value = o; opt.textContent = o;
      if (o === current) opt.selected = true;
      sel.appendChild(opt);
    });
    return sel;
  },

  _bindSelectEvents(sel, el, card) {
    sel.addEventListener('change', () => {
      this._commit(card, el, sel.value);
    });
    sel.addEventListener('blur', () => {
      setTimeout(() => {
        if (this.currentField === el) this._commit(card, el, sel.value);
      }, 100);
    });
    sel.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { e.preventDefault(); this.cancelEdit(); }
    });
  },

  _bindInputEvents(input, el, card) {
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        this._commit(card, el, input.value);
      } else if (e.key === 'Escape') {
        e.preventDefault();
        this.cancelEdit();
      }
    });
    input.addEventListener('blur', () => {
      setTimeout(() => {
        if (this.currentField === el) this._commit(card, el, input.value);
      }, 100);
    });
  },

  _commit(card, el, value) {
    if (this.currentField !== el) return;
    this.currentField = null;
    el.classList.remove('editing');

    const taskId = card.dataset.taskId;
    const field = el.dataset.field;
    const task = DataModel.state.tasks.find(t => t.id === taskId);
    if (!task) return;

    let parsed = value;
    if (field === 'progress') {
      parsed = parseInt(value, 10);
      if (isNaN(parsed)) parsed = 0;
      parsed = Math.max(0, Math.min(100, parsed));
    }

    if (parsed === task[field]) {
      Renderer.patchCard(card);
      return;
    }

    DataModel.updateField(taskId, field, parsed);

    // Re-fetch and patch
    const updated = DataModel.state.tasks.find(t => t.id === taskId);
    if (updated) {
      Renderer.patchCard(card);
      // Refresh column header count
      this._refreshColumnCount();
    }
  },

  // 尺寸标注线拖动：以 pointerdown 落点为基准做相对位移，
  // 保持手机端可微调（不跳变到触摸位置）。
  beginDrag(el, card, e) {
    if (this.currentField && this.currentField !== el) this.cancelEdit(false);
    const track = el.querySelector('.dim-track');
    const task = DataModel.state.tasks.find(t => t.id === card.dataset.taskId);
    if (!track || !task) return;

    this.currentCard = card;
    this.currentField = el;
    el.classList.add('editing', 'dragging');

    const startX = e.clientX;
    const startVal = task.progress;
    const span = Math.max(track.getBoundingClientRect().width, 24);
    let live = startVal;

    const onMove = (ev) => {
      ev.preventDefault();
      const next = Math.max(0, Math.min(100, Math.round(startVal + ((ev.clientX - startX) / span) * 100)));
      if (next !== live) {
        live = next;
        this._updateProgressBar(el, next);
      }
    };

    const stop = (ev) => {
      el.removeEventListener('pointermove', onMove);
      el.removeEventListener('pointerup', onUp);
      el.removeEventListener('pointercancel', onUp);
      if (el.hasPointerCapture && el.hasPointerCapture(ev.pointerId)) el.releasePointerCapture(ev.pointerId);
      el.classList.remove('editing', 'dragging');
      el._dragCleanup = null;
    };

    const onUp = (ev) => {
      stop(ev);
      this._commit(card, el, live);
    };

    // 指针已失效时 setPointerCapture 会抛错，不能让它中断监听绑定
    try { el.setPointerCapture(e.pointerId); } catch (err) {}
    el.addEventListener('pointermove', onMove);
    el.addEventListener('pointerup', onUp);
    el.addEventListener('pointercancel', onUp);

    el._dragCleanup = () => stop(e);
  },

  _updateProgressBar(el, pct) {
    const fill = el.querySelector('.dim-fill');
    const thumb = el.querySelector('.dim-thumb');
    const val = el.querySelector('.dim-val');
    if (fill) fill.style.width = pct + '%';
    if (thumb) thumb.style.left = pct + '%';
    if (val) val.innerHTML = pct + '<i>%</i>';
    el.dataset.level = Renderer._progressLevel(pct);
    el.title = `拖动调整进度，当前 ${pct}%`;
  },

  cancelEdit(restore = true) {
    if (!this.currentField) return;
    const el = this.currentField;
    const card = this.currentCard;
    // Clean up drag listeners if this was a progress bar
    if (el._dragCleanup) {
      el._dragCleanup();
      el._dragCleanup = null;
    }
    this.currentField = null;
    this.currentCard = null;
    this._dragTaskId = null;
    el.classList.remove('editing');
    if (restore && card) {
      Renderer.patchCard(card);
    }
  },

  _refreshColumnCount() {
    const weekStr = DataModel.state.currentWeek;
    C.MEMBERS.forEach((person, i) => {
      const tasks = FilterState.apply(DataModel.getTasksByPerson(weekStr, person));
      const done = tasks.filter(t => t.status === '已完成').length;
      const rate = tasks.length > 0 ? Math.round(done / tasks.length * 100) : 0;
      const header = document.querySelector(`#column-${i} .column-header`);
      if (header) {
        const countEl = header.querySelector('.task-count');
        if (countEl) countEl.innerHTML = `${tasks.length}<i>项</i>`;
        const subEl = header.querySelector('.ph-sub');
        if (subEl) subEl.innerHTML = `完成 <b>${done}</b> · ${rate}%`;
      }
      const body = document.getElementById(`col-body-${i}`);
      if (body) body.classList.toggle('empty', tasks.length === 0);
    });
    Renderer.renderStats(weekStr);
  },
};

// ======================================================================
// Actions
// ======================================================================
const Actions = {
  previousWeek() {
    DataModel.state.currentWeek = WeekUtils.addWeeks(DataModel.state.currentWeek, -1);
    Storage.save(DataModel.state);
    Renderer.renderAll(DataModel.state.currentWeek);
  },

  nextWeek() {
    DataModel.state.currentWeek = WeekUtils.addWeeks(DataModel.state.currentWeek, 1);
    Storage.save(DataModel.state);
    Renderer.renderAll(DataModel.state.currentWeek);
  },

  goToToday() {
    const now = WeekUtils.getISOWeek(new Date());
    DataModel.state.currentWeek = WeekUtils.formatWeekStr(now.year, now.week);
    Storage.save(DataModel.state);
    Renderer.renderAll(DataModel.state.currentWeek);
  },

  addTask(person) {
    UndoStack.push('新增任务');
    const task = DataModel.addTask(DataModel.state.currentWeek, person);
    Renderer.renderAll(DataModel.state.currentWeek);
    // Start editing the new card's name field
    setTimeout(() => {
      const card = document.querySelector(`.task-card[data-task-id="${task.id}"]`);
      if (card) {
        const nameEl = card.querySelector('[data-field="name"]');
        if (nameEl) Editor.startEdit(nameEl, card);
      }
    }, 100);
  },

  deleteTask(taskId) {
    const idx = DataModel.state.tasks.findIndex(t => t.id === taskId);
    if (idx === -1) return;
    UndoStack.push('删除任务');
    const deleted = DataModel.state.tasks.splice(idx, 1)[0];
    DataModel.tombstone([deleted.id]);
    DataModel._save();
    Renderer.renderAll(DataModel.state.currentWeek);
    // Toast 上的撤销只把这一条放回去；走 UndoStack.undo 会连带吞掉删除之后的编辑
    Toast.showUndo(`已删除「${deleted.name || '未命名任务'}」`, () => this.undelete(deleted, idx), 8000);
  },

  undelete(task, idx) {
    if (DataModel.state.tasks.some(t => t.id === task.id)) return;
    DataModel.untombstone(task.id);   // 墓碑不清掉，下次合并它又被云端抹掉
    // 墓碑可能已经传上云了：把 updatedAt 顶到删除之后，merge 才会认这次恢复
    task.updatedAt = new Date().toISOString();
    DataModel.state.tasks.splice(Math.min(idx, DataModel.state.tasks.length), 0, task);
    DataModel._save();
    Renderer.renderAll(DataModel.state.currentWeek, true);
    Toast.show(`已恢复「${task.name || '未命名任务'}」`);
  },

  copyFromPrev() {
    UndoStack.push('复制上周未完成');
    const { copies, skipped } = DataModel.copyIncompleteFromPrev(DataModel.state.currentWeek);
    if (copies.length === 0) {
      UndoStack.discard();
      Toast.show(skipped > 0 ? `上周未完成任务本周已存在` : '上周没有未完成的任务');
      return;
    }
    Renderer.renderAll(DataModel.state.currentWeek);
    const ids = copies.map(c => c.id);
    Toast.showUndo(`已复制 ${copies.length} 个未完成任务`, () => this.uncopy(ids), 8000);
  },

  uncopy(ids) {
    const set = new Set(ids);
    DataModel.state.tasks = DataModel.state.tasks.filter(t => !set.has(t.id));
    DataModel.tombstone(ids);   // 复制出去的这几条可能已经上云了
    DataModel._save();
    Renderer.renderAll(DataModel.state.currentWeek, true);
    Toast.show('已撤销复制');
  },
};

// ======================================================================
// UndoStack — 多级撤销（任务数组快照制）
// ======================================================================
const UndoStack = {
  items: [],
  limit: 20,

  push(label) {
    if (!DataModel.state) return;
    this.items.push({
      label,
      tasks: JSON.parse(JSON.stringify(DataModel.state.tasks)),
      tombstones: JSON.parse(JSON.stringify(DataModel.state.tombstones || {})),
    });
    if (this.items.length > this.limit) this.items.shift();
  },

  undo() {
    const it = this.items.pop();
    if (!it) { Toast.show('没有可撤销的操作'); return false; }
    const before = new Set(DataModel.state.tasks.map(t => t.id));
    const after = new Set(it.tasks.map(t => t.id));
    // 撤销一次「新增」= 连云端也要拿掉，否则下次合并它又回来；
    // 撤销一次「删除」= 作废墓碑并把 updatedAt 顶到删除之后，光清本地墓碑不够，
    // 因为那份墓碑可能已经传上云了。
    const stamp = new Date().toISOString();
    it.tasks.forEach(t => { if (!before.has(t.id)) t.updatedAt = stamp; });
    const removed = [...before].filter(id => !after.has(id));
    DataModel.state.tasks = it.tasks;
    DataModel.state.tombstones = JSON.parse(JSON.stringify(it.tombstones || {}));
    if (removed.length) DataModel.tombstone(removed);
    DataModel._save();
    Renderer.renderAll(DataModel.state.currentWeek, true);
    Toast.show(`已撤销：${it.label}`);
    return true;
  },

  // 动作最后发现什么都没改时，丢掉预先入栈的快照
  discard() { this.items.pop(); },
};

// ======================================================================
// CardDrag — 拖拽排序与跨列改派（Pointer Events）
// ======================================================================
const CardDrag = {
  pending: null,
  session: null,
  _suppressClick: false,

  // 由 #board 的 pointerdown 调用；尺寸线与删除按钮不归它管
  arm(e, card) {
    if (this.session || this.pending || Editor.currentField) return;
    const s = {
      card,
      sx: e.clientX,
      sy: e.clientY,
      armed: e.pointerType !== 'touch',
      timer: 0,
    };
    // 触屏先长按 200ms 再认拖；在此之前移动都当作页面滚动
    if (!s.armed) s.timer = setTimeout(() => { s.armed = true; }, 200);
    s.onMove = ev => this._move(s, ev);
    s.onEnd = () => this._end(s);
    window.addEventListener('pointermove', s.onMove);
    window.addEventListener('pointerup', s.onEnd);
    window.addEventListener('pointercancel', s.onEnd);
    // pointermove 对触摸手势不可取消：长按生效后必须用 touchmove 掐掉页面滚动
    if (!s.armed) {
      s.onTouchMove = ev => { if (s.armed) ev.preventDefault(); };
      window.addEventListener('touchmove', s.onTouchMove, { passive: false });
    }
    this.pending = s;
  },

  _move(s, ev) {
    const d = Math.abs(ev.clientX - s.sx) + Math.abs(ev.clientY - s.sy);
    if (!s.armed) {
      if (d > 12) this._end(s);
      return;
    }
    if (!this.session) {
      if (d < 6) return;
      this._engage(s);
    }
    ev.preventDefault();
    this._place(ev.clientX, ev.clientY);
  },

  _engage(s) {
    clearTimeout(s.timer);
    this.session = s;
    UndoStack.push('拖拽排序');
    s.card.classList.add('dragging');
    document.getElementById('board').classList.add('drag-active');
  },

  _place(x, y) {
    const el = document.elementFromPoint(x, y);
    const col = el && el.closest ? el.closest('.column') : null;
    const body = col && col.querySelector('.column-body');
    if (!body) return;
    const dragged = this.session.card;
    body.classList.remove('empty');
    let ref = null;
    body.querySelectorAll('.task-card').forEach(c => {
      if (ref || c === dragged) return;
      const r = c.getBoundingClientRect();
      if (y < r.top + r.height / 2) ref = c;
    });
    if (ref) body.insertBefore(dragged, ref);
    else body.appendChild(dragged);
  },

  _end(s) {
    window.removeEventListener('pointermove', s.onMove);
    window.removeEventListener('pointerup', s.onEnd);
    window.removeEventListener('pointercancel', s.onEnd);
    if (s.onTouchMove) window.removeEventListener('touchmove', s.onTouchMove);
    clearTimeout(s.timer);
    if (this.session) this._commit();
    if (this.pending === s) this.pending = null;
    this.session = null;
  },

  _commit() {
    const board = document.getElementById('board');
    this.session.card.classList.remove('dragging');
    board.classList.remove('drag-active');
    this._suppressClick = true;

    const slots = [];
    board.querySelectorAll('.column').forEach(col => {
      const person = C.MEMBERS[Number(col.id.split('-')[1])];
      col.querySelectorAll('.column-body > .task-card').forEach(c =>
        slots.push({ id: c.dataset.taskId, person }));
    });

    let moved = 0, reassigned = 0;
    slots.forEach((slot, i) => {
      const t = DataModel.state.tasks.find(x => x.id === slot.id);
      if (!t) return;
      const wasPerson = t.person;
      let hit = false;
      if (t.order !== i) { t.order = i; hit = true; }
      if (t.person !== slot.person) { t.person = slot.person; hit = true; reassigned++; }
      if (hit) {
        t.updatedAt = new Date().toISOString();
        if (wasPerson !== t.person) DataModel._record(t, 'person', wasPerson, t.person);
        moved++;
      }
    });

    if (!moved) { UndoStack.discard(); return; }   // 没真的挪动，不留空快照
    DataModel._save();
    Renderer.renderAll(DataModel.state.currentWeek, true);
    Toast.show(reassigned ? `已改派 ${reassigned} 个任务` : '已调整顺序');
  },

  // 拖完会紧跟一个 click，吞掉它以免误开编辑
  consumeClick() {
    if (!this._suppressClick) return false;
    this._suppressClick = false;
    return true;
  },
};

// ======================================================================
// App — Entry point
// ======================================================================
const App = {
  async init() {
    this.initTheme();
    // Load local first for instant render
    const state = Storage.load();
    // 周次属于视图状态而非数据：每次打开页面都落在本周，不沿用上次浏览位置
    state.currentWeek = Storage.getDefault().currentWeek;
    DataModel.init(state);
    this.bindToolbar();
    this.bindBoardDelegation();
    this.bindSettings();
    this.bindGlobalKeys();
    this.bindSaveBtn();
    SheetSet.bind();
    GistSync.flushOnHide();
    this.bindTheme();
    Renderer.renderAll(DataModel.state.currentWeek);

    // Then attempt remote sync (always configured with defaults)
    SyncStatus.showConfigured();
    const merged = await Storage.loadAsync(state);
    if (merged !== state) {
      DataModel.init(merged);
      Renderer.renderAll(DataModel.state.currentWeek);
    }
    // 离线 harness：?sheet&count=4&mode=persons 直接把纸铺开，不用手点对话框
    const urlCfg = SheetSet.fromUrl();
    if (urlCfg) SheetSet.preview(urlCfg);
  },

  initTheme() {
    let saved = null;
    try { saved = localStorage.getItem(C.THEME_KEY); } catch (e) {}
    if (!saved) {
      saved = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
        ? 'blueprint' : 'paper';
    }
    this._applyTheme(saved);
  },

  _applyTheme(mode) {
    if (mode === 'blueprint') document.body.dataset.theme = 'blueprint';
    else delete document.body.dataset.theme;
  },

  bindTheme() {
    document.getElementById('btn-theme').addEventListener('click', () => {
      const next = document.body.dataset.theme === 'blueprint' ? 'paper' : 'blueprint';
      this._applyTheme(next);
      try { localStorage.setItem(C.THEME_KEY, next); } catch (e) {}
      Toast.show(next === 'blueprint' ? '蓝图夜览' : '图纸日览');
    });
  },

  bindToolbar() {
    document.getElementById('btn-prev-week').addEventListener('click', () => Actions.previousWeek());
    document.getElementById('btn-next-week').addEventListener('click', () => Actions.nextWeek());
    document.getElementById('btn-today').addEventListener('click', () => Actions.goToToday());
    document.getElementById('btn-copy-prev').addEventListener('click', () => Actions.copyFromPrev());
    document.getElementById('btn-print').addEventListener('click', () => SheetSet.openDialog());

    // Search
    const searchInput = document.getElementById('search-input');
    let searchTimer;
    searchInput.addEventListener('input', () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        FilterState.search = searchInput.value.trim();
        Renderer.renderAll(DataModel.state.currentWeek);
      }, 200);
    });

    // Status filters
    document.getElementById('status-filters').addEventListener('click', (e) => {
      const btn = e.target.closest('.filter-btn');
      if (!btn) return;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      FilterState.statusFilter = btn.dataset.filter;
      Renderer.renderAll(DataModel.state.currentWeek);
    });
  },

  bindBoardDelegation() {
    const board = document.getElementById('board');

    board.addEventListener('click', (e) => {
      if (CardDrag.consumeClick()) return;

      const rev = e.target.closest('.chip.rev');
      if (rev) {
        const card = rev.closest('.task-card');
        const id = card.dataset.taskId;
        const open = !Renderer.openRevs.delete(id);
        if (open) Renderer.openRevs.add(id);
        card.classList.toggle('rev-open', open);
        return;
      }

      const add = e.target.closest('.btn-add-person');
      if (add) { Actions.addTask(add.dataset.person); return; }

      const del = e.target.closest('.card-del');
      if (del) { Actions.deleteTask(del.dataset.taskId); return; }

      const el = e.target.closest('.editable');
      // 尺寸线由 pointerdown 接管，不参与 click 编辑
      if (!el || el.dataset.field === 'progress') return;
      if (el.classList.contains('editing')) return;
      Editor.startEdit(el, el.closest('.task-card'));
    });

    // 按住尺寸线即可拖动，无需先点击激活
    board.addEventListener('pointerdown', (e) => {
      if (e.button > 0) return;
      const dim = e.target.closest('.dim');
      if (dim) {
        e.preventDefault();
        Editor.beginDrag(dim, dim.closest('.task-card'), e);
        return;
      }
      if (e.target.closest('.card-del')) return;
      const card = e.target.closest('.task-card');
      if (card) CardDrag.arm(e, card);
    });
  },

  bindSettings() {
    const overlay = document.getElementById('settings-overlay');
    const gistInput = document.getElementById('cfg-gist-id');
    const tokenInput = document.getElementById('cfg-token');

    // Open settings
    document.getElementById('btn-settings').addEventListener('click', () => {
      const cfg = GistSync.loadConfig();
      gistInput.value = cfg.gistId || gistInput.value || '';
      tokenInput.value = cfg.token || '';
      const weeks = new Set(DataModel.state.tasks.map(t => t.week)).size;
      document.getElementById('backup-meta').textContent =
        `当前 ${DataModel.state.tasks.length} 条任务 / ${weeks} 周，导出 JSON 可在换机或同步失败时还原。`;
      overlay.classList.add('show');
    });

    // Close
    document.getElementById('btn-cancel-settings').addEventListener('click', () => {
      overlay.classList.remove('show');
    });
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) overlay.classList.remove('show');
    });

    // Save
    document.getElementById('btn-save-settings').addEventListener('click', async () => {
      const gistId = gistInput.value.trim();
      const token = tokenInput.value.trim();
      if (!gistId || !token) { Toast.show('请输入 Gist ID 和 Token'); return; }
      GistSync.saveConfig({ gistId, token });
      overlay.classList.remove('show');
      SyncStatus.showConfigured();
      SyncStatus.syncing();
      // 先拉后推。本地板子完全可能是空的或停在几周之前 —— 同步坏掉的那两个月里，
      // 每个人的 localStorage 就是一张各自的孤本。这时直接 push 等于用孤本覆盖云端，
      // 把同事的任务整片抹掉。所以必须先 merge，再上传合并后的那一份。
      const remote = await GistSync.pull();
      if (!GistSync.reachable) {
        // 读不到 ≠ token 失效，别把「去换 Token」写成提示；这里拦的是覆盖，不是权限
        SaveBtn.setError('net');
        SyncStatus.error('读不到云端 · 检查 Gist ID 是否填对');
        Toast.show('没能读到云端数据，已停止上传（避免覆盖同事的板子）', 6000);
        return;
      }
      GistSync.applyRemote(remote);
      const ok = await GistSync.push(DataModel.state);
      if (ok) {
        SaveBtn.setSaved();
        SyncStatus.configured();
        Toast.show(`同步成功 · 云端 ${DataModel.state.tasks.length} 条任务`, 5000);
      } else {
        // 读得到传不上去 = token 权限不够，不是 Gist ID 错了
        const why = GistSync.lastError === 'auth'
          ? 'Token 无写入权限 · 需 Gists: Read and write'
          : '上传失败 · 点击重试';
        SaveBtn.setError(GistSync.lastError === 'auth' ? 'auth' : 'net');
        SyncStatus.error(why);
        Toast.show(why, 6000);
      }
    });

    // Disconnect (clear custom overrides, fall back to defaults)
    document.getElementById('btn-disconnect').addEventListener('click', () => {
      if (confirm('确定清除自定义配置？将恢复使用默认同步设置。')) {
        GistSync.saveConfig({ gistId: '', token: '' });
        overlay.classList.remove('show');
        SyncStatus.showConfigured();
        SyncStatus.configured();
        Toast.show('已恢复默认同步设置');
        location.reload();
      }
    });

    // 本地备份
    document.getElementById('btn-export').addEventListener('click', () => {
      const n = Backup.exportFile();
      Toast.show(`已导出 ${n} 条任务`);
    });

    const fileInput = document.getElementById('import-file');
    document.getElementById('btn-import').addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', () => {
      const file = fileInput.files && fileInput.files[0];
      fileInput.value = '';
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        let data;
        try { data = JSON.parse(reader.result); }
        catch (err) { Toast.show('导入失败：不是有效的 JSON'); return; }
        const err = Backup.check(data);
        if (err) { Toast.show('导入失败：' + err, 6000); return; }
        UndoStack.push('导入备份');
        const { added, total } = Backup.merge(data);
        DataModel._save();
        overlay.classList.remove('show');
        Renderer.renderAll(DataModel.state.currentWeek, true);
        Toast.show(`已导入 ${total} 条任务，新增 ${added} 条`, 6000);
      };
      reader.readAsText(file);
    });
  },

  bindGlobalKeys() {
    document.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'n') {
        e.preventDefault();
        Actions.addTask(C.MEMBERS[0]);
      }
      if (e.key === 'Escape') {
        if (Editor.currentField) {
          Editor.cancelEdit();
        } else if (document.getElementById('sheet-overlay').classList.contains('show')) {
          document.getElementById('sheet-overlay').classList.remove('show');
        } else if (document.body.classList.contains('sheet-preview')) {
          SheetSet.close();
        } else {
          document.getElementById('settings-overlay').classList.remove('show');
        }
      }
      // Ctrl/Cmd+Z：多级撤销（输入框里留给浏览器原生的文本撤销）
      if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === 'z') {
        const a = document.activeElement;
        if (a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.isContentEditable)) return;
        e.preventDefault();
        UndoStack.undo();
      }
      // Ctrl+S: manual save
      if ((e.ctrlKey || e.metaKey) && e.key === 's') {
        e.preventDefault();
        GistSync.saveNow(DataModel.state);
      }
    });
  },

  bindSaveBtn() {
    document.getElementById('btn-save').addEventListener('click', () => {
      GistSync.saveNow(DataModel.state);
    });
  },
};

// Boot
document.addEventListener('DOMContentLoaded', () => App.init());
</script>
</body>
</html>
