/* ===== Reset ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }

/* ===== Design tokens ===== */
:root {
  --f-display: "Noto Serif SC", "Songti SC", "STSong", Georgia, serif;
  --f-body: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, sans-serif;
  --f-mono: "IBM Plex Mono", "SFMono-Regular", "JetBrains Mono", ui-monospace, Menlo, monospace;

  --paper: #F1EEE6;
  --paper-raised: #FBF9F5;
  --paper-sunk: #E6E1D6;
  --grid: rgba(31, 93, 124, .055);
  --grid-bold: rgba(31, 93, 124, .095);
  --ink: #1C1A16;
  --ink-2: #555046;
  --ink-3: #6E6659;
  --ink-4: #A69C8B;
  --hair: #DCD5C7;
  --hair-strong: #C3B9A6;

  --blueprint: #1F5D7C;
  --blueprint-2: #2C7BA0;
  --blueprint-soft: rgba(31, 93, 124, .10);
  --rust: #B0451D;
  --amber: #8A6310;
  --sage: #4C6B4E;

  --shadow-1: 0 1px 0 rgba(28,26,22,.03), 0 1px 3px rgba(28,26,22,.05);
  --shadow-2: 0 2px 4px rgba(28,26,22,.06), 0 12px 30px rgba(28,26,22,.11);

  --ease: cubic-bezier(.22, .61, .36, 1);
  --tint-ink: rgba(28, 26, 22, .04);
  --hatch: rgba(76, 107, 78, .09);
  /* 负荷条的历史格要比发丝线读得出来（≥3:1），又不抢当周那格的戏 */
  --spark-hist: #8F8878;
}

body[data-theme="blueprint"] {
  --paper: #0D1E29;
  --paper-raised: #132837;
  --paper-sunk: #0A1720;
  --grid: rgba(124, 191, 217, .07);
  --grid-bold: rgba(124, 191, 217, .115);
  --ink: #E4EEF4;
  --ink-2: #A9BECB;
  --ink-3: #7690A0;
  --ink-4: #4E6675;
  --hair: #25404F;
  --hair-strong: #33566A;
  --blueprint: #7CBFD9;
  --blueprint-2: #9DD3E8;
  --blueprint-soft: rgba(124, 191, 217, .13);
  --rust: #DE8862;
  --amber: #DDB35C;
  --sage: #8FBF8E;
  --shadow-1: 0 1px 0 rgba(0,0,0,.22);
  --shadow-2: 0 2px 6px rgba(0,0,0,.34), 0 14px 34px rgba(0,0,0,.42);
  --tint-ink: rgba(124, 191, 217, .05);
  --hatch: rgba(143, 191, 142, .14);
  --spark-hist: #6D8798;
}

/* ===== Base ===== */
body {
  font-family: var(--f-body);
  font-size: 13px;
  color: var(--ink);
  display: flex; flex-direction: column;
  background-color: var(--paper);
  /* 制图网格：细格 18px + 粗格 144px */
  background-image:
    linear-gradient(var(--grid-bold) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-bold) 1px, transparent 1px),
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 144px 144px, 144px 144px, 18px 18px, 18px 18px;
  transition: background-color .35s var(--ease), color .35s var(--ease);
  -webkit-font-smoothing: antialiased;
}
::selection { background: var(--blueprint); color: var(--paper-raised); }

/* mono annotation utility */
.anno {
  font-family: var(--f-mono);
  font-size: 10px;
  letter-spacing: .09em;
  text-transform: uppercase;
  color: var(--ink-3);
}

/* ===== Title block (toolbar) ===== */
#toolbar {
  flex-shrink: 0;
  display: flex; align-items: center; gap: 16px;
  padding: 11px 20px;
  background: var(--paper-raised);
  border-bottom: 1px solid var(--hair-strong);
  position: sticky; top: 0;
  z-index: 100;
  flex-wrap: wrap;
}
#toolbar .sep { flex: 1; }

#brand { display: flex; align-items: baseline; gap: 10px; padding-right: 18px; border-right: 1px solid var(--hair); }
#brand .mark {
  font-family: var(--f-mono); font-size: 10px; letter-spacing: .16em;
  color: var(--paper-raised); background: var(--ink);
  padding: 3px 6px; text-transform: uppercase; align-self: center;
}
#brand .name { font-family: var(--f-display); font-size: 15px; font-weight: 600; letter-spacing: .02em; white-space: nowrap; }

#toolbar button {
  font-family: var(--f-mono); font-size: 11px; letter-spacing: .05em;
  padding: 5px 12px;
  border: 1px solid var(--hair-strong);
  border-radius: 0;
  background: transparent; cursor: pointer;
  white-space: nowrap; color: var(--ink-2);
  transition: color .16s var(--ease), border-color .16s var(--ease), background .16s var(--ease);
}
#toolbar button:hover { color: var(--blueprint); border-color: var(--blueprint); background: var(--blueprint-soft); }
#toolbar button:active { transform: translateY(1px); }
#toolbar button.accent { background: var(--ink); color: var(--paper-raised); border-color: var(--ink); }
#toolbar button.accent:hover { background: var(--blueprint); border-color: var(--blueprint); }
#toolbar .week-nav { font-size: 10px; padding: 5px 9px; color: var(--ink-3); }
#toolbar .week-nav:hover { color: var(--blueprint); }

.week-group { display: flex; align-items: center; gap: 11px; }
#week-label {
  font-family: var(--f-display); font-size: 20px; font-weight: 600;
  line-height: 1.05; letter-spacing: .01em; min-width: 148px;
  display: flex; flex-direction: column; gap: 3px;
}
#week-label .wk-main { display: flex; align-items: center; }
#week-label .date-range {
  font-family: var(--f-mono); font-size: 10px; font-weight: 400;
  letter-spacing: .09em; color: var(--ink-3);
}
#week-label .wk-flag {
  font-family: var(--f-mono); font-style: normal; font-size: 8.5px;
  letter-spacing: .14em; text-transform: uppercase;
  color: var(--paper-raised); background: var(--blueprint);
  padding: 2px 5px; margin-left: 8px; vertical-align: 4px;
}

/* ===== Toast ===== */
#toast {
  position: fixed; top: 74px; left: 50%; transform: translate(-50%, -6px);
  padding: 8px 16px; font-size: 12px;
  font-family: var(--f-mono); letter-spacing: .04em;
  z-index: 9999; pointer-events: none;
  opacity: 0; transition: opacity .25s var(--ease), transform .25s var(--ease);
  background: var(--ink); color: var(--paper);
  border-left: 3px solid var(--blueprint);
  box-shadow: var(--shadow-2);
  display: flex; align-items: center;
}
#toast.show { opacity: 1; pointer-events: auto; transform: translate(-50%, 0); }

/* ===== Board ===== */
#board {
  flex: 1; overflow-y: auto; overflow-x: auto;
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 18px;
  padding: 20px 20px 96px;
  align-content: start;
}

/* ===== Column — 一张图纸 ===== */
.column {
  position: relative;
  background: var(--paper-raised);
  border: 1px solid var(--hair-strong);
  display: flex; flex-direction: column;
  min-width: 0;
  box-shadow: var(--shadow-1);
  transition: box-shadow .22s var(--ease), border-color .22s var(--ease);
}
.column:hover { box-shadow: var(--shadow-2); }
/* 裁切标记 */
.column::before, .column::after {
  content: ''; position: absolute; width: 10px; height: 10px;
  pointer-events: none; opacity: .5;
  border-color: var(--blueprint); border-style: solid; border-width: 0;
}
.column::before { top: -5px; left: -5px; border-top-width: 1px; border-left-width: 1px; }
.column::after { bottom: -5px; right: -5px; border-bottom-width: 1px; border-right-width: 1px; }

.column-header {
  padding: 11px 13px 10px;
  border-bottom: 1px solid var(--hair-strong);
  display: flex; align-items: flex-start; justify-content: space-between; gap: 8px;
  flex-shrink: 0;
  background: linear-gradient(180deg, var(--tint-ink), transparent);
}
.column-header .ph-left { min-width: 0; }
.column-header .sht {
  font-family: var(--f-mono); font-size: 9px; letter-spacing: .14em;
  text-transform: uppercase; color: var(--ink-3); display: block; margin-bottom: 3px;
}
.column-header .person-name {
  font-family: var(--f-display);
  font-size: 16px; font-weight: 600; letter-spacing: .01em;
  display: flex; align-items: center; gap: 7px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.column-header .person-name .dot {
  width: 7px; height: 7px; border-radius: 0; flex-shrink: 0;
  box-shadow: 0 0 0 1px rgba(0,0,0,.06);
}
.dot-c0 { background: var(--blueprint); }
.dot-c1 { background: var(--amber); }
.dot-c2 { background: var(--sage); }
.dot-c3 { background: var(--rust); }

.column-header .ph-right { text-align: right; flex-shrink: 0; }
.column-header .task-count {
  font-family: var(--f-mono); font-size: 15px; font-weight: 500; color: var(--ink);
  line-height: 1;
}
.column-header .task-count i {
  font-style: normal; font-size: 9px; letter-spacing: .1em; color: var(--ink-3);
  margin-left: 2px;
}
.column-header .ph-sub {
  display: block; font-family: var(--f-mono); font-size: 9px; letter-spacing: .08em;
  color: var(--ink-3); margin-top: 4px;
}
.column-header .ph-sub b { color: var(--sage); font-weight: 500; }

.column-body {
  flex: 0 1 auto; overflow-y: auto;
  padding: 12px 10px;
  display: flex; flex-direction: column; gap: 10px;
  min-height: 84px;
}
.column-body.empty {
  border: 1px dashed var(--hair-strong);
  margin: 12px 10px;
  min-height: 84px;
}
.column-body.empty::after {
  content: '待补充 / TO BE ADDED';
  text-align: center; color: var(--ink-3);
  font-family: var(--f-mono); font-size: 9.5px; letter-spacing: .12em;
  padding: 30px 0;
}
/* 续页上一列空着，意思跟首屏不一样：不是「这个人这周没排任务」，而是「他的项都在前一张纸上」。
   「待补充」在这儿是一句假话，它会叫读图的人去补一张本来就在前页的卡 —— 跟「续 1/2」同一类错误。
   只换文案、不换盒子（同一行字、同一层 padding），所以纸面高度不受影响，探针量到的仍然成立。 */
.sheet-page.sheet-cont .column-body.empty::after { content: '本张无余项 / NOTHING FURTHER'; }
.column-footer { padding: 0 10px 11px; flex-shrink: 0; }
.column-footer button {
  width: 100%; padding: 7px;
  border: 1px dashed var(--hair-strong); border-radius: 0;
  background: transparent; color: var(--ink-3); cursor: pointer;
  font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .1em;
  transition: color .16s var(--ease), border-color .16s var(--ease), background .16s var(--ease);
}
.column-footer button:hover {
  border-color: var(--blueprint); color: var(--blueprint); background: var(--blueprint-soft);
  border-style: solid;
}

/* ===== Task Card ===== */
@keyframes card-in {
  from { opacity: 0; transform: translateY(7px); }
  to   { opacity: 1; transform: none; }
}
.task-card {
  position: relative;
  background: var(--paper-raised);
  border: 1px solid var(--hair);
  padding: 9px 10px 10px;
  cursor: grab;   /* 可编辑子元素各自覆盖成 text/pointer，留白处即起拖区 */
  -webkit-touch-callout: none;
  transition: border-color .18s var(--ease), box-shadow .18s var(--ease),
              background .18s var(--ease), opacity .18s var(--ease);
  animation: card-in .3s var(--ease) backwards;
  /* 不能用 both：动画填充会把 .dragging 的旋转和兄弟卡片的淡出一起锁死 */
}
/* 左侧引线：hover 时展开 */
.task-card::before {
  content: ''; position: absolute; left: -1px; top: -1px; bottom: -1px; width: 2px;
  background: var(--blueprint);
  transform: scaleY(0); transform-origin: top;
  transition: transform .22s var(--ease);
}
.task-card:hover { border-color: var(--hair-strong); box-shadow: var(--shadow-1); }
.task-card:hover::before { transform: scaleY(1); }
.task-card[data-status="已完成"] {
  background-image: repeating-linear-gradient(45deg, var(--hatch) 0 1px, transparent 1px 8px);
}
/* ===== 拖拽排序 —— CAD 选择集观感 ===== */
.task-card.dragging {
  border-color: var(--blueprint);
  border-style: dashed;
  box-shadow: var(--shadow-2);
  outline: 1px dashed var(--blueprint);
  outline-offset: 3px;
  transform: rotate(-.5deg);
  cursor: grabbing;
  z-index: 4;
  transition: none;
}
.task-card.dragging::before { transform: scaleY(1); }
#board.drag-active { user-select: none; cursor: grabbing; }
#board.drag-active .task-card:not(.dragging) { opacity: .5; }
/* 拖动中/落位后都关掉入场动画：DOM 重新插入会让它一遍遍重播 */
#board.drag-active .task-card, #board.no-anim .task-card { animation: none; }

/* ===== 周对比云线 + 修订表 ===== */
/* 上周没有这条任务 → 内侧虚线，读作修订云线的轻量版 */
.task-card.is-new:not(.dragging) { outline: 1px dashed var(--amber); outline-offset: -3px; }
.rev-slot { display: flex; align-items: center; gap: 4px; margin-left: auto; flex-shrink: 0; }
.chip {
  font-family: var(--f-mono); font-size: 8.5px; font-weight: 500;
  letter-spacing: .1em; line-height: 1.5; padding: 0 4px;
  border: 1px solid var(--hair-strong); border-radius: 0;
  background: transparent; color: var(--ink-3);
  font-variant-numeric: tabular-nums;
}
.chip.new { color: var(--amber); border-color: currentColor; }

/* 「第 N 周」：这条在同一位手上连续排到第几周（含本周）。第 1 周不印 —— 那件事
   已经由上面那圈虚线云线 + `新增` 说了，两枚并排是重复。
   用锈不用琥珀：琥珀归「新增」，同色会让人以为两枚徽标说的是同一件事。
   第 4 周起整枚反白，与 `rev-open` 那枚 REV 同一个手法：摊开一叠 A3 时，
   隔着桌子也该先看见它。两张 A3 令牌（日览与 #print-stack）里 --rust 都有定义。 */
.chip.ten { color: var(--rust); border-color: currentColor; }
.chip.ten.long { background: var(--rust); color: var(--paper-raised); }
button.chip.rev { color: var(--blueprint); border-color: currentColor; cursor: pointer; transition: background .16s var(--ease); }
button.chip.rev:hover { background: var(--blueprint-soft); }
.task-card.rev-open button.chip.rev { background: var(--blueprint); color: var(--paper-raised); }
.rev-table {
  display: none; width: 100%; border-collapse: collapse; table-layout: fixed;
  margin-top: 7px; padding-top: 5px;
  border-top: 1px dotted var(--hair-strong);
}
.task-card.rev-open .rev-table { display: table; }
.rev-table th {
  font-family: var(--f-mono); font-size: 8px; font-weight: 500;
  letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3);
  text-align: left; white-space: nowrap; padding: 0 6px 3px 0;
  border-bottom: 1px solid var(--hair);
}
.rev-table th:nth-child(1), .rev-table td:nth-child(1) { width: 24px; }
.rev-table th:nth-child(2), .rev-table td:nth-child(2) { width: 72px; }
.rev-table td {
  font-family: var(--f-mono); font-size: 9.5px; color: var(--ink-2);
  padding: 3px 6px 3px 0; border-bottom: 1px solid var(--hair);
  font-variant-numeric: tabular-nums; vertical-align: top; white-space: nowrap;
}
.rev-table tr:last-child td { border-bottom: none; }
.rev-table td.rv-no { color: var(--ink-3); }
.rev-table td.rv-what { white-space: normal; }
.rev-table .arrow { opacity: .45; padding: 0 3px; }

/* ===== 列头个人负荷（最近 8 周） ===== */
.spark { display: flex; align-items: flex-end; gap: 2px; height: 14px; margin-top: 5px; }
.spark i { display: block; width: 3px; min-height: 1px; background: var(--spark-hist); }
/* 空白周读作「缺席」而不是「一条很矮的任务」，所以刻意压到几乎看不见：
   它不是需要被读懂的图形（数字在 title 里），提亮反而会让 0 比有任务还显眼 */
.spark i.zero { background: var(--hair-strong); opacity: .5; }
.spark i.now { background: var(--blueprint); }
.task-card .card-row { display: flex; align-items: center; gap: 7px; margin-bottom: 6px; }
.task-card .card-row:last-child { margin-bottom: 0; }
.task-card .card-row.wrap { flex-wrap: wrap; }
.task-card .spacer { flex: 1; }

.task-card .task-name {
  font-weight: 600; font-size: 13.5px; line-height: 1.4;
  flex: 1; min-width: 0; color: var(--ink); letter-spacing: .01em;
}
.task-card .task-name.editable { cursor: text; }
.task-card .task-name .placeholder { color: var(--ink-3); font-weight: 400; }

/* Priority — 引出线标签 */
.prio-badge {
  font-family: var(--f-mono); font-size: 9.5px; font-weight: 500;
  letter-spacing: .1em; text-transform: uppercase;
  padding: 1.5px 5px 1.5px 0; flex-shrink: 0;
  border-bottom: 1px solid currentColor;
  transition: background .16s var(--ease);
}
.prio-badge::before {
  content: attr(data-code);
  margin-right: 5px; opacity: .55; letter-spacing: .06em;
}
.prio-high { color: var(--rust); }
.prio-med  { color: var(--amber); }
.prio-low  { color: var(--sage); }
.prio-badge:hover { background: var(--tint-ink); }

/* Progress — 尺寸标注线 */
.dim {
  flex: 1; min-width: 0;
  display: flex; align-items: center; gap: 8px;
  padding: 3px 0;
  touch-action: none; user-select: none;
}
.dim-line {
  flex: 1; min-width: 34px; position: relative;
  display: flex; align-items: center; height: 15px;
}
.dim-track {
  flex: 1; position: relative; height: 2px;
  background: var(--paper-sunk);
  box-shadow: inset 0 0 0 1px var(--hair);
  cursor: ew-resize;
  transition: height .16s var(--ease);
}
.dim:hover .dim-track, .dim.editing .dim-track { height: 6px; }
.dim-fill {
  position: absolute; left: 0; top: 0; bottom: 0; display: block;
  background: var(--blueprint);
  transition: width .35s var(--ease), background .25s var(--ease);
}
.dim.dragging .dim-fill { transition: none; }
.dim-thumb {
  position: absolute; top: 50%; width: 9px; height: 9px; display: block;
  transform: translate(-50%, -50%) rotate(45deg);
  background: var(--paper-raised);
  border: 1.5px solid var(--blueprint);
  opacity: 0; transition: opacity .16s var(--ease), scale .16s var(--ease);
  scale: .7;
}
.dim:hover .dim-thumb, .dim.editing .dim-thumb { opacity: 1; scale: 1; }
.dim.editing .dim-thumb { background: var(--blueprint); }
/* 尺寸界线端头：建筑制图惯用的 45° 斜切标记 */
.dim-tick {
  width: 1px; height: 10px; flex-shrink: 0;
  background: var(--hair-strong);
  transform: rotate(45deg);
}
/* 刻度尺：每 10% 一根分度线，让进度条读起来像一把比例尺 */
.dim-line::after {
  content: ''; position: absolute; left: 1px; right: 1px;
  top: calc(50% + 4px); height: 3px; pointer-events: none;
  background: repeating-linear-gradient(90deg,
    var(--hair-strong) 0 1px, transparent 1px 11.1111%);
  opacity: .55;
  transition: opacity .16s var(--ease);
}
.dim:hover .dim-line::after { opacity: .9; }
.dim-val {
  font-family: var(--f-mono); font-size: 10.5px; font-weight: 500;
  color: var(--ink-2); min-width: 34px; text-align: right;
  font-variant-numeric: tabular-nums; flex-shrink: 0;
}
.dim-val i { font-style: normal; opacity: .5; font-size: 9px; margin-left: 1px; }
.dim[data-level="low"]  .dim-fill { background: var(--rust); }
.dim[data-level="mid"]  .dim-fill { background: var(--blueprint); }
.dim[data-level="high"] .dim-fill { background: var(--sage); }
.dim[data-level="none"] .dim-fill { background: transparent; }
.dim[data-level="low"]  .dim-thumb { border-color: var(--rust); }
.dim[data-level="mid"]  .dim-thumb { border-color: var(--blueprint); }
.dim[data-level="high"] .dim-thumb { border-color: var(--sage); }
.dim[data-level="none"] .dim-thumb { border-color: var(--ink-4); }
.dim[data-level="low"]  .dim-val { color: var(--rust); }
.dim[data-level="high"] .dim-val { color: var(--sage); }

/* Status — 制图校验标记 */
.status-badge {
  display: inline-flex; align-items: center; gap: 5px;
  font-family: var(--f-mono); font-size: 10px; letter-spacing: .06em;
  flex-shrink: 0; padding: 1px 0; cursor: pointer;
  color: var(--ink-3);
  border-bottom: 1px solid transparent;
  transition: border-color .16s var(--ease), color .16s var(--ease);
}
.status-badge:hover { border-bottom-color: currentColor; }
.status-badge::before {
  content: ''; width: 8px; height: 8px; flex-shrink: 0;
  border: 1px solid currentColor;
}
.status-badge[data-status="进行中"] { color: var(--blueprint); }
/* 半填那一格 = 下边框加粗到 4px，**不是一条渐变**。
   渐变会被 WebKit 光栅化成 Type-1 平铺瓦片（1×5、1×6 的小图）来铺，瓦片样本走色彩管理，
   同一张纸两次出图会在 ±1 通道上翻脸 —— 第十八轮量到骰子、第十九轮对上号就是这一格
   （纸面上那些逐袋变脸的像素 100% 落在这些瓦片里）。边框是矢量：闭包里一个栅格载荷都不留。
   代价量过了（`.preview/probe_r19_badge_ab.py`）：1:1、2:1、4:1 与原来**逐像素同一枚**；
   只有分数缩放（出纸 fit() 那一遍 ≈0.9836）边界那一格改成补墨，墨量 +5%、实心多 11 px，
   也就是半填的下沿在纸上更硬一点。守住这件事的判据：`.preview/r19_payload_table.py`。 */
.status-badge[data-status="进行中"]::before {
  border-bottom-width: 4px;
}
.status-badge[data-status="已完成"] { color: var(--sage); }
.status-badge[data-status="已完成"]::before {
  background: var(--sage);
  box-shadow: inset 0 0 0 1px var(--sage);
}

/* Dates — 时间标注 */
.task-card .task-dates {
  display: inline-flex; align-items: center; gap: 5px;
  font-family: var(--f-mono); font-size: 10px; letter-spacing: .04em;
  color: var(--ink-3); font-variant-numeric: tabular-nums;
}
.task-card .task-dates em { font-style: normal; color: var(--ink-4); }
.task-card .task-dates .editable { cursor: pointer; transition: color .16s var(--ease); }
.task-card .task-dates .editable:hover { color: var(--blueprint); }
.task-card .date-range .placeholder { color: var(--ink-3); letter-spacing: .08em; }

/* Notes */
.task-card .notes {
  font-size: 11.5px; line-height: 1.5; color: var(--ink-3);
  flex: 1; min-width: 0;
  border-top: 1px dotted var(--hair); padding-top: 5px;
}
.task-card .notes .placeholder { color: var(--ink-3); font-family: var(--f-mono); font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; }

/* Delete button */
.card-del {
  width: 16px; height: 16px; line-height: 14px; text-align: center;
  flex-shrink: 0;
  border: 1px solid transparent; background: transparent;
  color: var(--ink-3); font-size: 13px; cursor: pointer;
  opacity: 0; transition: opacity .16s var(--ease), color .16s var(--ease), border-color .16s var(--ease);
}
.task-card:hover .card-del { opacity: 1; }
.card-del:hover { color: var(--rust); border-color: var(--rust); }
@media (hover: none) { .card-del { opacity: .55; } }

/* ===== 点击热区 =====
   这张板子的字号是照着制图密度定的，不能为了手指放大；所以只把「可点范围」向外借
   已有的空白，墨迹一像素不动。展开量按卡片 9/10px 内边距、行距 6px、工具栏 gap 16px 量过。
   下面写的是申请值，实际生效范围由绘制顺序自动收敛：越界的带状区会落进下一行的盒子里，
   而那行自己可点（进度条、备注、任务名），后画的盒子赢 —— 也就是永远抢不走邻居的点击。
   2026-09-21 用 elementFromPoint 逐点采样验证：删除叉 16×16 → 27×22，REV 徽标 28×15 → 39×18，
   工具栏按钮 27×25 → 27×36（只上下扩，同排按钮密集，横向扩会互相抢），三处合计 0 例误触。
   注意生效范围比声明值少约 1px：绝对定位的伪元素是相对 padding box 展开的，那 1px 给了边框。
   副作用：这层向外扩的伪元素会计入 scrollWidth，所以自动化「横向溢出」扫描会把 chip 报成
   sw 34 / cw 26 —— 实测 chip 自然宽 27.9 = 盒宽、文字 17.9 = 内容盒，一个字都没溢出。 */
#toolbar button, .card-del, button.chip.rev { position: relative; }
#toolbar button::after { content: ''; position: absolute; inset: -7px 0; }
.card-del::after { content: ''; position: absolute; inset: -5px -8px -4px -5px; }
button.chip.rev::after { content: ''; position: absolute; inset: -3px -8px -3px -5px; }

/* ===== Inline Edit ===== */
.editable { cursor: pointer; }
.task-card input, .task-card select {
  font-family: var(--f-mono); font-size: 12px;
  border: 1px solid var(--blueprint); border-radius: 0;
  outline: none; padding: 1px 4px;
  background: var(--paper-raised); color: var(--ink);
}
.task-card input:focus, .task-card select:focus { box-shadow: 0 0 0 2px var(--blueprint-soft); }
.task-card .task-name input[type="text"] { font-family: var(--f-body); width: 100%; font-size: 13px; }
.task-card input[type="number"] { width: 56px; text-align: center; }
.task-card input[type="date"] { width: 112px; }
.task-card select { cursor: pointer; }

/* ===== Scrollbar ===== */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--hair-strong); }
::-webkit-scrollbar-thumb:hover { background: var(--blueprint); }

/* ===== Sync Indicator ===== */
#sync-status {
  display: none; align-items: center; gap: 6px;
  font-family: var(--f-mono); font-size: 10px; letter-spacing: .09em;
  text-transform: uppercase; color: var(--ink-3);
}
#sync-status.configured { display: flex; }
#sync-status .sync-dot {
  width: 6px; height: 6px; border-radius: 0; transform: rotate(45deg);
  background: var(--ink-4); flex-shrink: 0;
}
#sync-status.synced .sync-dot { background: var(--sage); }
#sync-status.syncing .sync-dot { background: var(--amber); animation: pulse .9s infinite; }
#sync-status.error .sync-dot { background: var(--rust); }
@keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.25; } }

#toolbar .tools { display: flex; align-items: center; gap: 6px; }
#btn-settings { font-size: 12px; padding: 4px 8px; border-color: transparent; }
#btn-settings:hover { border-color: var(--blueprint); }

/* ===== 对话框（同步设置 / 出图设置共用一套） ===== */
#settings-overlay, #sheet-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(20, 24, 26, .48);
  backdrop-filter: blur(3px);
  z-index: 10000;
  align-items: center; justify-content: center;
}
#settings-overlay.show, #sheet-overlay.show { display: flex; }
.dlg {
  background: var(--paper-raised);
  border: 1px solid var(--hair-strong);
  box-shadow: 0 0 0 5px var(--paper-raised), var(--shadow-2);
  padding: 26px 26px 22px;
  width: 430px; max-width: 90vw;
  max-height: 88vh; overflow: auto;
}
.dlg h3 {
  font-family: var(--f-display); font-size: 17px; font-weight: 600;
  margin-bottom: 4px; letter-spacing: .01em;
}
.dlg .sub {
  font-family: var(--f-mono); font-size: 9.5px; letter-spacing: .14em;
  text-transform: uppercase; color: var(--ink-3); margin-bottom: 18px;
  padding-bottom: 12px; border-bottom: 1px solid var(--hair);
}
.dlg label {
  display: block; font-family: var(--f-mono); font-size: 9.5px; font-weight: 500;
  letter-spacing: .13em; text-transform: uppercase;
  color: var(--ink-3); margin-bottom: 5px; margin-top: 15px;
}
.dlg label:first-of-type { margin-top: 0; }
.dlg input {
  width: 100%; padding: 8px 10px; border: 1px solid var(--hair-strong);
  border-radius: 0; font-family: var(--f-mono); font-size: 12.5px;
  background: var(--paper); color: var(--ink);
}
.dlg input:focus { outline: none; border-color: var(--blueprint); box-shadow: 0 0 0 2px var(--blueprint-soft); }
.dlg .hint {
  font-size: 11px; color: var(--ink-3); margin-top: 5px; line-height: 1.5;
}
.dlg .hint a { color: var(--blueprint); }
.dlg .btn-row {
  display: flex; gap: 8px; justify-content: flex-end;
  margin-top: 22px; padding-top: 15px; border-top: 1px solid var(--hair);
}
.dlg button {
  font-family: var(--f-mono); font-size: 11px; letter-spacing: .05em;
  padding: 7px 15px; border-radius: 0; cursor: pointer;
  border: 1px solid var(--hair-strong); background: transparent; color: var(--ink-2);
  transition: all .16s var(--ease);
}
.dlg button:hover { border-color: var(--blueprint); color: var(--blueprint); background: var(--blueprint-soft); }
.dlg button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.dlg button.primary:hover { background: var(--blueprint); border-color: var(--blueprint); color: var(--paper-raised); }
.dlg button.danger { color: var(--rust); border-color: transparent; background: transparent; margin-right: auto; }
.dlg button.danger:hover { background: var(--rust); color: var(--paper-raised); border-color: var(--rust); }
.dlg .dlg-rule {
  display: flex; align-items: center; gap: 9px; margin-top: 21px;
  font-family: var(--f-mono); font-size: 9px; font-weight: 500;
  letter-spacing: .16em; text-transform: uppercase; color: var(--ink-3);
}
.dlg .dlg-rule::after { content: ""; flex: 1; border-top: 1px solid var(--hair); }
.dlg .btn-row.backup {
  justify-content: flex-start; margin-top: 11px; padding-top: 0; border-top: none;
}
#import-file { display: none; }

/* ===== 出图对话框特有的几件控件 ===== */
.dlg.wide { width: 468px; }
.dlg select {
  width: 100%; padding: 7px 9px; border: 1px solid var(--hair-strong);
  border-radius: 0; font-family: var(--f-mono); font-size: 12.5px;
  background: var(--paper); color: var(--ink);
  /* 原生下拉箭头在纸面上太抢戏，换成一根细引线 */
  appearance: none; -webkit-appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--ink-3) 50%),
                    linear-gradient(135deg, var(--ink-3) 50%, transparent 50%);
  background-position: calc(100% - 15px) 51%, calc(100% - 10px) 51%;
  background-size: 5px 5px, 5px 5px; background-repeat: no-repeat;
}
.dlg select:focus { outline: none; border-color: var(--blueprint); box-shadow: 0 0 0 2px var(--blueprint-soft); }
.dlg .sh-row { display: flex; gap: 12px; }
.dlg .sh-row > div { flex: 1; min-width: 0; }
/* 分段控件：一档一个，选中即整块压黑，和筛选按钮同一套语言 */
.seg { display: flex; border: 1px solid var(--hair-strong); }
.seg button {
  flex: 1; padding: 7px 4px; border: none; border-right: 1px solid var(--hair);
  background: transparent; color: var(--ink-2); cursor: pointer;
  font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .04em;
  transition: background .16s var(--ease), color .16s var(--ease);
}
.seg button:last-child { border-right: none; }
.seg button:hover { background: var(--blueprint-soft); color: var(--blueprint); }
.seg button.on { background: var(--ink); color: var(--paper-raised); }
.seg button.on:hover { background: var(--blueprint); color: var(--paper-raised); }
.sh-opt {
  display: flex; align-items: flex-start; gap: 8px; margin-top: 16px;
  font-size: 11.5px; line-height: 1.5; color: var(--ink-2); cursor: pointer;
}
.sh-opt input { width: auto; margin: 1px 0 0; accent-color: var(--blueprint); }
#sh-summary {
  margin-top: 15px; padding-top: 12px; border-top: 1px solid var(--hair);
  font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .05em;
  color: var(--ink-2); line-height: 1.7;
}
#sh-summary.is-capped { color: var(--rust); }

/* ===== 键盘焦点 —— 图纸上的选择集 ===== */
/* 只给 :focus-visible，鼠标点按钮不会留框；输入框自己有下划线/光环，不重复描边 */
:focus-visible { outline: 2px solid var(--blueprint); outline-offset: 2px; }
button:focus-visible { outline-offset: 3px; }
/* REV 彽标只有 8.5px，标准偏移会撞到我排的邻卡 */
button.chip:focus-visible { outline-width: 1.5px; outline-offset: 1px; }
.dlg input:focus-visible,
.task-card input:focus-visible,
.task-card select:focus-visible { outline: none; }

/* ===== Save stamp ===== */
#save-bar {
  position: fixed; bottom: 0; left: 0; right: 0;
  display: flex; justify-content: center;
  padding: 12px 0 14px; z-index: 200;
  pointer-events: none;
  background: linear-gradient(to top, var(--paper) 30%, transparent);
}
#btn-save {
  pointer-events: auto;
  font-family: var(--f-mono); font-size: 11px; font-weight: 500; letter-spacing: .11em;
  text-transform: uppercase;
  padding: 9px 20px;
  border-radius: 0; cursor: pointer;
  display: flex; align-items: center; gap: 9px;
  background: var(--paper-raised); color: var(--ink-2);
  border: 1px solid var(--hair-strong);
  box-shadow: var(--shadow-1);
  transition: all .2s var(--ease);
}
#btn-save:hover { border-color: var(--blueprint); color: var(--blueprint); }
#btn-save .save-icon { font-size: 12px; line-height: 1; }
#btn-save.saved { color: var(--sage); border-color: var(--sage); }
#btn-save.saving { color: var(--amber); border-color: var(--amber); }
#btn-save.unsaved {
  background: var(--ink); color: var(--paper); border-color: var(--ink);
  animation: stamp-glow 2s var(--ease) infinite;
}
#btn-save.unsaved:hover { background: var(--blueprint); border-color: var(--blueprint); color: var(--paper-raised); }
#btn-save.error { color: var(--rust); border-color: var(--rust); background: var(--paper-raised); }
@keyframes stamp-glow {
  0%, 100% { box-shadow: 0 0 0 0 rgba(28,26,22,.28); }
  55%      { box-shadow: 0 0 0 7px rgba(28,26,22,0); }
}

/* ===== Search & Filter ===== */
.search-input {
  font-family: var(--f-mono); font-size: 11.5px;
  padding: 5px 2px; width: 152px;
  border: none; border-bottom: 1px solid var(--hair-strong);
  background: transparent; outline: none; color: var(--ink);
  border-radius: 0;
  transition: border-color .16s var(--ease);
}
.search-input:focus { border-bottom-color: var(--blueprint); }
.search-input::placeholder { color: var(--ink-3); letter-spacing: .05em; }

.status-filters { display: flex; gap: 4px; }
/* 注意：#toolbar button 的 ID 特异性更高，这里必须同级作用域才能生效 */
#toolbar .filter-btn {
  font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .07em;
  padding: 4px 10px; color: var(--ink-3);
}
#toolbar .filter-btn:hover { color: var(--blueprint); border-color: var(--blueprint); background: var(--blueprint-soft); }
#toolbar .filter-btn.active {
  background: var(--ink); border-color: var(--ink);
  color: var(--paper-raised); font-weight: 500;
}
#toolbar .filter-btn.active:hover { background: var(--blueprint); border-color: var(--blueprint); color: var(--paper-raised); }

/* ===== Stats — 图签栏 ===== */
/* .stat-bar 是同一根栏在出图纸上的分身：屏幕上是 #stats-bar，纸上是 .stat-bar */
#stats-bar, .stat-bar {
  display: flex; align-items: stretch; flex-wrap: wrap;
  background: var(--paper-raised);
  border-bottom: 1px solid var(--hair-strong);
  font-size: 12px; color: var(--ink-2);
}
.stat-cell {
  display: flex; flex-direction: column; gap: 4px;
  padding: 9px 18px;
  border-right: 1px solid var(--hair);
  min-width: 84px;
}
.stat-cell.wide { min-width: 150px; flex: 0 0 auto; }
.stat-cell .anno { font-size: 8.5px; letter-spacing: .15em; }
.stat-value {
  font-family: var(--f-mono); font-size: 18px; font-weight: 500; line-height: 1;
  font-variant-numeric: tabular-nums; color: var(--ink);
}
.stat-value em { font-style: normal; font-size: 10px; color: var(--ink-3); margin-left: 1px; }
.stat-value.is-good { color: var(--sage); }
.stat-value.is-warn { color: var(--amber); }
.stat-value.is-bad  { color: var(--rust); }
.rate-track { position: relative; height: 2px; width: 100%; background: var(--paper-sunk); box-shadow: inset 0 0 0 1px var(--hair); margin-top: 3px; }
.rate-track i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--blueprint); transition: width .45s var(--ease); }
.rate-track.is-good i { background: var(--sage); }
.rate-track.is-warn i { background: var(--amber); }
.rate-track.is-bad  i { background: var(--rust); }

.stat-person {
  display: flex; flex-direction: column; gap: 5px;
  padding: 9px 16px;
  border-right: 1px solid var(--hair);
  flex: 1 1 96px; max-width: 172px; min-width: 96px;
}
.sp-top { display: flex; align-items: center; gap: 6px; min-width: 0; }
.stat-person .stat-dot { width: 6px; height: 6px; flex-shrink: 0; transform: rotate(45deg); }
.stat-person .sp-name { font-size: 12px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat-person .sp-num {
  margin-left: auto; font-family: var(--f-mono); font-size: 10.5px;
  font-variant-numeric: tabular-nums; color: var(--ink-3); flex-shrink: 0;
}
.stat-person .sp-num b { color: var(--sage); font-weight: 500; }
.sp-bar { position: relative; height: 2px; background: var(--paper-sunk); box-shadow: inset 0 0 0 1px var(--hair); }
.sp-bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--blueprint); transition: width .45s var(--ease); }

.stat-legend {
  display: flex; align-items: center; gap: 14px;
  padding: 9px 18px; margin-left: auto;
  font-family: var(--f-mono); font-size: 9px; letter-spacing: .1em;
  text-transform: uppercase; color: var(--ink-3);
  border-left: 1px solid var(--hair);
}
.stat-legend span { display: inline-flex; align-items: center; gap: 5px; }
.stat-legend span::before { content: ''; width: 7px; height: 7px; border: 1px solid currentColor; }
.stat-legend .lg-not { color: var(--ink-3); }
.stat-legend .lg-prog { color: var(--blueprint); }
.stat-legend .lg-prog::before { background: linear-gradient(to top, currentColor 50%, transparent 50%); }
.stat-legend .lg-done { color: var(--sage); }
.stat-legend .lg-done::before { background: currentColor; }

/* ===== Responsive ===== */
@media (max-width: 1120px) { #board { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 700px) {
  #board { grid-template-columns: minmax(0, 1fr); padding: 14px 14px 92px; gap: 14px; }
  #toolbar { padding: 9px 12px; gap: 10px; }
  #brand { padding-right: 10px; }
  #brand .name { display: none; }
  #week-label { font-size: 17px; }
  .search-input { width: 100%; }
  #stats-bar { overflow-x: auto; }
  .stat-legend { display: none; }
  .stat-person { flex: 0 0 auto; }
}
@media (prefers-reduced-motion: reduce) {
  /* 卡片有最长 312ms 的错峰 animation-delay，只压时长会让它们在前置填充里保持透明 */
  *, *::before, *::after {
    animation-duration: .01ms !important; animation-delay: 0ms !important;
    transition-duration: .01ms !important; transition-delay: 0ms !important;
  }
}

/* ===== 出图 — 晒图（A3 横排 · 多周连排 / 按人分册） ===== */
@page { size: A3 landscape; margin: 10mm; }
#print-stack, #sheet-preview-bar { display: none; }

/* 晒图一律走日览纸面：蓝图是屏幕上的一套灯下图，打印机给不出深蓝底。
   令牌就地覆盖在堆栈容器上 —— 屏上预览和出纸因此是同一份观感，
   不会出现「屏幕上深蓝、打出来白纸」的意外。 */
#print-stack {
  --paper: #FFFFFF;
  --paper-raised: #FFFFFF;
  --paper-sunk: #EDEAE2;
  --grid: transparent;
  --grid-bold: transparent;
  --ink: #1C1A16;
  --ink-2: #4A463E;
  --ink-3: #6E6659;
  --ink-4: #A69C8B;
  --hair: #D8D2C6;
  --hair-strong: #B4AA97;
  --shadow-1: none;
  --shadow-2: none;
  --hatch: rgba(76, 107, 78, .05);
  --spark-hist: #8F8878;
  --blueprint: #1F5D7C;
  --blueprint-2: #2C7BA0;
  --blueprint-soft: rgba(31, 93, 124, .10);
  --rust: #B0451D;
  --amber: #8A6310;
  --sage: #4C6B4E;
  --tint-ink: rgba(28, 26, 22, .04);
}
body.sheet-preview #print-stack {
  display: block; position: fixed; inset: 0; z-index: 9000;
  overflow: auto; background: var(--paper-sunk); padding: 58px 0 44px;
}
body.sheet-preview #toolbar, body.sheet-preview #stats-bar,
body.sheet-preview #board, body.sheet-preview #save-bar { display: none; }

#sheet-preview-bar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 9001;
  align-items: center; gap: 12px; padding: 9px 16px;
  background: var(--paper-raised); border-bottom: 1px solid var(--hair-strong);
  /* 纸面令牌下也要能点得动：这排按钮继承 .dlg 之外的样式，单独给一份 */
  font-family: var(--f-mono); font-size: 11px; color: var(--ink-2);
}
body.sheet-preview #sheet-preview-bar { display: flex; }
#sheet-preview-bar .pv-set {
  font-size: 9.5px; letter-spacing: .13em; text-transform: uppercase;
  color: var(--ink-3); flex: 1; min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
#sheet-preview-bar button {
  font-family: var(--f-mono); font-size: 11px; letter-spacing: .05em;
  padding: 6px 13px; border: 1px solid var(--hair-strong); border-radius: 0;
  background: transparent; color: var(--ink-2); cursor: pointer;
}
#sheet-preview-bar button.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
#sheet-preview-bar button:hover { border-color: var(--blueprint); color: var(--blueprint); }
#sheet-preview-bar button.primary:hover { background: var(--blueprint); color: #fff; }

/* 一张纸。A3 可印区 400×277mm，96dpi 下正好 1512×1047 CSS px，
   所以纸面永远按 1512 宽排版，屏上只做等比缩小 —— 所见即所出，
   不会出现「屏上两列、纸上三列」这种对不上的预览。
   --fv（屏上适配窗口宽的缩放）由 JS 写进 #print-stack：CSS calc 除不出
   无单位的比值（长度除以长度不合法），只能这么绕。打印时 --pvs 摁回 1。
   配平（--fc）从第九轮起**只吃图面**：页眉 / 统计条 / 图签栏是图纸的图框，
   永远按 100% 出；装不下时缩的是中间那块图面（见 .sheet-page > 图面块 那条
   与 SheetSet.fit()）。所以纸盒的宽与高只跟 --pvs 走，跟 --fc 无关。 */
.sheet-paper {
  --pvs: var(--fv, 1);
  width: calc(1512px * var(--pvs));
  height: calc(var(--nat, 1047px) * var(--pvs));
  margin: 0 auto 22px;
  background: var(--paper-raised); color: var(--ink);
  border: 1px solid var(--hair-strong);
  box-shadow: 0 2px 4px rgba(28, 26, 22, .06), 0 12px 30px rgba(28, 26, 22, .11);
}
.sheet-page {
  position: relative;
  display: flex; flex-direction: column;
  width: 1512px; min-height: 1047px;
  padding: 22px 26px 18px;
  transform-origin: 0 0; transform: scale(var(--pvs));
}
/* 图面块：配平只缩它。transform 不改变占位，所以 fit() 会把缩放后的高度差
   用图签栏的负 margin 补回来（否则图签栏挂在纸尾下面）；宽度按 100%/fc 重排
   再缩回满幅 —— 量过（probe_r9_width.py）：加宽之后高度一个像素都不变、
   28/24 个任务名一个也没重排，所以这一步只买「格子跟图框对齐」，不偷高度。 */
.sheet-page > .sheet-board, .sheet-page > .sheet-flow,
.sheet-page > .sheet-nil, .sheet-page > .toc {
  flex: 1 1 auto;
  transform: scale(var(--fc, 1)); transform-origin: 0 0;
}
/* 压到下限还是装不下 —— 预览里标出来，别等打印机吐出两张才发现 */
.sheet-paper.is-spill { outline: 1px dashed var(--rust); outline-offset: 3px; }
/* 量尺寸用的探针纸（SheetSet._probe）。负 left 不撑出横向滚动条，
   visibility:hidden 照样参与排版 —— 在它里面量到的高度就是真纸会有的高度。 */
#sheet-probe { position: absolute; top: 0; left: -20000px; visibility: hidden; pointer-events: none; }
.sheet-head {
  display: flex; align-items: flex-end; justify-content: space-between; gap: 14px;
  padding-bottom: 6px; border-bottom: 1px solid var(--ink);
}
.sh-title { font-family: var(--f-display); font-size: 17px; font-weight: 600; letter-spacing: .01em; }
.sh-sub {
  font-family: var(--f-mono); font-size: 9.5px; letter-spacing: .12em;
  text-transform: uppercase; color: var(--ink-3); margin-top: 5px;
}
.sh-right { text-align: right; font-family: var(--f-mono); font-size: 9.5px; letter-spacing: .1em; color: var(--ink-3); white-space: nowrap; }
.sh-right b { display: block; font-size: 15px; font-weight: 500; letter-spacing: .02em; color: var(--ink); margin-top: 2px; font-variant-numeric: tabular-nums; }
.sheet-page .card-del, .sheet-page .column-footer { display: none; }
/* 屏上那句「点击输入任务名称」是编辑提示，纸上没有可点的东西，
   留在晒出去的图上像是谁忘了填 —— 换成图纸的写法，只说它没名字。
   必须挑「里面确实挂着 placeholder」的那张卡：写成 .task-name::after 会给
   有名字的卡也补一刀，晒出来全是「示例项目 B（未命名）」。 */
.sheet-page .task-name .placeholder { display: none; }
.sheet-page .task-name:has(> .placeholder)::after { content: '（未命名）'; color: var(--ink-3); }
.sheet-page .task-card { cursor: default; animation: none; break-inside: avoid; }
.sheet-page .column { box-shadow: none; }
.sheet-page .column:hover { box-shadow: none; }
.sheet-page .column-body { overflow: visible; }

/* 按周连排：四列通栏。屏上看板是 4 列并排，纸上 1512px 宽同样放得下
   四个 100mm 图框 —— 旧的 2×2 排法是为了迁就屏幕宽度，纸面基准定死后
   就不必再把两周的高度叠进一张纸里。 */
.sheet-page .stat-bar { margin-top: 5mm; border-bottom: 1px solid var(--hair-strong); }
.sheet-board {
  display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 5mm 4mm; padding: 5mm 0 0; align-content: start;
}
/* 按人成册：一人一张，卡片走报纸分栏自动配平 */
.sheet-flow { padding: 5mm 0 0; column-count: 3; column-gap: 5mm; }
.sheet-flow.sparse { column-count: 2; }
.sheet-flow .task-card { break-inside: avoid; display: block; margin-bottom: 4mm; }

/* 图签栏（每页一条）。钉在纸的下边线：没被配平压的时候，是图面块的 flex-grow
   把剩余高度吃掉、把它顶到纸尾；被压的时候由 fit() 写一条负 margin-top 把它
   提回「图面视觉底边 + 6mm」—— 6mm 是最小间距，装不下时也不会贴住最后一张卡。
   留白在图框里是「这周就这么点活」，留在纸尾像没排版。 */
.tb { display: flex; flex-wrap: wrap; margin-top: 6mm; border: 1px solid var(--ink); }
.tb-cell {
  display: flex; flex-direction: column; gap: 3px;
  padding: 5px 12px; border-right: 1px solid var(--hair-strong);
  min-width: 74px;
}
.tb-cell:last-child { border-right: none; }
.tb-cell.grow { flex: 1; }
.tb-cell .anno { font-size: 7.5px; letter-spacing: .16em; }
.tb-val {
  font-family: var(--f-mono); font-size: 11px; font-weight: 500;
  color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap;
}
.tb-val.zh { font-family: var(--f-display); font-weight: 600; font-size: 12.5px; }

/* 目录页 */
.toc { padding-top: 5mm; }
.toc table { width: 100%; border-collapse: collapse; font-size: 11px; }
.toc th {
  text-align: left; padding: 5px 9px; font-family: var(--f-mono);
  font-size: 8.5px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase;
  color: var(--ink-3); border-bottom: 1px solid var(--hair-strong);
}
.toc td {
  padding: 6px 9px; border-bottom: 1px solid var(--hair);
  font-family: var(--f-mono); font-variant-numeric: tabular-nums; color: var(--ink-2);
}
.toc td.zh { font-family: var(--f-display); font-size: 12px; color: var(--ink); }
.toc tbody tr:last-child td { border-bottom: none; }
.toc td.num { text-align: right; }
/* 按人成册时卷与卷之间断开：换卷那一行的上边线加重并留一点呼吸 */
.toc tbody tr.vol-break td { border-top: 1.5px solid var(--ink-3); padding-top: 10px; }
.toc tbody tr.vol-break:first-child td { border-top: none; }
/* 卷小计：目录页把「摊开这一卷」的四件事说成一行 —— 张数、起止张次、任务数、欠几项。
   用的是 <th scope="row">而不是 <td>，有两个理由：语义上它给下面那几行当行头；而目录的
   张次三处对账取的是 `tbody tr > td:first-child`，这一行没有 td，就不会把「VOL 01 · 易榆乔」
   当成某张纸的张次读走。它顺带替掉了换卷那道加重线（有小计时不再给首行加 vol-break）。 */
.toc tbody tr.toc-vol th {
  padding: 4px 9px 3px; line-height: 1.25; font-size: 10.5px; letter-spacing: .03em;
  text-transform: none; font-family: var(--f-mono); color: var(--ink-3);
  border-top: 1.5px solid var(--ink-3); border-bottom: none; white-space: nowrap;
}
.toc tbody tr.toc-vol th b { color: var(--ink); font-weight: 600; letter-spacing: .1em; }
.toc tbody tr.toc-vol th i { font-style: normal; color: var(--rust); font-weight: 500; }
.toc tbody tr.toc-vol th i.ok { color: var(--sage); }   /* 欠 0 项也得说得出话，同横表那条 */
/* 第一卷的小计紧贴在表头那条下线底下，再压一道重线就是双杠了。 */
.toc tbody tr.toc-vol:first-child th { border-top: none; }
.toc-note {
  margin-top: 6mm; padding-top: 4mm; border-top: 1px dashed var(--hair-strong);
  font-size: 11.5px; line-height: 1.75; color: var(--ink-2);
}

/* 目录页的第二张表：人 × 周。上面那张按「张」列，读图的人要问的却是
   「这周压在谁身上、还欠几项」—— 那是另一个轴。格内写「未完成 / 任务数」，
   底下那道细条是负荷（按全表最满的一格归一），跟看板列头那串负荷格同一套语汇。
   按人成册时这张表还是空卷的证据：那格是 0，就是那人那周没出卷，不是漏排。
   负荷条**绝对定位、不参与行高**：横表要是能把纸面撑高，`_paginate` 探针量过的
   那笔账就得重算，一条装饰不值得。 */
.toc-matrix { margin-top: 7mm; }
.toc-matrix .tm-cap {
  display: flex; align-items: baseline; gap: 10px; margin-bottom: 2px;
  font-family: var(--f-mono); font-size: 8.5px; letter-spacing: .14em;
  text-transform: uppercase; color: var(--ink-3);
}
.toc-matrix .tm-cap b {
  font-family: var(--f-display); font-size: 12px; font-weight: 500;
  letter-spacing: .04em; text-transform: none; color: var(--ink); flex-shrink: 0;
}
.toc-matrix table { table-layout: fixed; }
.toc-matrix th { text-align: center; }
.toc-matrix th.tm-p { text-align: left; }
.toc-matrix td.tm-c { text-align: center; position: relative; white-space: nowrap; }
.toc-matrix td.tm-p { text-align: left; white-space: nowrap; }
.toc-matrix .tm-p i.md {
  display: inline-block; width: 6px; height: 6px; margin-right: 7px;
  transform: rotate(45deg); box-shadow: 0 0 0 1px rgba(0,0,0,.06);
}
.toc-matrix .tm-k { color: var(--rust); font-weight: 500; }
.toc-matrix .tm-k.ok { color: var(--sage); }          /* 欠 0 项也得说得出话 */
.toc-matrix .tm-nil .tm-k { color: var(--ink-3); }    /* 那格压根没排 */
.toc-matrix .tm-s { color: var(--ink-3); padding: 0 3px; }
.toc-matrix .tm-n { color: var(--ink-2); }
/* 轨道居中并**封顶 132px**：两周那一册一格有 496px 宽，通栏的条就是 478px，胖成两块墨板，
   「按最满的一格归一」这把尺子也跟着忽长忽短。封顶之后两册的条落在同一档里：
   两周 132px（被上限夹住）、八周 106px（一格只有 124px，本来就没顶到）。
   别写成「两册一样长」——那是句假话，实测见 PROGRESS 的「版面留档」末段。 */
.toc-matrix i.tm-bar {
  position: absolute; left: 50%; transform: translateX(-50%); bottom: 2px;
  width: calc(100% - 18px); max-width: 132px; height: 2px;
  background: var(--hair); font-style: normal;
}
.toc-matrix i.tm-bar b { display: block; height: 100%; background: var(--ink-3); }
.toc-matrix tr.tm-sum td { border-top: 1px solid var(--hair-strong); }
/* 合计那一格与网格之间隔一道发丝线：负荷条到这儿收住，没有这条线会读成「最后一周」 */
.toc-matrix th:last-child, .toc-matrix td:last-child { border-left: 1px solid var(--hair); }
/* 合计行的「未完成 / 任务数」不另起颜色：铁锈色在这张表里只有一个意思（欠项），
   换色就把这个意思弄丢了。那一行的分量由上面的加重横线与「全组合计」四个字担。 */
.toc-matrix tr.tm-sum .tm-n { color: var(--ink); }

/* 空册占位页：一张「此页无图」，虚线框是留给图纸本身的语汇，不是报错样式 */
.sheet-nil {
  display: flex; align-items: center; justify-content: center;
  min-height: 640px; padding: 10mm 0;
}
.sheet-nil .nil-box {
  width: 74%; padding: 12mm 10mm; text-align: center;
  border: 1px dashed var(--hair-strong); background: var(--paper);
}
.sheet-nil .nil-t {
  font-family: var(--f-display); font-size: 21px; letter-spacing: .06em; color: var(--ink);
}
.sheet-nil .nil-w {
  margin-top: 5mm; font-size: 12px; line-height: 1.85; color: var(--ink-2);
}
.sheet-nil .nil-meta {
  margin-top: 8mm; padding-top: 4mm; border-top: 1px solid var(--hair);
  font-family: var(--f-mono); font-size: 9.5px; letter-spacing: .1em; color: var(--ink-3);
}

@media print {
  /* 剖面线、尺寸线填充是这张图的信息，不能让浏览器默认的背景打印抹掉 */
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  html, body { height: auto; overflow: visible; background: #fff; }
  body { display: block; background-image: none; }
  #toolbar, #save-bar, #settings-overlay, #sheet-overlay, #toast,
  #stats-bar, #board, #sheet-preview-bar { display: none !important; }
  /* 必须连 `body.sheet-preview #print-stack` 一起写、并且带 !important：
     预览层那条规则的特异性（id + class）比这里的光 `#print-stack` 高，
     压不住的话打印时容器仍然是 `position: fixed; overflow: auto` 的一屏，
     打印机只看得到第一屏 —— 第二张之后的纸**静默消失**，一句错都不报。
     「预览 → 晒图」正是主路径，2026-09-21 用 page.pdf() 数页数才抓到它。 */
  #print-stack, body.sheet-preview #print-stack {
    display: block !important; position: static !important; inset: auto !important;
    overflow: visible !important; background: #fff; padding: 0 !important;
  }
  /* 屏上的纸边、投影与留白是给眼睛的；出纸只保留分页与图面配平。
     纸盒尺寸只跟 --pvs 走，而打印时 --pvs 摁回 1 —— 纸永远是满幅的 1512×1047，
     缩的只有图面那块（--fc），图框（页眉/统计条/图签栏）出纸时是 100%。
     盒高要跟 --nat 对上，否则会「画只占一张纸、盒子占两张纸」平白多吐一张白纸。 */
  .sheet-paper {
    --pvs: 1;
    margin: 0; border: none; box-shadow: none; outline: none;
    break-after: page; page-break-after: always;
  }
  .sheet-paper:last-child { break-after: auto; page-break-after: auto; }
  /* #sheet-probe 是产品自己量尺寸用的那张「看不见的纸」（见 SheetSet._probe）：
     它不在 #print-stack 里，出纸时必须按掉，否则会多吐一张白纸。 */
  #sheet-probe { display: none !important; }
}
</style>
</head>
<body>

<div id="print-stack"></div>

<script>
// ======================================================================
// Constants
// ======================================================================
const C = {
  STORAGE_KEY: 'renderDeptWeeklyTracker',
  THEME_KEY: 'renderTrackerTheme',
  SCHEMA_VERSION: 3,
  // 备份文件/云端数据能被读进来的历史版本（v2 没有 tombstones，读时补上）
  READABLE_VERSIONS: [1, 2, 3],
  MEMBERS: ['易榆乔', '杨威', '易灿', '刘新金'],
  DOT_CLASSES: ['dot-c0','dot-c1','dot-c2','dot-c3'],
  PRIORITIES: ['高', '中', '低'],
  STATUSES: ['未开始', '进行中', '已完成'],
  PRIO_CLASSES: { '高': 'prio-high', '中': 'prio-med', '低': 'prio-low' },
  PRIO_CODES: { '高': 'P1', '中': 'P2', '低': 'P3' },
  FIELD_CN: {
    name: '名称', priority: '优先级', status: '状态', progress: '进度',
    startDate: '开始日期', dueDate: '截止日期', notes: '备注', person: '负责人',
  },
  // 跨周算「修订」只看任务定义，不看进度与状态
  DELTA_FIELDS: ['priority', 'startDate', 'dueDate', 'notes'],
};

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// ======================================================================
// FilterState — Search & status filter
// ======================================================================
const FilterState = {
  search: '',
  statusFilter: 'all', // 'all' | '未开始' | '进行中' | '已完成'

  apply(tasks) {
    let result = tasks;
    if (this.statusFilter !== 'all') {
      result = result.filter(t => t.status === this.statusFilter);
    }
    if (this.search) {
      const q = this.search.toLowerCase();
      result = result.filter(t =>
        (t.name || '').toLowerCase().includes(q) ||
        (t.notes || '').toLowerCase().includes(q)
      );
    }
    return result;
  },
};

// ======================================================================
// GistSync — GitHub Gist data sync
// ======================================================================
const GistSync = {
  CONFIG_KEY: 'renderTrackerSyncConfig',
  DEFAULT_GIST_ID: '1c847a7d6d0e61fb090eb581d5e988b7',
  // SECURITY: TODO — 这个 token 不应硬编码在源码中，待迁移到用户输入方式。
  // 当前仅限内部使用，切勿将此文件公开托管。
  DEFAULT_TOKEN: 'ghp_' + 'Zhox7ql0pCmgMR03n93sNVclmUj9Up1I7Uwq',

  loadConfig() {
    try {
      const raw = localStorage.getItem(this.CONFIG_KEY);
      const saved = raw ? JSON.parse(raw) : {};
      return {
        gistId: saved.gistId || this.DEFAULT_GIST_ID,
        token: saved.token || this.DEFAULT_TOKEN,
      };
    } catch {
      return { gistId: this.DEFAULT_GIST_ID, token: this.DEFAULT_TOKEN };
    }
  },

  saveConfig(cfg) {
    localStorage.setItem(this.CONFIG_KEY, JSON.stringify(cfg));
  },

  // 用户自己在设置里填过的那份；没填就是空对象。
  // 不能拿 loadConfig() 的返回值做判断 —— 它会把内置默认值一起兜进来。
  loadSaved() {
    try { return JSON.parse(localStorage.getItem(this.CONFIG_KEY)) || {}; }
    catch { return {}; }
  },

  isConfigured() {
    const cfg = this.loadConfig();
    return !!(cfg.gistId && cfg.token);
  },

  authHeaders() {
    const h = { Accept: 'application/vnd.github+json' };
    const token = this.loadSaved().token;
    if (token) h.Authorization = `Bearer ${token}`;
    return h;
  },

  // 本次会话是否真的读到过云端。没读到过的时候本地就是张「过期孤本」，
  // 任何上传都得先补一次拉取合并 —— 直接推等于用孤本覆盖共享板子。
  reachable: false,

  // 把远端合进当前看板。所有「先拉后推」的路径都走这里，免得两处各写一遍
  // merge + save + 重绘，改一处漏一处。
  applyRemote(remote) {
    if (!remote) return false;
    this.reachable = true;
    const merged = this.merge(DataModel.state, remote);
    if (merged !== DataModel.state) {
      DataModel.state = merged;
      Storage.save(merged);
      Renderer.renderAll(DataModel.state.currentWeek, true);
    }
    return true;
  },

  async pull() {
    const cfg = this.loadConfig();
    if (!cfg.gistId) return null;
    const url = `https://api.github.com/gists/${cfg.gistId}`;
    const attempts = [];
    const savedToken = this.loadSaved().token;
    if (savedToken) attempts.push({ Authorization: `Bearer ${savedToken}`, Accept: 'application/vnd.github+json' });
    // 这份 Gist 不记名也可读：token 失效时至少要让大家重新看见同一张板子，
    // 不能因为 401 就把所有人的视图降级成各自 localStorage 里的孤本。
    attempts.push({ Accept: 'application/vnd.github+json' });
    let lastErr = null;
    for (const headers of attempts) {
      try {
        const resp = await fetch(url, { headers });
        if (!resp.ok) { lastErr = new Error(`HTTP ${resp.status}`); continue; }
        // 200 就算够得着云端，哪怕文件还没建（新 Gist 首次配置时是这个情况）
        this.reachable = true;
        const gist = await resp.json();
        const file = Object.values(gist.files)[0];
        if (!file || !file.content) return null;
        return JSON.parse(file.content);
      } catch (e) { lastErr = e; }
    }
    console.warn('Gist pull failed:', lastErr && lastErr.message);
    return null;
  },

  // 最近一次失败的细节，供状态栏说人话
  lastError: null,

  async push(state) {
    const cfg = this.loadConfig();
    if (!cfg.gistId || !cfg.token) { this.lastError = 'nosync'; return false; }
    try {
      const content = JSON.stringify(state, null, 2);
      const resp = await fetch(`https://api.github.com/gists/${cfg.gistId}`, {
        method: 'PATCH',
        headers: { Authorization: `Bearer ${cfg.token}`, Accept: 'application/vnd.github+json' },
        body: JSON.stringify({
          files: { 'weekly-data.json': { content } },
        }),
      });
      if (!resp.ok) {
        this.lastError = resp.status === 401 || resp.status === 403 ? 'auth' : `http${resp.status}`;
        throw new Error(`HTTP ${resp.status}`);
      }
      this.lastError = null;
      return true;
    } catch (e) {
      if (!this.lastError) this.lastError = 'network';
      console.warn('Gist push failed:', e.message);
      return false;
    }
  },

  // Merge remote into local: tasks from either side kept, deduped by id.
  // Remote wins on conflict (same id, newer updatedAt).
  // 删除靠墓碑传播：两边 tombstones 取并集，「删得比最后一次修改晚」的那一方说话算数。
  // 之后要是有人把它改新了（撤销删除、重建），墓碑自动作废 —— 不然删过一次就再也还不回来了。
  // 远端没有新内容时原样返回 localState，便于调用方按引用判断是否有变化。
  merge(localState, remoteState) {
    if (!remoteState || !Array.isArray(remoteState.tasks)) return localState;
    const taskMap = new Map();
    (localState.tasks || []).forEach(t => taskMap.set(t.id, t));
    let changed = false;
    remoteState.tasks.forEach(t => {
      const existing = taskMap.get(t.id);
      if (existing) {
        if (t.updatedAt > existing.updatedAt) { taskMap.set(t.id, t); changed = true; }
      } else {
        taskMap.set(t.id, t); changed = true;
      }
    });
    const tombs = Object.assign({}, remoteState.tombstones, localState.tombstones);
    Object.keys(tombs).forEach(id => {
      const t = taskMap.get(id);
      if (!t) return;                       // 任务已经不在了，墓碑继续留着往外传
      if (tombs[id] >= (t.updatedAt || t.createdAt || '')) { taskMap.delete(id); changed = true; }
      else { delete tombs[id]; changed = true; }
    });
    if (!changed) return localState;
    return {
      ...localState,
      schemaVersion: C.SCHEMA_VERSION,
      tasks: Array.from(taskMap.values()),
      tombstones: tombs,
      currentWeek: localState.currentWeek || remoteState.currentWeek,
    };
  },

  // Debounced push: call after every save, batches uploads
  _pushTimer: null,
  pushDebounced(state) {
    if (!this.isConfigured()) return;
    clearTimeout(this._pushTimer);
    SaveBtn.setUnsaved();
    this._pushTimer = setTimeout(() => this._doPush(state), 3000);
  },

  // Immediate push (called by save button)
  async saveNow(state) {
    if (!this.isConfigured()) return false;
    clearTimeout(this._pushTimer);
    return await this._doPush(state);
  },

  async _doPush(state) {
    this._pushTimer = null;   // 一旦开跑就没有「等待上传」这回事了，pagehide 不该再补发
    SaveBtn.setSaving();
    SyncStatus.syncing();
    if (!this.reachable) {
      // 一次都没读到过云端：先拉一次，把要上传的东西变成并集；拉不到就干脆不传。
      const remote = await this.pull();
      if (!this.reachable) {
        SaveBtn.setError('net');
        SyncStatus.error('连不上云端 · 已拒绝上传（避免覆盖别人的板子）');
        return false;
      }
      this.applyRemote(remote);
      state = DataModel.state;
    }
    const ok = await this.push(state);
    if (ok) {
      SaveBtn.setSaved();
      SyncStatus.configured();
    } else {
      const kind = this.lastError === 'auth' ? 'auth' : 'net';
      SaveBtn.setError(kind);
      // 只说「同步失败」会让人以为是网不好，白重试半天
      const why = {
        auth: 'Token 已失效，只能看不能传 · 重新填 Token',
        network: '连不上 GitHub · 点击重试',
        nosync: '未配置同步',
      }[this.lastError] || ('云端拒绝 · 点击重试');
      SyncStatus.error(why);
    }
    return ok;
  },

  // 防抖那 3 秒里关掉页面，改动就悄悄丢了 —— 而按钮那时正显示「点击上传到云端」，
  // 谁都不会觉得自己没存上。pagehide 里用 keepalive 补发一次，浏览器会替我们把请求送完。
  flushOnHide() {
    window.addEventListener('pagehide', () => {
      if (!this._pushTimer) return;
      this._pushTimer = null;
      if (!this.reachable) return;            // 本次会话没读到过云端，宁可不发（见 _doPush）
      const cfg = this.loadConfig();
      if (!cfg.gistId || !cfg.token) return;
      fetch(`https://api.github.com/gists/${cfg.gistId}`, {
        method: 'PATCH',
        keepalive: true,
        headers: { Authorization: `Bearer ${cfg.token}`, Accept: 'application/vnd.github+json' },
        body: JSON.stringify({ files: { 'weekly-data.json': { content: JSON.stringify(DataModel.state, null, 2) } } }),
      }).catch(() => {});
    });
  },
};

// ======================================================================
// SaveBtn — Floating save button at bottom center

const SaveBtn = {
  _set(cls, icon, text) {
    const btn = document.getElementById('btn-save');
    btn.className = cls;
    btn.querySelector('.save-icon').textContent = icon;
    btn.querySelector('.save-text').textContent = text;
  },
  setSaved()   { this._set('saved',   '✓', '已同步'); },
  setUnsaved() { this._set('unsaved', '↑', '点击上传到云端'); },
  setSaving()  { this._set('saving',  '◎', '上传中…'); },
  // 401 时「点击重试」是句假话：重试一万次也不会通，得去设置里换 Token
  setError(kind) {
    if (kind === 'auth') this._set('error', '!', 'Token 失效 · 去设置里换');
    else this._set('error', '↻', '同步失败 · 点击重试');
  },
};

// ======================================================================
// SyncStatus — UI indicator
// ======================================================================
const SyncStatus = {
  _timer: null,

  set(state, text) {
    const el = document.getElementById('sync-status');
    const txt = document.getElementById('sync-text');
    el.className = state;
    if (state === 'configured') el.classList.add('configured');
    txt.textContent = text || '';
    if (state === 'configured') {
      // After synced, auto-fade to idle
      clearTimeout(this._timer);
      this._timer = setTimeout(() => { txt.textContent = ''; }, 2000);
    }
  },

  showConfigured() {
    document.getElementById('sync-status').classList.add('configured');
  },

  configured() { this.set('synced', '已同步'); },
  syncing()  { this.set('syncing', '同步中...'); },
  error(msg) { this.set('error', msg || '同步失败'); },
  notConfigured() {
    document.getElementById('sync-status').classList.remove('configured');
    document.getElementById('sync-status').className = '';
    document.getElementById('sync-text').textContent = '未配置同步';
  },
};

// ======================================================================
// Toast
// ======================================================================
const Toast = {
  _timer: null,
  show(msg, timeoutMs = 2000) {
    const el = document.getElementById('toast');
    el.textContent = msg; el.classList.add('show');
    clearTimeout(this._timer);
    this._timer = setTimeout(() => el.classList.remove('show'), timeoutMs);
  },
  showUndo(msg, onUndo, timeoutMs = 5000) {
    const el = document.getElementById('toast');
    el.innerHTML = '';
    const span = document.createElement('span');
    span.textContent = msg;
    el.appendChild(span);
    const btn = document.createElement('button');
    btn.textContent = '撤销';
    btn.style.cssText = 'background:transparent;color:var(--paper);border:1px solid var(--paper);border-radius:0;padding:2px 9px;margin-left:12px;cursor:pointer;font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;opacity:.85;';
    btn.addEventListener('mouseenter', () => { btn.style.opacity = '1'; });
    btn.addEventListener('mouseleave', () => { btn.style.opacity = '.85'; });
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      clearTimeout(this._timer);
      el.classList.remove('show');
      onUndo();
    });
    el.appendChild(btn);
    el.classList.add('show');
    clearTimeout(this._timer);
    this._timer = setTimeout(() => el.classList.remove('show'), timeoutMs);
  }
};

// ======================================================================
// WeekUtils — ISO 8601 week calculations (unchanged from v1)
// ======================================================================
const WeekUtils = {
  getMonday(d) {
    const c = new Date(d);
    const day = c.getDay() || 7;
    c.setDate(c.getDate() - day + 1);
    c.setHours(0,0,0,0);
    return c;
  },
  getISOWeek(d) {
    const monday = this.getMonday(d);
    const thursday = new Date(monday);
    thursday.setDate(monday.getDate() + 3);
    const year = thursday.getFullYear();
    const jan4 = new Date(year, 0, 4);
    const jan4Monday = this.getMonday(jan4);
    const weekNum = Math.round(((thursday - jan4Monday) / 86400000) / 7) + 1;
    return { year, week: weekNum };
  },
  formatWeekStr(y, w) { return y + '-W' + String(w).padStart(2, '0'); },
  parseWeekStr(str) {
    const m = str.match(/^(\d{4})-W(\d{2})$/);
    return m ? { year: +m[1], week: +m[2] } : null;
  },
  weekStrToMonday(weekStr) {
    const p = this.parseWeekStr(weekStr);
    if (!p) return new Date();
    const jan4 = new Date(p.year, 0, 4);
    const jan4Monday = this.getMonday(jan4);
    const r = new Date(jan4Monday);
    r.setDate(jan4Monday.getDate() + (p.week - 1) * 7);
    return r;
  },
  getWeekDateRange(weekStr) {
    const monday = this.weekStrToMonday(weekStr);
    const sunday = new Date(monday);
    sunday.setDate(monday.getDate() + 6);
    return { start: monday, end: sunday };
  },
  // 制图标注写法：09.15 — 09.21
  formatDimRange(weekStr) {
    const r = this.getWeekDateRange(weekStr);
    const p = n => String(n).padStart(2, '0');
    const a = p(r.start.getMonth() + 1) + '.' + p(r.start.getDate());
    const b = p(r.end.getMonth() + 1) + '.' + p(r.end.getDate());
    return a + ' — ' + b;
  },
  addWeeks(weekStr, delta) {
    const monday = this.weekStrToMonday(weekStr);
    monday.setDate(monday.getDate() + delta * 7);
    const iso = this.getISOWeek(monday);
    return this.formatWeekStr(iso.year, iso.week);
  },
  isCurrentWeek(weekStr) {
    const now = this.getISOWeek(new Date());
    return weekStr === this.formatWeekStr(now.year, now.week);
  },
};

// ======================================================================
// Storage
// ======================================================================
const Storage = {
  load() {
    try {
      const raw = localStorage.getItem(C.STORAGE_KEY);
      if (!raw) return this.getDefault();
      const state = JSON.parse(raw);
      if (!state) return this.getDefault();
      if (state.schemaVersion === 1) return this.migrateV1toV2(state);
      if (state.schemaVersion === 2) return this.migrateV2toV3(state);
      if (state.schemaVersion !== C.SCHEMA_VERSION) return this.getDefault();
      return state;
    } catch (e) {
      return this.getDefault();
    }
  },

  // 备份导入 / 云端数据都要走这一步，别在多处各写一遍版本判断
  upgrade(state) {
    if (!state || typeof state !== 'object') return state;
    if (state.schemaVersion === 1) return this.migrateV1toV2(state);
    if (state.schemaVersion === 2) return this.migrateV2toV3(state);
    return state;
  },

  // v2 → v3：只多了一张删除墓碑表，任务本身一个不动
  migrateV2toV3(v2) {
    return { ...v2, schemaVersion: C.SCHEMA_VERSION, tombstones: v2.tombstones || {} };
  },

  // Async load: local first, then try remote merge.
  // 返回同一个引用表示远端没有带来变化。
  async loadAsync(local) {
    if (!GistSync.isConfigured()) {
      SyncStatus.notConfigured();
      return local;
    }
    SyncStatus.showConfigured();
    SyncStatus.syncing();
    const remote = await GistSync.pull();
    if (remote) {
      const merged = GistSync.merge(local, remote);
      this.save(merged);
      SyncStatus.configured();
      return merged;
    }
    SyncStatus.error('无法获取远程数据');
    return local;
  },

  migrateV1toV2(v1) {
    // Convert old per-person-progress tasks to new per-person tasks
    const newTasks = [];
    if (Array.isArray(v1.tasks)) {
      v1.tasks.forEach(t => {
        if (t.progress) {
          C.MEMBERS.forEach(m => {
            const prog = t.progress[m];
            if (!prog) return;
            newTasks.push({
              id: t.id + '_' + m,
              person: m,
              name: t.name || '',
              priority: t.priority || '中',
              progress: prog.percentage || 0,
              status: prog.status || '未开始',
              startDate: t.startDate || '',
              dueDate: t.dueDate || '',
              notes: t.notes || '',
              week: t.week || v1.currentWeek,
              createdAt: t.createdAt || new Date().toISOString(),
              updatedAt: t.updatedAt || new Date().toISOString(),
            });
          });
        }
      });
    }
    return {
      schemaVersion: C.SCHEMA_VERSION,
      currentWeek: v1.currentWeek || this.getDefault().currentWeek,
      tasks: newTasks,
      tombstones: {},
    };
  },

  save(state) {
    try {
      localStorage.setItem(C.STORAGE_KEY, JSON.stringify(state));
    } catch (e) {
      Toast.show('存储空间不足，请清理旧数据');
    }
  },

  getDefault() {
    const now = WeekUtils.getISOWeek(new Date());
    return {
      schemaVersion: C.SCHEMA_VERSION,
      currentWeek: WeekUtils.formatWeekStr(now.year, now.week),
      tasks: [],
      tombstones: {},
    };
  },
};

// ======================================================================
// DataModel — Simplified for per-person tasks
// ======================================================================
const DataModel = {
  state: null,

  init(raw) {
    this.state = raw;
    if (!this.state.tombstones) this.state.tombstones = {};
    this._normalizeOrder();
  },

  // Gist 上的旧数据没有 order，按数组顺序补在末尾，避免排序时互相覆盖
  _normalizeOrder() {
    const tasks = this.state.tasks || [];
    let max = -1;
    tasks.forEach(t => { if (typeof t.order === 'number' && t.order > max) max = t.order; });
    tasks.forEach(t => { if (typeof t.order !== 'number') t.order = ++max; });
  },

  _nextOrder() {
    return (this.state.tasks || []).reduce((m, t) => Math.max(m, t.order || 0), 0) + 1;
  },

  _byOrder(a, b) { return (a.order || 0) - (b.order || 0); },

  // 跨周比对用的身份：同一负责人 + 同一任务名视为同一条任务
  weekKey(t) { return t.person + '\u241f' + t.name; },

  // 「周」化成一个可比的整数（周一的毫秒数除以 7 天，四舍五入抵掉夏令时那一小时）。
  // 有了它，「上一周有没有这条」「连续排了几周」就是集合上的加减，不用到处
  // 拿 addWeeks 在字符串上算 —— 跨年那一周最容易算错（W52 → 次年 W01）。
  weekOrdinal(weekStr) {
    // 三道关，只放过**真存在**的 ISO 周：
    //   ① 非字符串 / 空 —— 合并进来的种子可能压根没有 `week` 字段，而 `undefined.match`
    //      会当场抛；tenureCtx 是整板与出图共用的账本，一条脏数据不该把整页渲染带走。
    //   ② 写法不对（少一位、W99）—— parseWeekStr 只认 W01..W53 那种两位写法。
    //   ③ 写法对但那一周不存在（例如 2025-W53，2025 年只有 52 周）—— 不回写一遍的话，
    //      weekStrToMonday 会一路加出界、落到次年第一周上，于是两条本来不同周的任务
    //      拿到**同一个序号**，在册数就凭空多出一周。宁可认成「不在任何一周里」。
    if (typeof weekStr !== 'string' || !weekStr) return null;
    const p = WeekUtils.parseWeekStr(weekStr);
    if (!p) return null;
    const monday = WeekUtils.weekStrToMonday(weekStr);
    const back = WeekUtils.getISOWeek(monday);
    if (back.year !== p.year || back.week !== p.week) return null;
    return Math.round(monday.getTime() / 6048e5);
  },

  // 一次遍历搭好的跨周账本：
  //   at  = Map<weekKey, Set<周序号>>   这条任务出现在哪些周
  //   sig = Map<weekKey + 周序号, 签名> 那一周它的定义字段（DELTA_FIELDS）长什么样
  // taskMarks 与 _weekMarks 都只从这里读，所以「上一周有没有」全页只有一处判断。
  tenureCtx() {
    const at = new Map(), sig = new Map();
    (this.state.tasks || []).forEach(t => {
      const o = this.weekOrdinal(t.week);
      if (o === null) return;
      const k = this.weekKey(t);
      let s = at.get(k);
      if (!s) at.set(k, s = new Set());
      s.add(o);
      sig.set(k + '\u241f' + o, this._deltaSig(t));
    });
    return { at, sig };
  },

  // 定义字段的签名：与原来那套逐字段 stringify 一字不差，只是收在一处。
  _deltaSig(t) {
    return C.DELTA_FIELDS.map(f => String(t[f] == null ? '' : t[f])).join('\u241f');
  },

  // 一条任务在这一周的跨周读数：
  //   streak  = 含本周在内、连续在册的周数（1 == 上一周没有 == 「新增」那同一件事）
  //   earlier = 这一段**起点之前**还有几周在册（> 0 就是「断过之后重开的」）
  //   delta   = 'new' | 'rev' | ''
  // 只往回看不往前看：读数与「这次出图排了几周」「看板停在第几周」都无关，
  // 所以同一周的同一张卡，屏上那张与纸上那张量到的是同一个数。earlier 也守这条：
  // 它数的是比本周更早的周，本周之后又排了几周不会改它。
  // 60 是防死循环的保险，不是量程（真实数据里最长的一条连续挂在 6 周）。
  taskMarks(task, ctx) {
    const c = ctx || this.tenureCtx();
    const out = { streak: 0, earlier: 0, delta: '' };
    const o = this.weekOrdinal(task.week);
    if (o === null) return out;
    const k = this.weekKey(task);
    const s = c.at.get(k);
    if (!s || !s.has(o)) return out;              // 任务自己就在表里，理论到不了
    let n = 1;
    while (n < 60 && s.has(o - n)) n++;
    out.streak = n;
    // 起点（o - n + 1）的前一格必定不在集合里 —— 上面那个 while 就是在那一格停下的，
    // 所以「更早还有周」与「中间断过」是同一件事，不用另外找断点。
    // 保险烧掉时（n 撞到 60）那一格**可能**还在集合里，这时「断过」会读成假话，
    // 所以宁可少说：这一段之外一律不计。
    if (n < 60) {
      const first = o - n + 1;
      s.forEach(m => { if (m < first) out.earlier++; });
    }
    if (!s.has(o - 1)) out.delta = 'new';
    else if (c.sig.get(k + '\u241f' + (o - 1)) !== this._deltaSig(task)) out.delta = 'rev';
    return out;
  },

  getTasks(weekStr) {
    return this.state.tasks.filter(t => t.week === weekStr).sort(this._byOrder);
  },

  getTasksByPerson(weekStr, person) {
    return this.state.tasks
      .filter(t => t.week === weekStr && t.person === person)
      .sort(this._byOrder);
  },

  getPrevWeekTasks(weekStr) {
    const prev = WeekUtils.addWeeks(weekStr, -1);
    return this.state.tasks.filter(t => t.week === prev);
  },

  newTask(weekStr, person) {
    return {
      id: 't_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8),
      person,
      name: '',
      priority: '中',
      progress: 0,
      status: '未开始',
      startDate: '',
      dueDate: '',
      notes: '',
      week: weekStr,
      order: this._nextOrder(),
      createdAt: new Date().toISOString(),
      updatedAt: new Date().toISOString(),
    };
  },

  addTask(weekStr, person) {
    const task = this.newTask(weekStr, person);
    this.state.tasks.push(task);
    this._save();
    return task;
  },

  updateField(taskId, field, value) {
    const task = this.state.tasks.find(t => t.id === taskId);
    if (!task) return;
    UndoStack.push('修改' + (C.FIELD_CN[field] || field));
    const from = task[field], wasStatus = task.status, wasProgress = task.progress;
    task[field] = value;
    if (field === 'status') this._applyStatusConstraint(task);
    else if (field === 'progress') this._applyProgressConstraint(task);
    // 值和联动项都没动就不留痕：否则修订表会多出「83→83」这种废行，撤销栈也被白占一格
    if (task[field] === from && task.status === wasStatus && task.progress === wasProgress) {
      UndoStack.discard();
      return;
    }
    task.updatedAt = new Date().toISOString();
    this._record(task, field, from, task[field]);
    // 状态与进度互相联动，被带着改的那一项也要单独留痕，否则修订表少一行
    if (field !== 'status' && task.status !== wasStatus) this._record(task, 'status', wasStatus, task.status);
    if (field !== 'progress' && task.progress !== wasProgress) this._record(task, 'progress', wasProgress, task.progress);
    this._save();
  },

  // 修订记录一行的上限 30 条；应用没有登录态，所以不记「修改人」
  _record(task, field, from, to) {
    const h = task.history || (task.history = []);
    h.push({ at: task.updatedAt, field, from, to });
    if (h.length > 30) h.shift();
  },

  _applyStatusConstraint(task) {
    if (task.status === '未开始') task.progress = 0;
    else if (task.status === '已完成') task.progress = 100;
    else if (task.progress === 0) task.progress = 1;
    else if (task.progress >= 100) task.progress = 99;
  },

  _applyProgressConstraint(task) {
    if (task.progress === 0) task.status = '未开始';
    else if (task.progress >= 100) { task.progress = 100; task.status = '已完成'; }
    else task.status = '进行中';
  },

  copyIncompleteFromPrev(weekStr) {
    const prevTasks = this.getPrevWeekTasks(weekStr);
    const pending = prevTasks.filter(t => t.status !== '已完成' && t.progress < 100);
    // 同名同人视为已复制过，避免连点两下就翻倍
    const existing = new Set(this.getTasks(weekStr).map(t => this.weekKey(t)));
    const incomplete = pending.filter(t => !existing.has(this.weekKey(t)));
    const skipped = pending.length - incomplete.length;

    const stamp = Date.now();
    const copies = incomplete.map((t, i) => {
      const copy = JSON.parse(JSON.stringify(t));
      copy.id = `t_${stamp}_${i}_${Math.random().toString(36).slice(2, 8)}`;
      copy.week = weekStr;
      copy.progress = 0;
      copy.status = '未开始';
      copy.order = this._nextOrder();   // 深拷贝会带上源任务的 order，会和本周撞位
      copy.createdAt = new Date().toISOString();
      copy.updatedAt = new Date().toISOString();
      this.state.tasks.push(copy);
      return copy;
    });
    if (copies.length > 0) this._save();
    return { copies, skipped };
  },

  _save() { Storage.save(this.state); GistSync.pushDebounced(this.state); },

  // 删除必须留痕：没有墓碑的话，云端那份会把它当成「你这边还没有的新任务」原样还回来。
  tombstone(ids) {
    const now = new Date().toISOString();
    this.state.tombstones = this.state.tombstones || {};
    ids.forEach(id => { this.state.tombstones[id] = now; });
  },
  untombstone(id) {
    if (this.state.tombstones) delete this.state.tombstones[id];
  },
};

// ======================================================================
// Backup — 本地 JSON 导出 / 导入（同步失败或换机时的兜底）
// ======================================================================
const Backup = {
  fileName() {
    const d = new Date();
    const pad = n => String(n).padStart(2, '0');
    return `周任务备份-${DataModel.state.currentWeek}-${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}.json`;
  },

  exportFile() {
    const blob = new Blob([JSON.stringify(DataModel.state, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = this.fileName();
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    return DataModel.state.tasks.length;
  },

  // 返回 null 表示可以导入，否则返回给用户看的原因
  check(data) {
    if (!data || typeof data !== 'object') return '文件内容不是一份备份';
    if (!Array.isArray(data.tasks)) return '缺少 tasks 列表';
    if (C.READABLE_VERSIONS.indexOf(data.schemaVersion) === -1) {
      return `版本 ${data.schemaVersion} 打不开，当前版本 ${C.SCHEMA_VERSION}`;
    }
    if (data.tasks.some(t => !t || typeof t.id !== 'string' || typeof t.week !== 'string')) {
      return '有任务缺少 id 或 week';
    }
    return null;
  },

  // 导入 = 一次「远端合并」：走同步那同一套 merge（并集 + updatedAt 新者胜 + 墓碑），
  // 免得这里再写一份「按 id 无条件覆盖」的逻辑，两处规则迟早打架。
  // 所以拿旧备份导入不会盖掉本周的新改动；视图也停在当前周，不把人跳走。
  merge(data) {
    const incoming = Storage.upgrade(data);
    const before = new Set(DataModel.state.tasks.map(t => t.id));
    DataModel.state = GistSync.merge(DataModel.state, incoming);
    if (!DataModel.state.tombstones) DataModel.state.tombstones = {};
    DataModel._normalizeOrder();
    const added = DataModel.state.tasks.filter(t => !before.has(t.id)).length;
    return { added, total: incoming.tasks.length };
  },
};

// ======================================================================
// Renderer — Card-based layout
// ======================================================================
const Renderer = {
  // 展开着修订表的卡片；重渲染后要靠它还原，所以不能只存在 DOM 上
  openRevs: new Set(),

  // noAnim：局部改动（拖拽落位、撤销）不要整版重播入场动画。
  // 类留在 board 上直到下一次带动画的渲染，中途摘掉会让现有卡片重新开始动画。
  renderAll(weekStr, noAnim) {
    document.getElementById('board').classList.toggle('no-anim', !!noAnim);
    this.renderToolbar(weekStr);
    this.renderStats(weekStr);
    this.renderBoard(weekStr);
  },

  renderToolbar(weekStr) {
    const p = WeekUtils.parseWeekStr(weekStr);
    const label = p ? `${p.year}年第${p.week}周` : esc(weekStr);
    const flag = WeekUtils.isCurrentWeek(weekStr) ? '<em class="wk-flag">本周</em>' : '';
    document.getElementById('week-label').innerHTML =
      `<span class="wk-main">${label}${flag}</span><span class="date-range">${WeekUtils.formatDimRange(weekStr)}</span>`;
  },

  renderStats(weekStr) {
    const filtered = FilterState.apply(DataModel.getTasks(weekStr));
    const total = filtered.length;
    const done = filtered.filter(t => t.status === '已完成').length;
    const rate = total > 0 ? Math.round(done / total * 100) : 0;
    const lvl = rate >= 80 ? 'is-good' : rate >= 50 ? 'is-warn' : 'is-bad';

    let html = `<div class="stat-cell"><span class="anno">任务总数</span><span class="stat-value">${total}</span></div>`;
    html += `<div class="stat-cell"><span class="anno">已完成</span><span class="stat-value">${done}<em>/${total}</em></span></div>`;
    html += `<div class="stat-cell wide"><span class="anno">完成率</span><span class="stat-value ${lvl}">${rate}<em>%</em></span><span class="rate-track ${lvl}"><i style="width:${rate}%"></i></span></div>`;

    C.MEMBERS.forEach((person, i) => {
      const tasks = FilterState.apply(DataModel.getTasksByPerson(weekStr, person));
      const personDone = tasks.filter(t => t.status === '已完成').length;
      const personRate = tasks.length > 0 ? Math.round(personDone / tasks.length * 100) : 0;
      html += `<div class="stat-person">
        <div class="sp-top"><span class="stat-dot ${C.DOT_CLASSES[i]}"></span><span class="sp-name">${esc(person)}</span><span class="sp-num"><b>${personDone}</b>/${tasks.length}</span></div>
        <div class="sp-bar"><i style="width:${personRate}%"></i></div>
      </div>`;
    });

    html += `<div class="stat-legend"><span class="lg-not">未开始</span><span class="lg-prog">进行中</span><span class="lg-done">已完成</span></div>`;
    document.getElementById('stats-bar').innerHTML = html;
  },

  renderBoard(weekStr) {
    const board = document.getElementById('board');
    const marks = this._weekMarks(weekStr);
    const load = this._weekLoad(weekStr);
    let html = '';
    C.MEMBERS.forEach(person => {
      const tasks = FilterState.apply(DataModel.getTasksByPerson(weekStr, person));
      html += this._renderColumn(person, tasks, load, marks);
    });
    board.innerHTML = html;
  },

  // 卡右上角那两枚跨周徽标的全部输入，一整个星期一次算清：
  //   delta  = Map<weekKey, 'new' | 'rev'>  与上一周比：本周没有的算新增，定义字段变了的算修订
  //   streak = Map<weekKey, n>              这条连续在册到第几周（1 = 上一周没有）
  //   broken = Map<weekKey, m>              这一段之前还断续排过几周（0 = 头一遭，没断过）
  // 进度和状态不计入 delta —— 那是这张表要跟踪的内容，不是任务的修订。
  // 两个读数摊在同一次 tenureCtx 上（见 DataModel.taskMarks），所以「没有上一周」
  // 与「第 1 周」是同一句话，不会一枚徽标说没有、另一枚说有。
  // （2026-09-23 之前这里只有一个 `_weekDelta`，返回的就是上面那个 delta Map。）
  // broken 是第十轮添的：`第 2 周` 那枚徽标只说「连着第几周」，断过之后重开的那一条
  // 与一直连着的读出来一模一样，而这件事当时只有点开卡片或看横表才知道。
  _weekMarks(weekStr) {
    const ctx = DataModel.tenureCtx();
    const delta = new Map(), streak = new Map(), broken = new Map();
    DataModel.state.tasks.forEach(t => {
      if (t.week !== weekStr) return;
      const m = DataModel.taskMarks(t, ctx);
      if (m.delta) delta.set(DataModel.weekKey(t), m.delta);
      streak.set(DataModel.weekKey(t), m.streak);
      broken.set(DataModel.weekKey(t), m.earlier);
    });
    return { delta, streak, broken };
  },

  // 最近 8 周（含本周）每人接了多少项，纯本地计数
  _weekLoad(weekStr) {
    const weeks = [];
    for (let i = 7; i >= 0; i--) weeks.push(WeekUtils.addWeeks(weekStr, -i));
    const slot = new Map(weeks.map((w, i) => [w, i]));
    const grid = C.MEMBERS.map(() => weeks.map(() => 0));
    DataModel.state.tasks.forEach(t => {
      const i = slot.get(t.week);
      const p = C.MEMBERS.indexOf(t.person);
      if (i !== undefined && p >= 0) grid[p][i]++;
    });
    return { weeks, grid };
  },

  _sparkline(weeks, counts) {
    const max = Math.max(1, ...counts);
    return `<span class="spark" aria-hidden="true">` + counts.map((n, i) => {
      const cls = i === counts.length - 1 ? ' class="now"' : (n === 0 ? ' class="zero"' : '');
      return `<i${cls} style="height:${Math.round(n / max * 100)}%" title="${esc(weeks[i])} · ${n} 项"></i>`;
    }).join('') + `</span>`;
  },

  // opts 只服务出图：divLabel 换掉列头那枚子图幅号，idSuffix 让同一页里的
  // column-* / col-body-* 不跟看板或别的页撞名（一张纸上是四个人的列）。
  _renderColumn(person, tasks, load, marks, opts) {
    const o = opts || {};
